<style>

*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font-size:14px}button,select,input{font:inherit}button{color:inherit;cursor:pointer}button:disabled{cursor:default;opacity:.45}button:focus-visible,summary:focus-visible,select:focus-visible{outline:2px solid #418c6c;outline-offset:2px}button svg{pointer-events:none}[hidden]{display:none!important}
.app{max-width:1730px;margin:auto;padding:0 22px 20px}.mast{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:12px}.branding{display:flex;gap:13px;align-items:center}.logo{display:grid;place-items:center;width:44px;height:44px;border-radius:9px;background:var(--green);color:white;flex:none}.logo .icon{width:27px;height:27px}.mast h1{margin:0;font-size:clamp(21px,2.25vw,31px);line-height:1.2;letter-spacing:.045em}.code{white-space:nowrap;font-size:12px;border:1px solid #ccdacf;border-radius:6px;color:var(--green);padding:7px 10px;background:#f5f8f4}

.drawing-bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1px 5px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}.views{display:flex;gap:4px;flex-wrap:wrap;padding:5px 8px}.views button,.seg button{background:#fff;border:1px solid #dce5db;border-radius:6px;padding:5px 8px;font-size:12px;white-space:nowrap}.views button:hover,.seg button:hover{background:#f3f7f2}.views button[aria-pressed=true],.seg button[aria-pressed=true]{background:#e9f2e8;border-color:#a9cbb3;color:var(--green);font-weight:750}

.icon{display:block;width:17px;height:17px}.rail{display:grid;gap:8px}.panel{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}.panel>summary{display:flex;gap:8px;align-items:center;list-style:none;min-height:43px;padding:10px 13px;font-weight:750;cursor:pointer}.panel>summary::-webkit-details-marker{display:none}.panel>summary::after{content:"";width:7px;height:7px;margin:-4px 2px 0 auto;border-bottom:1.5px solid #668072;border-right:1.5px solid #668072;transform:rotate(45deg)}.panel[open]>summary::after{margin-top:4px;transform:rotate(225deg)}.panel>summary:hover{background:#f5f8f4}.panel>summary .icon{color:var(--green)}.panel-body{padding:0 12px 12px}.seg{display:grid;grid-template-columns:1fr 1fr;gap:5px}.seg button{min-height:32px;padding:6px 3px}.topic-type button{font-size:13px}
.topic-type{margin-bottom:5px}.explain{margin:8px 0 5px;padding:9px 10px;background:#f5faf5;border:1px solid #d7e8dc;border-radius:7px}.explain-hello{display:grid;grid-template-columns:106px minmax(0,1fr);gap:8px;align-items:center}.explain .desc{font-size:12px;line-height:1.4;margin:0;color:var(--green)}.explain svg{display:block;width:106px;height:51px;border:1px solid #e2ebe1;border-radius:5px;background:white}.link-button{padding:5px 7px;border:1px solid #cfdfd2;border-radius:5px;background:white;color:var(--green);font-size:11px;margin-top:7px}.link-button:hover{background:#eff6ef}.jog-btn{margin-top:5px}.jog-btn[aria-pressed=true]{background:var(--tint);border-color:#a9cbb3;font-weight:700}
.compare-table{width:100%;border-collapse:collapse;font-size:11.5px;line-height:1.4;table-layout:fixed}.compare-table th,.compare-table td{padding:5px 6px;border:1px solid #dce6dc;vertical-align:middle;text-align:left;word-wrap:break-word}.compare-table th{color:#355244;background:#eef4ed;font-weight:700}.compare-table th:first-child{width:22%}.compare-table tbody th{background:#f7f8f5;font-weight:650;color:#456052}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:7px 4px}.checks label{display:flex;align-items:center;gap:5px;font-size:12px}.checks input{width:15px;height:15px;accent-color:var(--green);margin:0}.zoom{display:flex;align-items:center;gap:5px;margin-top:10px}.zoom button,.zoom output{min-width:30px;min-height:30px;display:grid;place-items:center;border:1px solid #dce5db;border-radius:5px;background:white}.zoom output{border-color:transparent;font-size:12px;width:43px}.zoom button:hover:not(:disabled){background:var(--tint)}.source-line{margin:0;font-size:12px;line-height:1.7;color:var(--muted)}
#sheet text{user-select:none}.mark{color:#202923;cursor:pointer;outline:0}.mark:focus-visible,.mark:hover{color:#875135}.mark.selected{color:#a34b29}
.app:fullscreen{overflow:auto;background:var(--page);max-width:none;padding-inline:22px}.app:fullscreen .workspace{grid-template-columns:minmax(0,1fr) minmax(335px,26%)}
.hide-direction #detail-direction{display:none}.detail-index{display:block;width:100%;height:auto;background:#f8faf6;border:1px solid #dce6dc;border-radius:6px;margin-bottom:7px}
@media(max-width:1060px){.app{padding-inline:12px}.workspace{gap:9px}.scene-strip button{padding-inline:9px}.views button{padding-inline:5px}}
@media(max-width:770px){.mast{min-height:66px}.code{display:none}.app,.app:fullscreen{padding-inline:8px}.workspace,.app:fullscreen .workspace{grid-template-columns:1fr}.rail{grid-template-columns:1fr 1fr}.wide-panel{grid-column:1/-1}.plot #sheet{min-height:260px}.scene-strip button{font-size:12px}.views button{font-size:11px}.explain .desc{font-size:13px}}
@media(max-width:405px){.rail{grid-template-columns:1fr}.views{justify-content:flex-start}.scene-strip{padding-inline:3px}.scene-strip button{padding-inline:7px}}
@media print{.mast,.drawing-bar,.rail{display:none}.app{padding:0;background:white}.workspace{display:block}.drawing,.plot{border:0}}

<div class="app" id="app">
<header class="mast">
  <div class="branding"><div class="logo"><svg class="icon" aria-hidden="true"><use href="#i-brand"/></svg></div><div><h1>剖切符号识读</h1></div></div>

</header>
<main class="workspace">
  <section class="drawing" aria-label="图纸画面">

    <div class="drawing-bar">
      <div id="scenes" class="scene-strip" role="tablist" aria-label="教学案例"></div>

    </div>
    <div id="plot" class="plot" role="tabpanel" aria-labelledby="scene-house">
      <svg id="sheet" viewBox="0 0 1000 635" aria-label="剖切平面图和结果图"></svg>
      <div class="tip" id="bubble" hidden></div>
    </div>
  </section>
  <aside class="rail" aria-label="教学工具托盘">
    <details class="panel wide-panel" id="knowledge" open>
      <summary><svg class="icon" aria-hidden="true"><use href="#i-book"/></svg>知识点</summary>
      <div class="panel-body">
        <div id="types" class="seg topic-type" role="group" aria-label="符号类型">
          <button type="button" data-type="section">剖视剖切符号</button>
          <button type="button" data-type="cross">断面剖切符号</button>
        </div>
        <div id="methods" class="seg" role="group" aria-label="画法">
          <button type="button" data-method="common">常用画法</button>
          <button type="button" data-method="intl">国际通用画法</button>
        </div>
        <article id="explain" class="explain" aria-live="polite"></article>
        <button type="button" id="jog" class="link-button jog-btn" aria-pressed="false">转折剖切示例</button>
      </div>
    </details>
    <details class="panel wide-panel" open>
      <summary><svg class="icon" aria-hidden="true"><use href="#i-layer"/></svg>图层</summary>
      <div class="panel-body checks">
        <label><input id="base" type="checkbox" checked>底图</label>
        <label><input id="annotations" type="checkbox" checked>标注</label>
        <label><input id="direction" type="checkbox" checked>观看方向</label>
        <label><input id="guide" type="checkbox">剖切路径</label>
      </div>
    </details>
    <details class="panel wide-panel">
      <summary><svg class="icon" aria-hidden="true"><use href="#i-book"/></svg>剖视与断面对照</summary>
      <div class="panel-body">
        <table class="compare-table">
          <thead><tr><th scope="col">对比</th><th scope="col">剖面</th><th scope="col">断面</th></tr></thead>
          <tbody id="comparison"></tbody>
        </table>
      </div>
    </details>
    <details class="panel wide-panel">
      <summary><svg class="icon" aria-hidden="true"><use href="#i-book"/></svg>剖视详图索引</summary>
      <div class="panel-body">
        <svg class="detail-index" viewBox="0 0 360 156" role="img" aria-label="图 7.2.2(c) 剖视详图索引。细引出线位于粗剖切位置线上方，向上观看。上半圆为详图号 3，下半圆为图纸号 4。">
          <g fill="none" stroke="#24362e">
            <circle cx="96" cy="85" r="32" stroke-width="1.3"/>
            <path d="M64 85H270" stroke-width="1.3"/>
            <path d="M212 94H270" stroke-width="3.2"/>
          </g>
          <g fill="none" stroke="#60776a" stroke-width="1">
            <path d="M168 62L157 81M218 118L229 99"/>
          </g>
          <g font-size="19" fill="#24362e" text-anchor="middle">
            <text x="96" y="77">3</text>
            <text x="96" y="107">4</text>
          </g>
          <g font-size="13" fill="#344f42">
            <text x="140" y="56">引出线</text>
            <text x="181" y="134">剖切位置线</text>
          </g>
          <g id="detail-direction" fill="#236a4f">
            <path d="M247 79V43m-5 6 5-6 5 6" fill="none" stroke="#236a4f" stroke-width="1.9"/>
            <text x="260" y="49" font-size="13">观看方向</text>
          </g>
        </svg>
        <p class="source-line">图 7.2.2(c)　引出线在上，向上看。</p>
      </div>
    </details>
    <details class="panel">
      <summary>视图工具</summary>
      <div class="panel-body"><div class="zoom" role="group" aria-label="视图工具">
        <button id="minus" type="button" aria-label="缩小"><svg class="icon"><use href="#i-minus"/></svg></button>
        <output id="zoom-value" aria-label="缩放比例">100%</output>
        <button id="plus" type="button" aria-label="放大"><svg class="icon"><use href="#i-plus"/></svg></button>
        <button id="reset" type="button" aria-label="复位视图"><svg class="icon"><use href="#i-reset"/></svg></button>
        <button id="full" type="button" aria-label="全屏教学"><svg class="icon"><use href="#i-full"/></svg></button>
      </div></div>
    </details>
    <details class="panel">
      <summary><svg class="icon" aria-hidden="true"><use href="#i-book"/></svg>规范依据</summary>
      <div class="panel-body"><p class="source-line">GB/T 50001—2017《房屋建筑制图统一标准》§7.1、§7.2、§10.3.1。宜优先采用国际通用画法，同一套图纸统一画法。</p></div>
    </details>
  </aside>
</main>
</div>
<script>
"use strict";
const byId = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const state = {
  scene:"house", view:"plan", type:"section", method:"common", jog:false, picked:false,
  base:true, annotations:true, direction:true, guide:false, zoom:1, cx:500, cy:317.5
};
const drawingLayers=["base","annotations","direction","guide"];
const scenes = {
  house:{
    title:"坡屋顶小屋",tab:"房子",code:"A", ends:[[172,250],[728,250]],
    viewTarget:[425,129]
  },
  park:{
    title:"河岸草地景观",tab:"草地 · 河 · 桥 · 亭",code:"L",ends:[[20,322],[880,322]],
    viewTarget:[701,181]
  },
  bridge:{
    title:"园林步桥构件",tab:"独立步桥构件",code:"B",ends:[[468,92],[468,394]],
    viewTarget:[753,243]
  }
};
const cutTypes={
  section:{title:"剖视剖切符号",result:"剖面图",n:"1"},
  cross:{title:"断面剖切符号",result:"断面图",n:"2"}
};
const views={plan:"平面图",compare:"同位对照",section:"剖面图",cross:"断面图"};
const sheetFor=(scene,type)=>scene.code+(type==="section"?"02":"03");
const titleFor = type => cutTypes[type].n+"–"+cutTypes[type].n+" "+cutTypes[type].result;
const safe = value => String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const rect=(x,y,w,h,fill,stroke="none",sw=1,rx=0)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`;
const circle=(x,y,r,fill,stroke="none",sw=1)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`;
const path=(d,stroke="none",sw=1,fill="none",dash="")=>`<path d="${d}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"${dash?` stroke-dasharray="${dash}"`:""}/>`;
const text=(x,y,v,size=15,color="#324b3f",anchor="start",weight=550)=>`<text x="${x}" y="${y}" fill="${color}" font-size="${size}" text-anchor="${anchor}" font-weight="${weight}" font-family="Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif" pointer-events="none">${safe(v)}</text>`;
const number=(x,y,v,size=15,weight=650)=>`<text x="${x}" y="${y}" fill="currentColor" font-family="Arial,sans-serif" dominant-baseline="central" text-anchor="middle" font-size="${size}" font-weight="${weight}" pointer-events="none">${safe(v)}</text>`;
const group=(body,transform="")=>`<g${transform?` transform="${transform}"`:""}>${body}</g>`;
const polyline=points=>points.map(([x,y],i)=>(i?"L":"M")+x+" "+y).join("");
const layer=(kind,body)=>`<g data-projection="${kind}">${body}</g>`;
const drawingDefs=`<defs>
  <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#e8ede2" stroke-width=".68"/></pattern>
  <pattern id="grass" width="29" height="24" patternUnits="userSpaceOnUse"><rect width="29" height="24" fill="#edf2df"/><path d="M5 7l2-3 1 3m10 11 1-2 2 2M24 4l2 2M8 21l1-2" stroke="#a2b396" stroke-width=".6" fill="none"/></pattern>
  <pattern id="water" width="38" height="22" patternUnits="userSpaceOnUse"><rect width="38" height="22" fill="#dbece9"/><path d="M2 6h15m4 10h13" fill="none" stroke="#8eadaa" stroke-width=".7"/></pattern>
  <pattern id="walk" width="22" height="18" patternUnits="userSpaceOnUse"><rect width="22" height="18" fill="#f2eadb"/><path d="M0 0H22V18M0 9H22M11 0V9" fill="none" stroke="#c9bc9e" stroke-width=".65"/></pattern>
  <pattern id="wood" width="12" height="33" patternUnits="userSpaceOnUse"><rect width="12" height="33" fill="#e9d7b5"/><path d="M0 0V33M0 16h12" stroke="#a98c61" stroke-width=".67" fill="none"/></pattern>
  <pattern id="floor" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#f8f3e9"/><path d="M0 24V0H24" fill="none" stroke="#caba9e" stroke-width=".66"/></pattern>
  <pattern id="cut-material" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#e7ede5"/><path d="M0 0v8" stroke="#859787" stroke-width="1.1"/></pattern>
  <pattern id="cut-wood" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#ebdfc5"/><path d="M0 0v8" stroke="#a49069" stroke-width="1.1"/></pattern>
  <pattern id="brick-cut" width="10" height="8" patternUnits="userSpaceOnUse"><rect width="10" height="8" fill="#e7dccc"/><path d="M0 0H10M0 4H10M5 0V4M0 4V8" stroke="#aa9278" stroke-width=".6" fill="none"/></pattern>
  <pattern id="soil" width="22" height="14" patternUnits="userSpaceOnUse"><rect width="22" height="14" fill="#eee5d5"/><path d="M2 7l4-2 1 1m8 6 4-2m-4-6 2-2" stroke="#a5987c" stroke-width=".65" fill="none"/></pattern>
</defs>`;
function tree(x,y,s=1){
  return group(path("M-28-10Q-28-20-18-23Q-10-32 1-29Q11-33 19-24Q29-23 28-12Q35-5 29 5Q32 17 22 21Q18 29 8 28Q0 33-8 28Q-21 30-24 19Q-33 14-29 5Q-34-2-28-10Z","#789870",1,"#dce9d0")+
    path("M0 0l-16-16m16 16L4-21M0 0l17-11M0 0l16 12M0 0l-3 18M0 0l-18 9","#86a07b",.8)+circle(0,0,3,"#f8faf1","#5c7853"),`translate(${x} ${y}) scale(${s})`);
}
function silhouetteTree(x,y,s=1){
  return group(path("M0 0v-78m0 40-18-23m18 10 15-22","#778e75",2)+path("M-36-70q-7-17 4-27 3-16 20-16 10-17 26-7 15-5 22 9 16 5 15 20 9 10-1 23-11 10-24 6-11 13-24 4-17 5-28-4-9-2-11-8Z","#789272",1.15,"#dfe9d9"),`translate(${x} ${y}) scale(${s})`);

function north(x,y){
  return group(circle(0,0,14,"#fffefa","#627a69",.9)+path("M0-14 6 9 0 5-6 9Z","#3b5849",1,"#fffefa")+path("M0-14V5L-6 9Z","none",1,"#3b5849")+text(0,-19,"北",12,"#355746","middle"),`translate(${x} ${y})`);
}

  return rect(x,y,52,22,"#dcccac","#8f8064",.9,2)+rect(x+8,y-9,13,9,"#f7f2e5","#9c8d72",.8,2)+rect(x+30,y+22,13,9,"#f7f2e5","#9c8d72",.8,2);
}
const houseWindows=[[286,386],[400,504],[518,614]];
function housePlan(){
  const wall="#42574a", glazing="#aaccc7";
  let d=rect(74,37,752,406,"url(#grass)","#8b9c83",1);
  d+=rect(119,118,652,252,"url(#walk)","#a29d89",.9,5)+rect(404,365,92,78,"url(#walk)","#a29d89",.9);
  d+=path("M214 101H686V389H214ZM450 101V389","#788e7e",1,"none","6 5");
  d+=rect(242,119,416,251,"url(#floor)","#526b5c",1);
  d+=rect(242,119,23,251,wall)+rect(635,119,23,251,wall);
  d+=rect(265,347,153,23,wall)+rect(482,347,153,23,wall);
  let wallStart=265;
  for(const [x0,x1] of houseWindows){
    d+=rect(wallStart,119,x0-wallStart,23,wall);
    d+=rect(x0,122,x1-x0,17,"#e3eeec","#577266",1);
    d+=path(`M${x0} 129H${x1}M${(x0+x1)/2} 122V139`,glazing,1.3);
    wallStart=x1;
  }
  d+=rect(wallStart,119,635-wallStart,23,wall);

function symbol(points,dir,type,method,page,mini=false){
  const [dx,dy]=facing[dir];
  const a=points[0], b=points[points.length-1];
  const cross=type==="cross", n=cutTypes[type].n;
  if(method==="intl"){
    const r=mini?8.7:15.5;

    return path(polyline(lineEnds),"currentColor",mini?1:1.22)+indexBall(...a,n,page,dir,r)+
      (cross?path(`M${b[0]} ${b[1]}l${dx*(mini?14:25)} ${dy*(mini?14:25)}`,"currentColor",mini?3:5.6):indexBall(...b,n,page,dir,r));
  }
  const positionLength=mini?18:32, directionLength=mini?11:19, heavy=mini?2.25:3.35;
  function cap(p,q,first){
    const [x,y]=p, t=along(p,q,positionLength);

      const mid=[(x+t[0])/2,(y+t[1])/2];
      const off=mini?8.8:12.3;

        (first?number(mid[0]-dx*(mini?8.7:13.7),mid[1]-dy*(mini?8.7:13.7),page,mini?7.6:11,500):"");
    }
    const elbow=[x+dx*directionLength,y+dy*directionLength];
    return path(polyline([t,p,elbow]),"currentColor",heavy)+
      number(elbow[0]+dx*(mini?7:11),elbow[1]+dy*(mini?7:11),n,mini?10:16)+
      (first?number(x-dx*(mini?8.7:13.7),y-dy*(mini?8.7:13.7),page,mini?7.6:11,500):"");

    const q=along(p,points[i],mini?8:19),r=along(p,points[i+2],mini?8:19);
    const tx=p[0]-Math.sign(q[0]+r[0]-2*p[0])*(mini?10:21);

  state.cx=Math.max(w/2,Math.min(1000-w/2,state.cx));
  state.cy=Math.max(h/2,Math.min(635-h/2,state.cy));
  svg.setAttribute("viewBox",`${state.cx-w/2} ${state.cy-h/2} ${w} ${h}`);
  svg.classList.toggle("zoomed",state.zoom>1);
  byId("zoom-value").textContent=Math.round(state.zoom*100)+"%";
  byId("minus").disabled=state.zoom<=1;
  byId("plus").disabled=state.zoom>=3;
}
function zoomBy(multiplier,point=null){
  const next=Math.min(3,Math.max(1,state.zoom*multiplier));
  if(next===state.zoom) return;
  if(point){
    const ratio=state.zoom/next;
    state.cx=point.x-(point.x-state.cx)*ratio;
    state.cy=point.y-(point.y-state.cy)*ratio;
  }
  state.zoom=next;
  updateViewBox();
}
const sceneList=byId("scenes");
sceneList.innerHTML=Object.entries(scenes).map(([key,v])=>`<button id="scene-${key}" data-scene="${key}" type="button" role="tab" aria-controls="plot">${v.tab}</button>`).join("");
sceneList.addEventListener("click",e=>{
  const button=e.target.closest("[data-scene]");
  if(button) setScene(button.dataset.scene);
});
sceneList.addEventListener("keydown",e=>{
  const buttons=[...sceneList.querySelectorAll("button")],i=buttons.indexOf(e.target);
  const f={ArrowLeft:(i+buttons.length-1)%buttons.length,ArrowRight:(i+1)%buttons.length,Home:0,End:buttons.length-1};
  if(i<0||!(e.key in f)) return;
  e.preventDefault();
  const btn=buttons[f[e.key]];
  setScene(btn.dataset.scene);
  btn.focus();
});
byId("views").innerHTML=Object.entries(views).map(([key,v])=>`<button type="button" data-view="${key}">${v}</button>`).join("");
for(const id of ["views","explain"]) byId(id).addEventListener("click",e=>{
  const button=e.target.closest("[data-view]");
  if(!button) return;
  setView(button.dataset.view);
  if(id==="explain") byId(id).querySelector("[data-view]")?.focus({preventScroll:true});
});
byId("types").addEventListener("click",e=>{
  const button=e.target.closest("[data-type]");
  if(button) selectType(button.dataset.type);
});
byId("methods").addEventListener("click",e=>{
  const button=e.target.closest("[data-method]");
  if(!button) return;
  state.method=button.dataset.method;
  if(state.view==="section"||state.view==="cross") setView("plan");
  else render();
});
byId("jog").addEventListener("click",()=>setView(state.jog?"plan":"jog"));
drawingLayers.forEach(key=>byId(key).addEventListener("change",()=>{
  state[key]=byId(key).checked;
  byId("bubble").hidden=true;
  draw();
}));
byId("plus").addEventListener("click",()=>zoomBy(1.25));
byId("minus").addEventListener("click",()=>zoomBy(1/1.25));
byId("reset").addEventListener("click",()=>{resetCamera();updateViewBox();});
byId("full").disabled=!document.fullscreenEnabled;
byId("full").addEventListener("click",async()=>{
  if(document.fullscreenElement) await document.exitFullscreen();
  else if(document.fullscreenEnabled) await byId("app").requestFullscreen();
});
document.addEventListener("fullscreenchange",()=>byId("full").setAttribute("aria-label",document.fullscreenElement?"退出全屏":"全屏教学"));
svg.addEventListener("wheel",e=>{
  if(!e.ctrlKey&&!e.metaKey) return;
  e.preventDefault();
  const matrix=svg.getScreenCTM();
  if(!matrix) return;
  const p=svg.createSVGPoint();
  p.x=e.clientX; p.y=e.clientY;
  zoomBy(e.deltaY<0?1.12:1/1.12,p.matrixTransform(matrix.inverse()));
},{passive:false});
let gesture=null, bubbleTimer=0;
svg.addEventListener("pointerdown",e=>{
  if(!e.isPrimary||e.button!==0) return;
  const matrix=svg.getScreenCTM();
  if(!matrix) return;
  window.clearTimeout(bubbleTimer);
  byId("bubble").hidden=true;
  const type=e.target.closest("[data-marker]")?.dataset.marker;
  gesture={type,pointer:e.pointerId,x:e.clientX,y:e.clientY,cx:state.cx,cy:state.cy,scale:matrix.a,drag:false,held:false,timer:0};
  if(type) gesture.timer=window.setTimeout(()=>{
    if(!gesture||gesture.drag) return;
    gesture.held=true;
    selectType(type,true);
    showName(type,e.clientX,e.clientY);
  },450);
  svg.setPointerCapture(e.pointerId);
});
svg.addEventListener("pointermove",e=>{
  if(!gesture||gesture.pointer!==e.pointerId) return;
  const dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;
  if(Math.hypot(dx,dy)>7){
    window.clearTimeout(gesture.timer);
    gesture.drag=true;
  }
  if(!gesture.drag||gesture.held||state.zoom<=1) return;
  svg.classList.add("dragging");
  state.cx=gesture.cx-dx/gesture.scale;
  state.cy=gesture.cy-dy/gesture.scale;
  updateViewBox();
});
function finishPointer(e,cancel){
  if(!gesture||gesture.pointer!==e.pointerId) return;
  const g=gesture;
  gesture=null;
  window.clearTimeout(g.timer);
  if(!cancel&&g.type&&!g.held&&!g.drag) selectType(g.type,true);
  if(g.held) bubbleTimer=window.setTimeout(()=>{byId("bubble").hidden=true;},1500);
  svg.classList.remove("dragging");
}
svg.addEventListener("pointerup",e=>finishPointer(e,false));
svg.addEventListener("pointercancel",e=>finishPointer(e,true));
svg.addEventListener("lostpointercapture",e=>finishPointer(e,true));
svg.addEventListener("contextmenu",e=>{if(e.target.closest("[data-marker]")||gesture?.held) e.preventDefault();});
svg.addEventListener("keydown",e=>{
  const type=e.target.closest("[data-marker]")?.dataset.marker;
  if(!type||![" ","Enter"].includes(e.key)) return;
  e.preventDefault();
  selectType(type,true);
  svg.querySelector(`[data-marker="${type}"]`)?.focus();
});
render();

</script>
</body>
