<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="GB/T 50001—2017 第11.8节标高识读互动教学">
<title>标高识读 · 大一上 Studio 05</title>
<style>
:root{color-scheme:light;--bg:#edf1eb;--paper:#fdfefa;--ink:#20372e;--muted:#53665d;--accent:#1f624a;--line:#d9e2d9;--soft:#e9f1e9;--gold:#895115;--font:"Microsoft YaHei","Noto Sans CJK SC","PingFang SC",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 var(--font)}
button,input,select{font:inherit}
button,select{cursor:pointer}
button{color:inherit}
button:focus-visible,summary:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button:disabled{cursor:default;opacity:.4}
header{background:#fcfdf9;border-bottom:1px solid var(--line)}
.header-inner{max-width:1710px;margin:auto;padding:21px 38px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:17px}
.brand-mark{width:48px;height:48px;display:grid;place-items:center;background:#225b44;border-radius:13px;color:white;flex:none}
.brand-mark svg{width:29px}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--accent);font-weight:700}
h1{font-family:"Source Han Serif SC","Noto Serif CJK SC","Songti SC",SimSun,serif;font-size:33px;line-height:1.2;letter-spacing:.045em;margin:3px 0 0}
.header-ref{text-align:right;font-size:13px;color:var(--muted)}
.header-ref strong{display:block;font-family:ui-monospace,Consolas,monospace;color:#224b3a;font-size:15px;font-weight:650;letter-spacing:.01em}
main{max-width:1710px;margin:0 auto;padding:24px 38px 18px;display:grid;grid-template-columns:minmax(0,1fr) 322px;gap:18px;align-items:start}
.viewer,.tray section{background:var(--paper);border:1px solid var(--line);border-radius:14px}
.viewer{overflow:hidden;min-width:0}
.viewer:fullscreen{background:var(--paper);display:flex;flex-direction:column}
.viewer:fullscreen #stage{flex:1;min-height:0}
.viewer:fullscreen .viewer-head,.viewer:fullscreen .viewer-foot{flex:none}
.viewer-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 13px;border-bottom:1px solid var(--line);background:#fdfefa}
.tabs,.quick-tools{display:flex;align-items:center;gap:4px}
.tabs{overflow:auto;scrollbar-width:thin}
.tab,.icon-btn,.action{background:transparent;border:1px solid transparent;border-radius:8px}
.tab{padding:8px 13px;white-space:nowrap;color:#46594e;font-weight:650}
.tab:hover,.icon-btn:hover,.action:hover{background:#edf3ed}
.tab[aria-selected="true"]{background:var(--soft);border-color:#d9e8dc;color:#194d39}
.icon-btn{min-width:34px;height:34px;display:grid;place-items:center;padding:5px}
.icon-btn svg,.action svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
.stage{position:relative;background:#f5f8f2;overflow:hidden;min-height:540px;height:clamp(560px,calc(100dvh - 260px),830px);isolation:isolate;background-image:radial-gradient(#b8c9bc 0.65px,transparent 0.65px);background-size:17px 17px;background-position:center}
.stage-meta{position:absolute;left:19px;top:16px;z-index:2;pointer-events:none}
.stage-meta strong{display:block;font-family:"Source Han Serif SC","Noto Serif CJK SC","Songti SC",SimSun,serif;color:#29483b;font-size:22px;font-weight:750;line-height:1.3}
.stage-meta span{display:block;margin-top:5px;color:var(--muted);font-size:12px}
#plot{position:absolute;display:block;width:100%;height:calc(100% - 86px);top:85px;left:0;color:#273a33;touch-action:none;user-select:none;cursor:grab}
#plot.panning{cursor:grabbing}
#plot.mono .wash,#plot.mono .finish,.mono .finish>*{fill:#fafbf7!important}
#plot.mono .soft-line{opacity:.4}
#plot.mono .glass{fill:#f5f7f4}
#plot .outline{stroke:#42584b;stroke-width:1.35}
#plot .soft-line{stroke:#77897d;stroke-width:1;fill:none}
#plot .space{font:13px var(--font);letter-spacing:.09em;fill:#466055;paint-order:stroke;stroke:#f8faf5;stroke-width:3.2px;stroke-linejoin:round}
#plot .travel-arrow{stroke:#3b5548;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
#plot .travel-halo{stroke:#f7f8f0;stroke-width:3.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
#plot .travel-label{font:650 11px var(--font);fill:#344e41;paint-order:stroke;stroke:#f7f8f0;stroke-width:2.8px;stroke-linejoin:round}
#plot .diagram-note{font:12px var(--font);fill:#53665d;letter-spacing:.04em}
#plot .axis-text{font:12px ui-monospace,Consolas,monospace;fill:#52655a}
.hotspot{cursor:pointer;outline:none;color:#23382e}
.hotspot .pin{fill:#0f6347;opacity:0;pointer-events:none}
.hotspot .dimension,.hotspot .tag{pointer-events:none}
.hotspot:hover,.hotspot:focus-visible,.hotspot.active{color:#935316}
.hotspot.active .pin,.hotspot:focus-visible .pin{opacity:.2}
.hotspot .level-value{font:700 15.5px/1.1 ui-monospace,Consolas,"Cascadia Mono",monospace;paint-order:stroke;stroke:#f8faf5;stroke-width:3.5px;stroke-linejoin:round;fill:currentColor}
.hotspot .tag text{font:600 12px var(--font);fill:#275c46}
.hotspot.active .tag text{fill:#794611}
.hotspot.dim .dimension{opacity:.23}
.hotspot .hit{fill:transparent;stroke:none;pointer-events:all}
.explainer{width:min(326px,47%);position:absolute;top:13px;right:15px;z-index:3;background:#fffffff7;border:1px solid #cdded0;border-radius:11px;padding:10px 13px 11px;box-shadow:0 5px 15px #1d483810}
.explainer-head{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--accent);font-size:12px;font-weight:750;letter-spacing:.025em}
.explainer-head button{width:23px;height:22px;padding:0;border:0;background:transparent;border-radius:5px;color:#50665a}
.explainer-head button:hover{background:var(--soft)}
.explainer h2{margin:3px 0 2px;font-size:15px;line-height:1.36}
.explainer h2 code{font:700 14px/1.4 ui-monospace,Consolas,monospace;color:var(--gold);margin-left:6px;white-space:nowrap}
.explainer p{font-size:12px;color:#43584c;margin:2px 0 0;line-height:1.52}
.explainer p.ref{margin-top:5px;color:#386c54;font-size:11px}
.explainer.is-collapsed{width:144px}
.explainer.is-collapsed #explanation{display:none}
.viewer-foot{min-height:51px;border-top:1px solid var(--line);background:#fdfefa;padding:9px 15px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px 17px;color:var(--muted);font-size:12px}
.viewer-key{display:flex;align-items:center;gap:13px;flex-wrap:wrap}
.key-label{display:flex;align-items:center;gap:5px}
.key-label svg{width:17px;height:13px;color:#25392f}
.tray{display:grid;gap:10px;min-width:0}
.tray details>summary{list-style:none;display:flex;align-items:center;gap:9px;padding:13px 14px;cursor:pointer;font-size:15px;font-weight:750}
.tray summary::-webkit-details-marker{display:none}
.tray summary:after{content:"";width:7px;height:7px;border:solid #557262;border-width:0 1.5px 1.5px 0;transform:rotate(45deg);margin:0 1px 3px auto}
.tray details[open]>summary:after{transform:rotate(225deg);margin-bottom:-4px}
.tray details[open]>summary{border-bottom:1px solid #e6ece5}
.summary-icon{width:24px;height:24px;display:grid;place-items:center;color:#326b53;background:#eaf2ea;border-radius:6px}
.summary-icon svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round}
.topic-list{padding:7px 8px 8px;display:grid;gap:2px}
.topic{width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:8px;display:flex;align-items:center;gap:11px;padding:8px;min-height:45px}
.topic:hover{background:#f0f5ee}
.topic[aria-pressed="true"]{background:#e8f1e7;border-color:#d5e5d6;color:#215941}
.topic-icon{display:grid;place-items:center;width:30px;height:29px;flex:none;background:#eff3eb;border:1px solid #e2eae0;border-radius:6px;color:#385b48;font:700 12px ui-monospace,Consolas,monospace}
.topic[aria-pressed="true"] .topic-icon{background:#f9fcf8}
.topic-icon svg{width:20px;height:17px}
.topic-title{font-size:13px;font-weight:700}
.topic-ref{margin-left:auto;color:#51675a;font:11px ui-monospace,Consolas,monospace}
.body-panel{padding:11px 13px 13px}
.layer-label{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;font-weight:650}
select{max-width:150px;background:#f8faf6;border:1px solid #cedcd1;border-radius:7px;padding:5px 6px;color:#244536}
#zone-row{margin-top:8px}
[hidden]{display:none!important}
.toggles{display:grid;gap:7px;border-top:1px solid #e8ede6;margin-top:11px;padding-top:9px;color:#435b4d;font-size:13px}
.toggles label{display:flex;align-items:center;gap:7px}
input[type=checkbox]{accent-color:#226349;margin:0;width:15px;height:15px}
.actions{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.action{padding:6px 8px;border-color:#dbe5da;background:#fbfcf9;font-size:12px;display:flex;gap:5px;align-items:center}
.action svg{width:14px;height:14px}
.hint{font-size:12px;margin:9px 0 0;color:var(--muted)}
.source{max-width:1710px;margin:auto;padding:0 38px 17px;color:#53665b;font-size:12px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:1160px){main{padding-inline:20px;grid-template-columns:minmax(0,1fr) 282px}.header-inner,.source{padding-inline:20px}.tab{padding-inline:9px}.stage-meta strong{font-size:19px}}
@media(max-width:850px){main{grid-template-columns:1fr}.stage{height:clamp(525px,75vw,660px);min-height:0}.tray{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}.tray section:first-child{grid-row:span 2}.explainer{width:min(310px,49%)}}
@media(max-width:540px){.header-inner{padding:13px 11px}.brand{gap:9px}.brand-mark{width:39px;height:39px;border-radius:9px}.brand-mark svg{width:23px}.eyebrow{font-size:10px}.header-ref{font-size:10px}.header-ref strong{font-size:11px}h1{font-size:24px}main{padding:11px 7px 10px;gap:10px}.viewer-head{padding:8px 5px;gap:3px}.viewer-head .tab{font-size:11px;padding:7px 5px}.quick-tools{gap:0}.quick-tools .icon-btn{min-width:28px;height:30px}.quick-tools .icon-btn svg{width:15px}.stage{height:465px}.stage-meta{left:10px;top:10px}.stage-meta strong{font-size:17px}.stage-meta span{font-size:10px;margin-top:3px}.explainer{top:51px;right:8px;width:min(270px,76%);padding:7px 9px}.explainer p{font-size:11px}.explainer h2{font-size:13px}.explainer h2 code{font-size:12px}.viewer-foot{padding:8px 9px;font-size:11px;gap:4px}.viewer-key{gap:9px}.tray{grid-template-columns:1fr}.tray section:first-child{grid-row:auto}.source{padding:0 10px 12px}#plot{top:126px;height:calc(100% - 126px)}}
@media(prefers-reduced-motion:no-preference){button{transition:background-color .12s,border-color .12s}}
</style>
</head>
<body>
<header><div class="header-inner">
  <div class="brand"><div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M5 14h26M5 14l6 6 6-6M9 27h18M18 23v8M21 9h7"/></svg></div><div><div class="eyebrow">大一上 STUDIO · 05 识图</div><h1>标高识读</h1></div></div>

          <label><input id="finishes" type="checkbox" checked>材质与填色</label>
          <label><input id="spaces" type="checkbox" checked>图纸空间名称</label>
        </div>
      </div>
    </details></section>
    <section><details><summary><span class="summary-icon" id="icon-tools"></span>视图工具</summary>

</main>

function symbol(mark) {
  const {values, x, y, fill, up, lift} = mark;
  const side = mark.side ?? 1;
  const h = 9;
  const length = mark.length ?? 76;
  const base = up ? h : -h;
  const lineY = lift ? -lift : base;
  const line = fill ? "" : lift ? `M0 0V${lineY}H${side*length}` : `M${side*h} ${base}H${side*length}`;
  const textX = fill ? 0 : side * (length-4);
  const textAnchor = fill ? "middle" : side === -1 ? "start" : "end";
  const valueY = up ? lineY + 16 : lineY - 5;
  const tx = mark.tag?.[0] ?? 0;
  const ty = mark.tag?.[1] ?? 10;
  const tw = mark.name.length*12+13;
  const hitWidth = fill ? 9+10*values[0].length : length+19;
  const hitX = fill ? -hitWidth/2 : (side === 1 ? -14 : -length-5);
  return `<g class="hotspot" data-mark="${mark.id}" tabindex="0" role="button" aria-label="${mark.name} ${values.join("、")}" aria-pressed="false" transform="translate(${x} ${y})">
    <g class="dimension">
      <circle class="pin" cx="0" cy="0" r="12"/>
      <path d="M${-h} ${base}H${h}L0 0z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" fill="${fill ? 'currentColor' : 'none'}"/>
      ${line ? `<path d="${line}" stroke="currentColor" stroke-width="1.2" fill="none"/>` : ""}
      ${values.map((n,i) => `<text class="level-value" x="${textX}" y="${valueY-16*(values.length-1-i)}" text-anchor="${textAnchor}">${n}</text>`).join("")}
    </g>
    <g class="tag" visibility="hidden" aria-hidden="true"><rect rx="4" x="${tx-3}" y="${ty}" width="${tw}" height="21" fill="#f7f9f1" stroke="#a9c0ad"/><text x="${tx+3}" y="${ty+14.7}">${mark.name}</text></g>
    <rect class="hit" aria-hidden="true" x="${hitX}" y="${up ? -8 : Math.min(-15,valueY-16*values.length)}" width="${hitWidth}" height="${up ? 41 : Math.max(25,13-Math.min(-15,valueY-16*values.length))}"/>
  </g>`;
}

function renderSheet() {
  const sheet = sheets[state.sheet];
  $("sheet-title").textContent = sheet.title;
  $("sheet-subtitle").textContent = sheet.sub;
  $("zone").innerHTML = sheet.zones.map((z,i) => `<option value="${i}">${z}</option>`).join("");
  const hitRegions = sheet.marks.filter(m => m.area).map(m => {
    const [x,y,w,h] = m.area;
    return `<rect class="hit" data-mark="${m.id}" x="${x}" y="${y}" width="${w}" height="${h}" fill="transparent" style="cursor:pointer" aria-hidden="true"/>`;
  }).join("");
  plot.innerHTML = `${definitions}<g id="sheet-art">${sheetsArt[state.sheet]()}</g><g id="hit-regions">${hitRegions}</g><g id="marks">${sheet.marks.map(symbol).join("")}</g>`;
  for (const tab of $("tabs").children) {
    const selected = tab.dataset.sheet === state.sheet;
    tab.setAttribute("aria-selected",selected);
    tab.tabIndex = selected ? 0 : -1;
  }
  $("stage").setAttribute("aria-labelledby",`tab-${state.sheet}`);
  syncLayers();
}

function syncLayers() {
  const showLevels = $("levels").checked;
  const showSpaces = $("spaces").checked;
  const nameMode = $("name-mode").value;
  const zone = Number($("zone").value);
  $("zone-row").hidden = nameMode !== "zone";
  plot.classList.toggle("mono",!$("finishes").checked);
  plot.querySelectorAll(".space").forEach(el => {el.style.display = showSpaces ? "" : "none";});
  $("marks").style.display = showLevels ? "" : "none";
  $("hit-regions").style.display = showLevels ? "" : "none";
  for (const mark of sheets[state.sheet].marks) {
    const target = plot.querySelector(`.hotspot[data-mark="${mark.id}"]`);
    const selected = mark.id === state.selection;
    const related = !state.topic || mark.tags.includes(state.topic);
    const showName = nameMode === "all" || (nameMode === "zone" && mark.zone === zone) ||
      (selected && (nameMode === "selected" || state.revealPickedName));
    target.classList.toggle("active",selected);
    target.classList.toggle("dim",!related);
    target.setAttribute("aria-pressed",String(selected));
    target.querySelector(".tag").setAttribute("visibility",showName ? "visible" : "hidden");
  }
}

function revealExplanation() {
  $("explainer").classList.remove("is-collapsed");
  const button = $("explanation-toggle");
  button.setAttribute("aria-expanded","true");
  button.setAttribute("aria-label","折叠知识点解释");
  button.textContent = "−";
}

function updateExplanation() {
  const mark = sheets[state.sheet].marks.find(m => m.id === state.selection);
  const lesson = lessons[state.topic];
  if (state.explanation === "topic") {
    $("explanation").innerHTML = `<h2>${lesson.name}</h2><p>${lesson.text}</p><p class="ref">第 ${lesson.ref} 条 · 图中高亮为对应示例</p>`;
  } else if (mark) {
    const primary = mark.tags.includes("stack") ? "stack" : mark.lift ? "lifted" : mark.up ? "direction" : mark.tags[0];
    const refs = [state.topic,primary,...mark.tags].filter(k => k && k !== "precision").map(k => lessons[k].ref);
    $("explanation").innerHTML = `<h2>${mark.name}<code>${mark.values.join(" / ")}</code></h2><p>${mark.description}</p><p class="ref">第 ${[...new Set(refs)].slice(0,3).join("、")} 条${mark.tags.includes("stack") ? " · 同点叠注" : ""}</p>`;
  }
  for (const button of $("topics").children) button.setAttribute("aria-pressed",String(button.dataset.topic === state.topic));
}

function changeSheet(key) {
  const fromPlan = state.sheet === "site" || state.sheet === "plan";
  const toPlan = key === "site" || key === "plan";
  const samePlanBase = fromPlan && toPlan;
  const samePoint = samePlanBase && outdoorPoints.some(point => point.id === state.selection);
  state.sheet = key;
  if (!samePoint) state.selection = sheets[key].example;
  state.topic = null;
  state.revealPickedName = samePoint;
  state.explanation = "mark";
  if (!samePlanBase) resetView();
  renderSheet();
  updateExplanation();
}

function selectTopic(key) {
  const lesson = lessons[key];
  const relevant = (m) => m.tags.includes(key);
  const before = state.sheet;
  if (!sheets[before].marks.some(relevant) || key === "direction") state.sheet = lesson.sample;
  const matches = sheets[state.sheet].marks.filter(relevant);
  const preferred = {open:"tea",lifted:"court",solid:"court",direction:"eave",precision:"court",sign:"tea",stack:"water"};
  const example = matches.find(m => m.id === preferred[key]) || matches[0];
  state.selection = example.id;
  state.topic = key;
  state.explanation = "topic";
  state.revealPickedName = true;
  $("levels").checked = true;
  resetView();
  if (before !== state.sheet) renderSheet(); else syncLayers();
  revealExplanation();
  updateExplanation();
}

function selectMark(id) {
  if (!sheets[state.sheet].marks.some(m => m.id === id) || !$("levels").checked) return;
  state.selection = id;
  state.revealPickedName = true;
  if (state.topic && !sheets[state.sheet].marks.find(m => m.id === id).tags.includes(state.topic)) state.topic = null;
  state.explanation = "mark";
  revealExplanation();
  syncLayers();
  updateExplanation();
}

function updateView() {
  const w = frame.width/view.scale;
  const h = frame.height/view.scale;
  plot.setAttribute("viewBox",`${view.x} ${view.y} ${w} ${h}`);
}

function resetView() {
  Object.assign(view,{x:0,y:37,scale:1});
  updateView();
}

function pointAt(x,y) {
  const p = plot.createSVGPoint();
  p.x = x;
  p.y = y;
  return p.matrixTransform(plot.getScreenCTM().inverse());
}

function zoomAt(x,y,factor) {
  const from = pointAt(x,y);
  view.scale = Math.min(5,Math.max(.8,view.scale*factor));
  updateView();
  const to = pointAt(x,y);
  view.x += from.x-to.x;
  view.y += from.y-to.y;
  updateView();
}

function zoomCenter(factor) {
  const r = plot.getBoundingClientRect();
  zoomAt(r.x+r.width/2,r.y+r.height/2,factor);
}

async function toggleFullscreen() {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else await $("viewer").requestFullscreen();
  } catch {
    $("view-status").textContent = "浏览器未允许全屏。";
  }
}

function pinch() {
  const [a,b] = pointers.values();
  return {x:(a.x+b.x)/2,y:(a.y+b.y)/2,d:Math.max(1,Math.hypot(a.x-b.x,a.y-b.y))};
}

plot.addEventListener("wheel",e => {
  e.preventDefault();
  zoomAt(e.clientX,e.clientY,e.deltaY < 0 ? 1.14 : 1/1.14);
},{passive:false});
plot.addEventListener("contextmenu",e=>{if(e.target.closest("[data-mark]")) e.preventDefault();});
plot.addEventListener("pointerdown",e => {
  if (e.pointerType === "mouse" && e.button !== 0) return;
  const hit = e.target.closest("[data-mark]");
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  plot.setPointerCapture(e.pointerId);
  if (pointers.size > 1) {
    clearTimeout(holdTimer);
    gesture = {moved:true,pinch:pinch()};
    return;
  }
  gesture = {x:e.clientX,y:e.clientY,mark:hit?.dataset.mark,moved:false,held:false};
  if (gesture.mark) {
    const initialGesture = gesture;
    holdTimer = setTimeout(() => {
      if (gesture !== initialGesture || gesture.moved) return;
      gesture.held = true;
      selectMark(gesture.mark);
    },450);
  }
});

plot.addEventListener("pointermove",e => {
  if (!pointers.has(e.pointerId) || !gesture) return;
  const last = pointers.get(e.pointerId);
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if (pointers.size > 1) {
    const next = pinch();
    const prev = gesture.pinch;
    if (prev) {
      const before = pointAt(prev.x,prev.y);
      zoomAt(next.x,next.y,next.d/prev.d);
      const after = pointAt(next.x,next.y);
      view.x += before.x-after.x;
      view.y += before.y-after.y;
      updateView();
    }
    gesture.pinch = next;
    return;
  }
  if (gesture.held) return;
  if (!gesture.moved && Math.hypot(e.clientX-gesture.x,e.clientY-gesture.y)<7) return;
  clearTimeout(holdTimer);
  const start = pointAt(gesture.moved ? last.x : gesture.x,gesture.moved ? last.y : gesture.y);
  const end = pointAt(e.clientX,e.clientY);
  gesture.moved = true;
  plot.classList.add("panning");
  view.x += start.x-end.x;
  view.y += start.y-end.y;
  updateView();
});

function endGesture(e) {
  if (!pointers.has(e.pointerId)) return;
  clearTimeout(holdTimer);
  pointers.delete(e.pointerId);
  if (gesture && e.type === "pointerup" && !gesture.moved && !gesture.held && gesture.mark) selectMark(gesture.mark);
  if (pointers.size < 2 && gesture) gesture.pinch = null;
  if (!pointers.size) {
    gesture = null;
    plot.classList.remove("panning");
  }
}

for (const ev of ["pointerup","pointercancel","lostpointercapture"]) plot.addEventListener(ev,endGesture);
plot.addEventListener("keydown",e => {
  const mark = e.target.closest(".hotspot");
  if (mark && ["Enter"," "].includes(e.key)) {
    e.preventDefault();
    selectMark(mark.dataset.mark);
  }
});

$("tabs").innerHTML = Object.entries(sheets).map(([key,s]) => `<button class="tab" id="tab-${key}" data-sheet="${key}" type="button" role="tab" aria-controls="stage">${s.tab}</button>`).join("");
$("tabs").addEventListener("click",e => {
  const tab = e.target.closest("button");
  if (tab) changeSheet(tab.dataset.sheet);
});
$("tabs").addEventListener("keydown",e => {
  const order = Object.keys(sheets);
  const selected = order.indexOf(state.sheet);
  const keys = {ArrowRight:order[(selected+1)%order.length],ArrowLeft:order[(selected+order.length-1)%order.length],Home:order[0],End:order.at(-1)};
  if (!keys[e.key]) return;
  e.preventDefault();
  changeSheet(keys[e.key]);
  $(`tab-${state.sheet}`).focus();
});
$("topics").innerHTML = Object.entries(lessons).map(([key,l]) => `<button type="button" data-topic="${key}" class="topic" aria-pressed="false"><span class="topic-icon" aria-hidden="true">${l.art}</span><span class="topic-title">${l.name}</span><span class="topic-ref">${l.ref}</span></button>`).join("");
$("topics").addEventListener("click",e => {
  const b = e.target.closest("[data-topic]");
  if (b) selectTopic(b.dataset.topic);
});

for (const id of ["name-mode","zone"]) $(id).addEventListener("change",() => {
  state.revealPickedName = false;
  syncLayers();
});
for (const id of ["levels","spaces","finishes"]) $(id).addEventListener("change",syncLayers);
$("explanation-toggle").addEventListener("click",() => {
  const closing = $("explainer").classList.toggle("is-collapsed");
  $("explanation-toggle").setAttribute("aria-expanded",String(!closing));
  $("explanation-toggle").setAttribute("aria-label",closing ? "展开知识点解释" : "折叠知识点解释");
  $("explanation-toggle").textContent = closing ? "+" : "−";
});
for (const name of ["book","layers","tools"]) $(`icon-${name}`).innerHTML = icon(name);
$("quick-tools").innerHTML = tools.map(([key,title]) => `<button type="button" class="icon-btn" data-tool="${key}" title="${title}" aria-label="${title}">${icon(key)}</button>`).join("");
$("actions").innerHTML = tools.map(([key,title]) => `<button type="button" class="action" data-tool="${key}">${icon(key)}${title}</button>`).join("")+'<span id="view-status" class="sr-only" aria-live="polite"></span>';
for (const button of document.querySelectorAll("[data-tool]")) button.addEventListener("click",() => tools.find(([key])=>key===button.dataset.tool)[2]());
document.addEventListener("fullscreenchange",() => {
  const label = document.fullscreenElement ? "退出全屏" : "全屏";
  const button = $("quick-tools").querySelector('[data-tool="full"]');
  button.title = label;
  button.setAttribute("aria-label",label);
});
resetView();
renderSheet();
updateExplanation();
</script>
</body>
</html>
