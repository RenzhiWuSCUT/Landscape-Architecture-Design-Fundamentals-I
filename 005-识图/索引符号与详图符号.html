<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>索引符号与详图符号｜风景园林制图识读</title>
<style>
:root{--ink:#202f28;--muted:#53655b;--green:#174d39;--sage:#eaf2ea;--paper:#fffefa;--line:#dbe4db;--page:#eef2ed;--rust:#9b5433;--sans:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;--serif:"Source Han Serif SC","Noto Serif CJK SC","Songti SC",SimSun,serif;--mono:"SFMono-Regular",Consolas,monospace}
*{box-sizing:border-box}
html{scrollbar-gutter:stable}body{margin:0;background:var(--page);color:var(--ink);font-family:var(--sans);font-size:14px}
button,input{font:inherit}
button{cursor:pointer;color:inherit}
button:disabled{cursor:default;opacity:.45}
a{color:var(--green)}
:focus-visible{outline:2px solid #3b8165;outline-offset:3px}
[hidden]{display:none!important}
.shell{width:min(1660px,100%);margin:auto;padding:0 25px 23px}
.mast{display:flex;align-items:center;justify-content:space-between;gap:15px;min-height:84px}
.brand{display:flex;align-items:center;gap:13px}
.brand-icon{width:47px;height:47px;border-radius:11px;display:grid;place-items:center;background:var(--green);color:#fff;flex:none}
.brand-icon svg{width:30px;height:30px}
.kicker{margin:0 0 4px;color:var(--green);font-weight:700;font-size:11px;letter-spacing:.14em}
h1{margin:0;font-family:var(--serif);font-size:clamp(23px,2.4vw,35px);letter-spacing:.05em;line-height:1.22; font-weight:800}
.standard{padding:8px 12px;border:1px solid #cbd9cd;border-radius:6px;background:#f7f9f5;font:12px var(--mono);white-space:nowrap;color:var(--green)}
.desk{display:grid;grid-template-columns:minmax(0,1fr) minmax(305px,25.5%);align-items:start;gap:16px}
.board,.tool{border:1px solid var(--line);background:#fff;border-radius:10px}
.board{overflow:hidden;min-width:0;scroll-margin-top:10px}
.board-head{min-height:68px;display:flex;align-items:center;gap:14px;justify-content:space-between;padding:11px 20px;border-bottom:1px solid var(--line)}
.board-head h2{font-size:20px;margin:3px 0 0;line-height:1.2}
.pathline{font-size:11px;letter-spacing:.05em;color:var(--muted)}
.sheet-tag{font:12px var(--mono);letter-spacing:.065em;color:var(--green);font-weight:700;border:1px solid var(--line);border-radius:5px;background:#f5f8f2;padding:6px 9px;white-space:nowrap}
.stage{position:relative;background:var(--paper)}
#drawing{width:100%;height:auto;aspect-ratio:1000/570;display:block;user-select:none;touch-action:pan-y}
#drawing.zoomed{cursor:grab;touch-action:none}
#drawing.dragging{cursor:grabbing}
.scene{margin:0;position:relative;background:#e4e9dc}
.scene img{display:block;width:100%;aspect-ratio:1000/570;object-fit:cover;object-position:50% 56%}
.scene figcaption{position:absolute;bottom:14px;left:17px;color:#fff;background:rgba(24,43,35,.84);border-radius:5px;padding:6px 10px;font-size:12px}
.board-foot{display:flex;align-items:center;gap:9px;min-height:45px;padding:8px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.foot-icon{width:8px;height:8px;border-radius:50%;background:#709583;flex:none}
.tray{display:grid;gap:7px;min-width:0}
.tray-head{display:flex;align-items:center;gap:9px;padding:11px 13px;background:var(--green);color:#fff;border-radius:9px;font-size:14px;font-weight:700}
.tray-head svg,.tool summary svg{width:17px;height:17px;flex:none}
.tool{overflow:hidden}
.tool summary{display:flex;align-items:center;gap:8px;min-height:37px;padding:7px 11px;color:var(--green);font-size:13px;font-weight:750;cursor:pointer;list-style:none}
.tool summary::-webkit-details-marker{display:none}
.tool summary:after{content:"";width:6px;height:6px;border-right:1.5px solid #5c7767;border-bottom:1.5px solid #5c7767;transform:rotate(45deg);margin-left:auto;margin-right:3px}
.tool[open]>summary:after{transform:rotate(225deg);margin-top:4px}
.tool summary:hover,.tool summary:focus-visible{background:#f3f7f1;outline-offset:-3px}
.tool-body{padding:0 10px 8px}
.view-select{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin-bottom:7px}
.view-select button,.small-button,.zoom button{border:1px solid var(--line);background:#fff;border-radius:5px;min-height:30px;padding:3px 7px;font-size:12px;font-weight:650}
.view-select button:hover,.small-button:hover,.zoom button:hover:enabled{background:#f0f5ef}
.view-select button[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.case-list{display:grid;gap:4px}
.case-button{display:grid;grid-template-columns:32px 1fr auto 10px;align-items:center;gap:7px;text-align:left;border:1px solid #e3e9e0;background:#fbfcfa;padding:4px 7px;border-radius:6px;min-height:40px;width:100%}
.case-button svg{display:block;width:29px;height:29px;color:#2e4236}
.case-button .name{font-size:12px;font-weight:750;white-space:nowrap}
.case-button .kind{font-size:11px;color:var(--muted);white-space:nowrap}
.case-button .arrow{font-size:13px;color:var(--green)}
.case-button:hover,.case-button[aria-current="true"]{border-color:#a0bdac;background:var(--sage)}
.return{width:100%;margin-top:6px;color:var(--green)}
.term-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.term{border:1px solid #e1e8df;border-radius:6px;padding:5px 7px 7px;background:#f9fbf7}
.term svg{display:block;width:52px;height:42px;margin:0 auto;color:#24372e}
.term b,.term span{display:block;text-align:center}
.term b{font-size:12px;line-height:1.6}
.term span{font-size:11px;color:var(--muted)}
.rule-list{display:grid;gap:0}
.rule{padding:5px 2px 6px;margin:0;border-top:1px solid #e8eee6;line-height:1.52;font-size:12px}
.rule:first-child{border-top:0;padding-top:1px}
.rule strong{display:block;color:var(--green);font-size:12px}
.rule span{color:#42574b}
.guide-control{margin-top:3px}.atlas-link{display:inline-flex;align-items:center;margin-top:4px;color:var(--green);text-decoration:none}
.layer-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px 6px;padding:1px 1px 4px}
.layer-grid label,.guide-control{display:flex;align-items:center;gap:6px;font-size:12px;min-height:22px}
input[type=checkbox]{accent-color:var(--green);width:15px;height:15px;margin:0;flex:none}
.zoom{display:flex;align-items:center;gap:5px;border-top:1px solid #e8eee6;margin-top:5px;padding-top:7px}
.zoom button{min-width:33px}
.zoom output{font:12px var(--mono);color:var(--muted);min-width:43px;text-align:center}
.refs p{font-size:12px;line-height:1.55;margin:0 0 5px}
.refs p:last-child{margin:0}
#drawing text{font-family:var(--sans);fill:#25372d}
#drawing .number{font-family:"Arial",var(--sans);font-feature-settings:"tnum"}
#drawing .plan-name{font-size:13px;font-weight:650;fill:#3d5146;paint-order:stroke;stroke:#fffefa;stroke-width:3px;stroke-linejoin:round}
#drawing .dim{fill:none;stroke:#627567;stroke-width:.8}
#drawing .dim-label{font-family:var(--mono);font-size:11px;fill:#52655a;stroke:var(--paper);stroke-width:3px;paint-order:stroke}
#drawing .line{stroke:#3c4a40;stroke-width:1.25;fill:none;stroke-linejoin:round}
#drawing .cut{stroke:#25332d;stroke-width:3.4;stroke-linecap:butt;fill:none}
#drawing .leader{stroke:#29362e;stroke-width:1.05;fill:none;stroke-linejoin:round}
#drawing .mark{color:#202b25;cursor:pointer;outline:none}
#drawing .mark:hover .ring,#drawing .mark:focus-visible .ring,#drawing .mark.selected .ring{fill:#e3efe4;stroke:#145c41}
#drawing .mark:focus-visible .focus-ring{stroke:#41856a;stroke-dasharray:3 3}
#drawing .mark:hover .leader,#drawing .mark:focus-visible .leader{stroke:#145c41}
#drawing .guide{pointer-events:none}
#drawing.no-material .material,#drawing.no-symbol .symbol,#drawing.no-label .labels,#drawing.no-dim .dimensions,#drawing.no-guide .guide{display:none}
.material{pointer-events:none}
.figure-title{font-weight:750;font-size:19px}
.paper-hanzi{font-family:SimSun,"Songti SC","Noto Serif CJK SC",serif!important}
.paper-roman{font-family:"Times New Roman","Liberation Serif",serif!important}
.caption{font-size:12px;fill:#627166!important;letter-spacing:.06em}
@media(max-width:1080px){.shell{padding-inline:15px}.desk{gap:12px;grid-template-columns:minmax(0,1fr) 284px}.board-head{padding-inline:14px}.case-button{gap:5px}}
@media(max-width:760px){.mast{min-height:76px}.standard{display:none}.desk{grid-template-columns:minmax(0,1fr)}.shell{padding-inline:10px}.brand-icon{width:41px;height:41px}.board-head{min-height:56px;padding:8px 12px}.board-head h2{font-size:17px}.board-foot{font-size:11px}.tray{grid-template-columns:1fr 1fr;align-items:start}.tray-head,.tool-nav{grid-column:1/-1}}
@media(max-width:480px){.tray{grid-template-columns:1fr}.board-foot{min-height:38px}.scene figcaption{font-size:10px;left:9px;bottom:8px}}
@media print{body{background:white}.shell{padding:0}.desk{display:block}.tray,.board-foot{display:none}.mast{min-height:58px}.board{border:1px solid #aaa}}
</style>
</head>
<body>
<div class="shell">
  <header class="mast">
    <div class="brand">
      <span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.45"><path d="M4 26.5h16m-12-3V8h10m-6 5h5m-5 5h4"/><circle cx="23" cy="17" r="6.5"/><path d="M16.5 17h13M23 12.5v2.6m-1.5 4.1h3"/></svg></span>
      <div><p class="kicker">风景园林制图识读</p><h1>索引符号与详图符号</h1></div>
    </div>
    <div class="standard">GB/T 50001—2017 · §7.2</div>
  </header>
  <main class="desk">
    <section id="board" class="board" aria-label="图册画面">
      <div class="board-head">
        <div><div class="pathline" id="path">校园小庭院图册</div><h2 id="view-title">平面索引图</h2></div>
        <span id="sheet-tag" class="sheet-tag">图纸 01</span>
      </div>
      <div class="stage">
        <svg id="drawing" role="group" viewBox="0 0 1000 570" aria-labelledby="svg-title" xmlns="http://www.w3.org/2000/svg"></svg>
        <figure class="scene" id="scene" hidden><img id="scene-img" width="1536" height="1024" alt="校园小庭院效果图。左侧是方形木亭与入口台阶，右侧是木坐凳花池，中间为铺装步道。"><figcaption>校园小庭院 · 生成式效果图</figcaption></figure>
      </div>
      <div class="board-foot"><span class="foot-icon" aria-hidden="true"></span><span id="status" aria-live="polite"></span></div>
    </section>
    <aside class="tray" aria-label="教学工具托盘">
      <div class="tray-head"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3.5" y="5" width="17" height="14" rx="1.5"/><path d="M14.5 5v14m3-9.5h.1m-.1 4.5h.1"/></svg>教学托盘</div>
      <details class="tool tool-nav" open>
        <summary><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 6v14M12 6c-2.7-2.2-6.1-2.3-9-1.2v13.5c3.2-1.1 6.5-.8 9 1.7 2.5-2.5 5.8-2.8 9-1.7V4.8C18.1 3.7 14.7 3.8 12 6Z"/></svg>图册导航</summary>
        <div class="tool-body">
          <div class="view-select" aria-label="图册视图">
            <button type="button" data-go="plan">平面图</button>
            <button type="button" data-go="scene">场景图</button>
            <button type="button" data-go="compare">符号对照</button>
          </div>
          <div class="case-list" id="case-list"></div>
          <button type="button" id="return" class="small-button return" hidden>← 返回平面定位</button>
        </div>
      </details>
      <details class="tool" open>
        <summary><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="8.2"/><path d="M12 11v5.2m0-8.4v.8"/></svg>知识点释义</summary>
        <div class="tool-body term-grid">
          <div class="term" id="index-term"></div>
          <div class="term" id="detail-term"></div>
        </div>
      </details>
      <details class="tool" open>
        <summary><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h1M4 12h1M4 18h1"/></svg>知识点</summary>
        <div class="tool-body">
          <div class="rule-list" id="rules"></div>
          
        </div>
      </details>
      <details class="tool" open>
        <summary><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m12 4 8.5 4.8-8.5 4.8-8.5-4.8L12 4ZM3.5 12.5l8.5 4.8 8.5-4.8m-17 3.7 8.5 4.8 8.5-4.8"/></svg>图层</summary>
        <div class="tool-body">
          <div class="layer-grid">
            <label><input type="checkbox" data-layer="symbol" checked>索引与详图符号</label>
            <label><input type="checkbox" data-layer="material" checked>材质填色</label>
            <label><input type="checkbox" data-layer="label" checked>构件名称</label>
            <label><input type="checkbox" data-layer="dim" checked>尺寸标注</label>
            <label id="guide-control"><input type="checkbox" data-layer="guide">观看方向</label>
          </div>
          <div class="zoom" aria-label="图纸缩放">
            <button type="button" id="minus" aria-label="缩小">−</button><output id="zoom-level">100%</output><button type="button" id="plus" aria-label="放大">＋</button><button type="button" id="fit">适合画面</button>
          </div>
        </div>
      </details>
      <details class="tool refs">
        <summary><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M6 21V5c0-1 .8-2 2-2h10v16H8c-1.1 0-2 .9-2 2Zm0 0h12m-8-13h5m-5 4h5"/></svg>规范依据</summary>
        <div class="tool-body">
          <p>GB/T 50001—2017《房屋建筑制图统一标准》第 5.0.2～5.0.5、6.0.3、7.2.1、7.2.2、7.2.4、7.3.1、10.2.2 条。</p>
          <p>标准图集示例参照 12J003《室外工程》B3 页 11A 型。<a href="https://29538953.s21i.faiusr.com/61/1/ABUIABA9GAAgydSqqwYo_fn4nwM.pdf" target="_blank" rel="noopener noreferrer">查阅图集 ↗</a></p>
        </div>
      </details>
    </aside>
  </main>
</div>
<script>
"use strict";
const drawing = document.querySelector("#drawing");
const $ = id => document.getElementById(id);
const caseData = {
  base: {title:"亭柱柱脚平面详图", short:"亭柱柱脚", type:"同张图纸", top:"1", dest:"", sheet:"图纸 01", source:"01", scale:"1:5"},
  seat: {title:"花池坐凳剖视详图", short:"花池坐凳", type:"跨图纸", top:"2", dest:"02", sheet:"图纸 02", source:"01", scale:"1:10"},
  stair: {title:"入口台阶剖视示意", short:"入口台阶", type:"标准图集", top:"11A", dest:"B3", sheet:"图集 B3", atlas:"12J003"}
};
const ids = Object.keys(caseData);
const viewNames = {
  plan:{title:"平面索引图", path:"校园小庭院图册", tag:"图纸 01", scale:"1:30"},
  scene:{title:"校园小庭院", path:"校园小庭院图册 / 场景", tag:"效果图"},
  compare:{title:"索引符号与详图符号对照", path:"校园小庭院图册 / 符号读法", tag:"§ 7.2"}
};
const rules = {
  plan:[
    ["同张图纸","上半圆是详图号，下半圆画短横线。在本张找详图。"],
    ["跨图纸","先按下半圆翻到目标图纸，再按上半圆找详图。"],
    ["标准图集","先找横线上的图集号，再按下半圆找页、按上半圆找详图。"]
  ],
  scene:[
    ["对应到平面","木亭在西侧，入口台阶朝南，花池坐凳在东侧。"],
    ["对应到详图","柱脚看平面放大，坐凳和台阶看剖视。"]
  ],
  compare:[
    ["索引符号","纸面直径 8～10 mm，本例取 10 mm。圆、水平直径和引出线按 0.25b 绘制。"],
    ["详图符号","纸面直径 14 mm，圆线宽为 b。跨图纸时用细实线分隔上下。"],
    ["跨图纸的下半圆","索引端填详图所在图纸号，详图端填原图所在图纸号。"]
  ],
  base:[
    ["平面索引","上半圆写 1，下半圆画短横线。"],
    ["详图符号","同属图纸 01。粗圈内只写 1，放在详图图名旁。"]
  ],
  seat:[
    ["平面索引","2 / 02，去图纸 02 找 2 号详图。"],
    ["详图符号","2 / 01，回图纸 01 找原位置。"],
    ["观看方向","引出线在东侧，视线由西向东。详图左侧是北边的花池，右侧是南边的步道。"]
  ],
  stair:[
    ["标准图集索引","延长线上写 12J003，下半圆写图集页码 B3。"],
    ["图集页内查找","上半圆写 11A，即 B3 页的花岗岩板面层台阶（卵石垫层）。"],
    ["观看方向","引出线在东侧，视线由西向东。详图左侧是北边的上平台，右侧是南边的步道。"]
  ]
};
const state = {
  view:"plan", selected:"", zoom:1, x:0, y:0,
  layers:{symbol:true,material:true,label:true,dim:true,guide:false}
};
const rect = (x,y,w,h,attrs="") => `<rect x="${x}" y="${y}" width="${w}" height="${h}" ${attrs}/>`;
const path = (d,attrs="") => `<path d="${d}" ${attrs}/>`;
const line = (x1,y1,x2,y2,attrs="") => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" ${attrs}/>`;
const txt = (x,y,value,attrs="") => `<text x="${x}" y="${y}" ${attrs}>${value}</text>`;
const circle = (x,y,r,attrs="") => `<circle cx="${x}" cy="${y}" r="${r}" ${attrs}/>`;
const group = (content,attrs="") => `<g ${attrs}>${content}</g>`;
const centered = 'text-anchor="middle" dominant-baseline="central"';
const paper = "#fffefa";
const paperUnits = {plan:648*30/14400, base:134*1.32*5/300, seat:103*10/450, stair:3, compare:4.5};
const indexDiameter = 10;
const detailDiameter = 14;
const thickLine = .7;
const titleHeight = 6;
const scaleHeight = 4;
const sectionCuts = {seat:{x:587,top:222,bottom:299},stair:{x:282,top:298,bottom:362}};
const measure = document.createElement("canvas").getContext("2d");
const drawingFonts = {
  hanzi:{family:'SimSun, "Songti SC", "Noto Serif CJK SC", serif', sample:"图"},
  roman:{family:'"Times New Roman", "Liberation Serif", serif', sample:"0"}
};
function paperFont(value,height,units,kind) {
  const {family,sample} = drawingFonts[kind];
  measure.font = `100px ${family}`;
  const reference = measure.measureText(sample);
  const size = height*units*100/(reference.actualBoundingBoxAscent+reference.actualBoundingBoxDescent);
  measure.font = `${size}px ${family}`;
  const metrics = measure.measureText(value);
  return {size,width:metrics.width,offset:(metrics.actualBoundingBoxAscent-metrics.actualBoundingBoxDescent)/2};
}
function paperText(x,y,value,kind,font,attrs="") {
  return txt(x,y,value,`class="paper-${kind}" font-size="${font.size}" ${attrs}`);
}
function sign(x,y,top,bottom="",detail=false,units=paperUnits.compare) {
  const r = (detail ? detailDiameter : indexDiameter)*units/2;
  const thin = thickLine*units/4;
  const hasDivision = !detail || Boolean(bottom);
  const number = (value,at,height,maxWidth) => {
    const font = paperFont(value,height,units,"roman");
    const fit = font.width>maxWidth*units ? `textLength="${maxWidth*units}" lengthAdjust="spacingAndGlyphs"` : "";
    return paperText(0,at+font.offset,value,"roman",font,`text-anchor="middle" ${fit}`);
  };
  return group(
    circle(0,0,r,`class="ring" fill="${paper}" stroke="currentColor" stroke-width="${detail?thickLine*units:thin}"`) +
    (hasDivision ? line(-r,0,r,0,`stroke="currentColor" stroke-width="${thin}"`) : "") +
    number(top,hasDivision ? -r*.49 : 0,detail?(hasDivision?4:titleHeight):3,detail?10:5.5) +
    (hasDivision ? (bottom ? number(bottom,r*.49,detail?4:3,detail?10:5.5) : line(-1.25*units,r*.46,1.25*units,r*.46,`stroke="currentColor" stroke-width="${thin}"`)) : ""),
    `transform="translate(${x} ${y})"`);
}
function icon(top,bottom="",detail=false) {
  return `<svg viewBox="-34 -34 68 68" aria-hidden="true">${sign(0,0,top,bottom,detail)}</svg>`;

    state.view="plan";
    state.layers.symbol=true;
  } else {
    state.view=destination;
    state.selected=caseData[destination]?destination:"";
    if(caseData[destination]) state.layers.symbol=true;
  }
  Object.assign(state,{zoom:1,x:0,y:0});
  render();
  if(destination==="back"){
    drawing.querySelector(`[data-target="${state.selected}"]`)?.focus({preventScroll:true});
  }else if(origin==="drawing"&&caseData[destination]){
    drawing.querySelector('[data-target="back"]')?.focus({preventScroll:true});
  }
  if(matchMedia("(max-width:760px)").matches &&
    (origin==="tray"||$("board").getBoundingClientRect().top<0)){
    $("board").scrollIntoView({block:"start"});
  }
}
function clampViewport() {
  state.x=Math.min(Math.max(0,state.x),1000-1000/state.zoom);
  state.y=Math.min(Math.max(0,state.y),570-570/state.zoom);
}
function changeZoom(next) {
  if(state.view==="scene") return;
  next=Math.max(1,Math.min(3,next));
  state.x+=500/state.zoom-500/next;
  state.y+=285/state.zoom-285/next;
  state.zoom=next;
  clampViewport();
  updateViewport();
}
$("case-list").innerHTML=ids.map(id=>{
  const item=caseData[id];
  return `<button type="button" class="case-button" data-go="${id}">${icon(item.top,item.dest)}<span class="name">${item.short}</span><span class="kind">${item.type}</span><span class="arrow" aria-hidden="true">→</span></button>`;
}).join("");
document.querySelectorAll("[data-go]").forEach(button=>button.addEventListener("click",()=>navigate(button.dataset.go,"tray")));
$("return").addEventListener("click",()=>navigate("back","tray"));
drawing.addEventListener("click",event=>{
  const control=event.target.closest("[data-target]");
  if(control) navigate(control.dataset.target,"drawing");
});
drawing.addEventListener("keydown",event=>{
  const control=event.target.closest("[data-target]");
  if(control&&(event.key==="Enter"||event.key===" ")){
    event.preventDefault();
    navigate(control.dataset.target,"drawing");
  }
});
document.querySelectorAll("[data-layer]").forEach(input=>input.addEventListener("change",()=>{
  state.layers[input.dataset.layer]=input.checked;
  applyLayers();
}));
$("minus").addEventListener("click",()=>changeZoom(state.zoom-.25));
$("plus").addEventListener("click",()=>changeZoom(state.zoom+.25));
$("fit").addEventListener("click",()=>changeZoom(1));
let pan=null;
drawing.addEventListener("pointerdown",event=>{
  if(event.button!==0||state.zoom===1||event.target.closest("[data-target]")) return;
  const units=1000/drawing.getBoundingClientRect().width/state.zoom;
  pan={id:event.pointerId,x:event.clientX,y:event.clientY,units,viewX:state.x,viewY:state.y};
  drawing.setPointerCapture(event.pointerId);
  drawing.classList.add("dragging");
});
drawing.addEventListener("pointermove",event=>{
  if(!pan||event.pointerId!==pan.id) return;
  state.x=pan.viewX-(event.clientX-pan.x)*pan.units;
  state.y=pan.viewY-(event.clientY-pan.y)*pan.units;
  clampViewport();
  updateViewport();
});
for(const event of ["pointerup","pointercancel","lostpointercapture"]){
  drawing.addEventListener(event,()=>{
    pan=null;
    drawing.classList.remove("dragging");
  });
}
