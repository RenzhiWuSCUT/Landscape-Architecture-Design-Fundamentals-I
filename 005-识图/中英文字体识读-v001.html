<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>中英文字体识读</title>
<style>
  :root {
    --ink: #182036; --muted: #546078; --line: #dfe5ef; --soft: #f4f6fa;
    --blue: #2d529e; --blue-light: #eaf0fd; --guide: #aec1e9; --white: #fff;
    --ui: system-ui, "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; color: var(--ink); background: #eef1f7; font-family: var(--ui); font-size: 14px; }
  button, select, input { font: inherit; }
  button, summary, select, input[type="checkbox"], input[type="range"] { cursor: pointer; }
  button { color: inherit; }
  button, select { background: #fff; border: 1px solid var(--line); border-radius: 8px; }
  button:hover { border-color: #b8c8e5; background: #f2f5fc; }
  button:focus-visible, select:focus-visible, summary:focus-visible, input:focus-visible, a:focus-visible {
    outline: 2px solid var(--blue); outline-offset: 3px;
  }
  a { color: var(--blue); text-underline-offset: 3px; }
  h1, h2, h3, p, figure { margin: 0; }
  .top {
    min-height: 76px; display: flex; align-items: center; justify-content: space-between; gap: 16px;
    background: #fff; padding: 14px clamp(16px, 3vw, 48px); border-bottom: 1px solid var(--line);
  }
  .identity { display: flex; align-items: center; gap: 13px; }
  .mark {
    width: 40px; height: 40px; display: grid; place-items: center; border-radius: 11px;
    background: #253c6a; color: white; font: 22px Georgia, serif; letter-spacing: -1.4px;
  }
  h1 { font-size: clamp(21px, 2.1vw, 28px); font-weight: 720; letter-spacing: .055em; }
  .layout {
    width: min(100%, 1720px); margin: auto; padding: 22px clamp(12px, 2vw, 32px) 16px;
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(310px, 354px); align-items: start; gap: 18px;
  }
  .stage, .tray { min-width: 0; }
  .stage {
    background: #fff; border: 1px solid var(--line); border-radius: 15px;
    box-shadow: 0 3px 16px #253c6a07; overflow: clip;
  }
  .seg { display: flex; padding: 2px; border: 1px solid #e5eaf2; border-radius: 7px; background: #f1f4f9; gap: 2px; }
  .seg button {
    border: 1px solid transparent; border-radius: 5px; background: transparent; padding: 3px 5px;
    min-height: 26px; font-size: 12px; font-weight: 620; white-space: nowrap;
  }
  .seg button[aria-pressed="true"] { color: var(--blue); border-color: #e0e7f4; background: white; box-shadow: 0 1px 4px #1a366a12; }
  .stagebody { padding: clamp(15px, 2.5vw, 34px); padding-bottom: 21px; }
  .boardhead { display: flex; align-items: end; justify-content: space-between; gap: 12px; margin-bottom: 17px; }
  .boardhead h2 { font-size: clamp(19px, 2.2vw, 26px); line-height: 1.25; font-weight: 710; }
  .boardhead p { color: var(--muted); font-size: 12px; text-align: right; min-width: 0; }
  .samples { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .samples.single { grid-template-columns: minmax(0, 1fr); }
  .specimen {
    min-width: 0; border: 1px solid #e0e4eb; border-radius: 11px; background: #ffffff;
    overflow: clip; display: flex; flex-direction: column;
  }
  .specimen.current { border-color: #4368b0; box-shadow: 0 0 0 1px #4368b0; }
  .samplehead {
    min-height: 68px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center;
    gap: 4px; padding: 10px 14px; background: #f6f7f9; border-bottom: 1px solid #e6e9ef;
  }
  .current .samplehead { background: #e8effe; border-color: #c7d6f3; }
  .role { color: #566277; font-size: 11px; font-weight: 650; letter-spacing: .05em; }
  .current .role { color: #244c97; }
  .samplehead h3 { font-size: 14px; overflow-wrap: anywhere; line-height: 1.28; }
  .glyph-field {
    position: relative; min-width: 0; display: grid; place-items: center; isolation: isolate;
    height: clamp(210px, 30vh, 340px); padding: 18px; background: #fff;
    color: #171c28;
  }
  .glyph-field::before {
    content: ""; display: none; position: absolute; z-index: -1; inset: 8% 6%;
    background: linear-gradient(90deg, transparent calc(50% - .5px), var(--guide) 50%, transparent calc(50% + .5px));
    border: 1px solid #dce5f6; border-radius: 2px; opacity: .83;
  }
  .glyph-field::after {
    content: ""; display: none; position: absolute; z-index: -1; inset: 25% 6%;
    border-top: 1px dashed #bfd0ed; border-bottom: 1px dashed #bfd0ed;
    background: linear-gradient(0deg, transparent calc(50% - .5px), #c6d3ee 50%, transparent calc(50% + .5px));
  }
  .has-guides .glyph-field::before, .has-guides .glyph-field::after { display: block; }
  .glyph-field svg { display: block; max-width: 100%; overflow: visible; }
  .source-strip {
    padding: 11px 14px; display: flex; align-items: center; gap: 12px;
    min-height: 53px; border-top: 1px solid var(--line); background: #fbfcfe;
  }
  .source-strip span { color: var(--muted); font-size: 11px; flex: none; }
  .source-strip svg { display: block; height: 22px; width: auto; min-width: 0; }
  .specimen .observation {
    display: grid; grid-template-columns: max-content 1fr; padding: 12px 14px; gap: 9px;
    min-height: 58px; flex: 1; align-content: start; border-top: 1px solid var(--line);
    color: #3f4b65; font-size: 13px; line-height: 1.5;
  }
  .observation strong { color: var(--blue); font-size: 12px; font-weight: 700; line-height: 1.65; }
  .stagefoot {
    min-height: 46px; padding: 10px 18px; border-top: 1px solid var(--line); background: #fafbfd;
    display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted);
  }
  .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
  .tile {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    min-height: 115px; min-width: 0; padding: 13px; text-align: center;
    border: 1px solid #e0e4eb; border-radius: 8px; background: #fff;
  }
  .tile.current { background: #edf3fe; border-color: #4368b0; box-shadow: 0 0 0 1px #4368b0; }
  .tile-label { color: var(--muted); font-size: 11px; overflow-wrap: anywhere; }
  .tile svg { display: block; width: auto; height: 33px; max-width: 100%; }
  .tray {
    display: flex; flex-direction: column; gap: 6px; max-height: calc(100dvh - 113px);
    overflow: auto; scrollbar-width: thin; scrollbar-color: #c4cee1 transparent; padding: 0 2px 4px;
  }
  .tray > * { flex-shrink: 0; }
  .tray-toolbar, .intro, .tray details {
    background: #fff; border: 1px solid var(--line); border-radius: 9px; overflow: clip;
  }
  .tray-toolbar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 4px; padding: 5px 7px; }
  .tray-actions { display: flex; gap: 4px; }
  .tray-actions button { border-radius: 6px; padding: 4px 6px; min-height: 28px; font-size: 12px; }
  .intro { border-top: 2px solid #4969ad; }
  .intro-header {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 7px 10px 0; color: var(--blue); font-size: 12px; font-weight: 700;
  }
  .steps { display: flex; gap: 4px; }
  .steps button { width: 26px; height: 25px; padding: 0; font-size: 18px; line-height: 1; }
  .info { padding: 4px 10px 8px; }
  .info h2 { font-size: clamp(16px, 1.65vw, 20px); line-height: 1.25; overflow-wrap: anywhere; }
  .info .category { margin: 3px 0 6px; color: var(--muted); font-size: 12px; }
  dl { display: grid; grid-template-columns: 3em 1fr; gap: 3px 6px; margin: 0; font-size: 12px; line-height: 1.45; }
  dt { color: #4e5b76; }
  dd { margin: 0; overflow-wrap: anywhere; }
  .refs { display: flex; flex-wrap: wrap; gap: 2px 10px; font-size: 11px; margin-top: 5px; }
  summary {
    min-height: 33px; display: flex; align-items: center; justify-content: space-between;
    gap: 8px; padding: 5px 10px; font-weight: 680; font-size: 13px; list-style: none; user-select: none;
  }
  summary::-webkit-details-marker { display: none; }
  summary::after {
    content: ""; width: 8px; height: 8px; margin-right: 2px; border: solid #5f7298; border-width: 0 1.5px 1.5px 0;
    transform: translateY(-2px) rotate(45deg);
  }
  details[open] > summary::after { transform: translateY(2px) rotate(225deg); }
  details[open] > summary { border-bottom: 1px solid #ebeff5; }
  .panel { padding: 7px 9px; }
  .knowledge-facets { display: grid; gap: 4px; }
  .facet { display: grid; grid-template-columns: 29px minmax(0, 1fr); align-items: center; gap: 5px; }
  .facet > span { color: var(--muted); font-size: 11px; }
  .facet .seg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .facet button { min-width: 0; }
  .knowledge-note { margin-top: 6px; }
  .sample-list-head { display: flex; align-items: center; justify-content: space-between; gap: 4px; margin-top: 7px; padding: 4px 0; border-top: 1px solid #edf0f6; }
  .sample-list-head h3 { color: var(--muted); font-size: 11px; font-weight: 650; }
  .sample-list-head button { padding: 1px 6px; min-height: 22px; font-size: 11px; }
  .sample-list-head button[aria-pressed="true"] { color: #244782; border-color: #b7c8ec; background: var(--blue-light); }
  .knowledge-list { display: grid; gap: 4px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .knowledge-list button {
    min-height: 27px; padding: 3px 5px; text-align: left; min-width: 0; border-radius: 5px;
    font-size: 11px; line-height: 1.25; overflow-wrap: anywhere;
  }
  .knowledge-list button[aria-pressed="true"] { border-color: #b7c8ec; background: var(--blue-light); color: #244782; font-weight: 700; }
  .control { display: grid; gap: 4px 7px; margin-bottom: 6px; font-size: 12px; }
  .control:last-child { margin-bottom: 0; }
  label.control { grid-template-columns: max-content minmax(0, 1fr); align-items: center; }
  .control select { width: 100%; min-height: 28px; padding: 2px 5px; color: var(--ink); }
  .control label, .layer { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .control output { font-variant-numeric: tabular-nums; color: var(--muted); }
  .control input { width: 100%; margin: 0; }
  .layer { min-height: 24px; font-size: 12px; }
  .layer-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px 12px; }
  input[type="checkbox"], input[type="range"] { accent-color: var(--blue); }
  input[type="checkbox"] { width: 14px; height: 14px; margin: 0; flex: none; }
  .note { color: var(--muted); font-size: 11px; line-height: 1.45; }
  .note + .note { margin-top: 5px; }
  .presentation .layout { width: 100%; }
  .presentation .glyph-field { height: clamp(215px, 39vh, 410px); }
  .presentation .specimen .observation { font-size: 15px; }
  .presentation .samplehead h3 { font-size: 16px; }
  @media (min-width: 901px) {
    .tray { position: sticky; top: 16px; }
  }
  @media (max-width: 900px) {
    .layout { gap: 11px; grid-template-columns: minmax(0, 1fr) minmax(265px, 31%); padding-top: 13px; }
    .tray { max-height: none; }
    .glyph-field { padding: 11px; }
  }
  @media (max-width: 720px) {
    .top { min-height: 60px; }
    .layout { display: block; }
    .tray { margin-top: 13px; }
    .stagebody { padding: 14px; }
    .samplehead { padding: 8px 10px; }
    .source-strip { padding: 7px 10px; gap: 6px; }
    .specimen .observation { padding: 9px 10px; grid-template-columns: 1fr; gap: 0; font-size: 12px; }
  }
  @media (max-width: 390px) {
    .boardhead { align-items: start; flex-direction: column; gap: 5px; }
    .boardhead p { text-align: left; }
    .mark { width: 34px; height: 34px; }
    .identity { gap: 7px; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="identity"><span class="mark" aria-hidden="true">Aa</span><h1>中英文字体识读</h1></div>
</header>
<main class="layout">
  <section class="stage" aria-labelledby="board-title">
    <div class="stagebody">
      <div class="boardhead"><h2 id="board-title">同字对照</h2><p id="board-context"></p></div>
      <div id="board"></div>
    </div>
    <footer class="stagefoot">
      <span id="stage-note"></span>
    </footer>
  </section>
  <aside class="tray" aria-label="教学托盘">
    <div class="tray-toolbar">
      <div class="seg" role="group" aria-label="展示方式">
        <button type="button" data-mode="shared" aria-pressed="true">同字对照</button>
        <button type="button" data-mode="original" aria-pressed="false">整行字样</button>
        <button type="button" data-mode="gallery" aria-pressed="false">总览</button>
      </div>
      <div class="tray-actions">
        <button type="button" id="reset">重置</button>
        <button type="button" id="fullscreen" aria-pressed="false">投屏</button>
      </div>
    </div>
    <details id="knowledge" open>
      <summary>知识点</summary>
      <div class="panel">
        <div class="knowledge-facets">
          <div class="facet">
            <span id="shape-label">字形</span>
            <div class="seg" role="group" aria-labelledby="shape-label">
              <button type="button" data-filter="serif" aria-pressed="false">衬线字体</button>
              <button type="button" data-filter="sans" aria-pressed="false">非衬线字体</button>
            </div>
          </div>
          <div class="facet">
            <span id="language-label">语言</span>
            <div class="seg" role="group" aria-labelledby="language-label">
              <button type="button" data-language="zh" aria-pressed="true">中文字体</button>
              <button type="button" data-language="en" aria-pressed="false">英文字体</button>
            </div>
          </div>
          <div class="facet">
            <span id="format-label">格式</span>
            <div class="seg" role="group" aria-labelledby="format-label">
              <button type="button" data-filter="shx" aria-pressed="false">SHX</button>
              <button type="button" data-filter="ttf" aria-pressed="false">TTF / TrueType</button>
            </div>
          </div>
        </div>
        <p class="note knowledge-note" id="knowledge-note" hidden></p>
        <div class="sample-list-head">
          <h3 id="samples-label">字体样本</h3>
          <button type="button" data-filter="all" aria-pressed="true">全部</button>
        </div>
        <div class="knowledge-list" id="lesson-list" role="group" aria-labelledby="samples-label"></div>
      </div>
    </details>
    <section class="intro" aria-label="知识点介绍">
      <div class="intro-header"><span>知识点介绍</span>
        <div class="steps">
          <button type="button" id="previous" aria-label="上一个知识点" aria-keyshortcuts="ArrowLeft" title="上一个知识点（←）">‹</button>
          <button type="button" id="next" aria-label="下一个知识点" aria-keyshortcuts="ArrowRight" title="下一个知识点（→）">›</button>
        </div>
      </div>
      <div class="info" id="info"></div>
    </section>
    <details id="compare-tools">
      <summary>对照工具</summary>
      <div class="panel">
        <label class="control" for="compare"><span>对照字体</span><select id="compare"></select></label>
        <label class="control" for="glyph"><span>共用字形</span><select id="glyph"></select></label>
        <div class="note" id="glyph-note" hidden></div>
      </div>
    </details>
    <details id="display-tools">
      <summary>显示与图层</summary>
      <div class="panel">
        <div class="control">
          <label for="size">字样大小 <output id="scale-label" for="size">100%</output></label>
          <input id="size" type="range" min="55" max="135" step="5" value="100">
        </div>
        <label class="layer">单独展示当前字体 <input type="checkbox" id="solo"></label>
        <div class="layer-grid">
          <label class="layer">辅助线 <input type="checkbox" data-layer="guides" checked></label>
          <label class="layer">字体名称 <input type="checkbox" data-layer="names" checked></label>
          <label class="layer">字样条 <input type="checkbox" data-layer="source" checked></label>
          <label class="layer">观察提示 <input type="checkbox" data-layer="observations" checked></label>
        </div>
      </div>
    </details>
    <details>
      <summary>样本说明</summary>
      <div class="panel">
        <p class="note">印刷字样取自课堂参考图，SHX 字样为单线笔画示意。部分 SHX 的实际样张可在对应字体资料中查看。</p>
        <p class="note">同字对照显示共有字形，并以整行样本的字高为缩放参照。蓝色虚线供对齐观察。</p>
      </div>
    </details>
  </aside>

    { id: "times", name: "Times New Roman", type: "英文衬线体", origin: "Stanley Morison 指导，Victor Lardent 绘制", date: "1932 年在英国《泰晤士报》启用", use: "报刊、书籍、论文", style: "有衬线，粗细分明，排版紧凑。", look: "看小写 a 的起收笔和粗细变化。", compare: "helvetica", refs: ["times"] },
    { id: "helvetica", name: "Helvetica", type: "英文无衬线体", origin: "Max Miedinger 设计，Eduard Hoffmann 指导", date: "1957 年以 Neue Haas Grotesk 面世", use: "品牌、标识、导视", style: "无衬线，线条匀整，风格中性。", look(samples) { return samples === "a" ? "看小写 a 的末端和内白。" : "看 a、e 的内白，把这个字样当作几款变体的基准。"; }, compare: "times", refs: ["helvetica"] },
    { id: "condensed", name: "Helvetica Condensed", type: "Helvetica 家族 · 窄体", origin: "Helvetica 家族的窄体字款", date: "不同版本的发行时间各异", use: "窄幅标题、海报、导视", style: "字形收窄，同一行可排更多字。", look: "以 H 的宽高比和整词宽度观察字形收窄。", compare: "helvetica", refs: ["variants"] },
    { id: "narrow", name: "Helvetica Narrow", type: "Helvetica 家族 · 窄体", origin: "Helvetica 家族的窄体字款", date: "见于经典 PostScript 字体集", use: "表格、窄栏、密集标注", style: "字面偏窄，节省横向空间。", look: "看 H、e 的宽高比，再比较等高样本的整词宽度。", compare: "condensed", refs: ["variants", "narrow"] },
    { id: "bold-oblique", name: "Helvetica-BoldOblique", short: "Bold Oblique", type: "Helvetica 家族 · 粗斜体", origin: "Helvetica 家族的粗斜字款", date: "见于经典 PostScript 字体集", use: "强调信息、广告标题", style: "笔画偏粗，字形整体右倾。", look: "沿 H、l 的长笔画看倾斜，再与正体的笔画粗细比较。", compare: "helvetica", refs: ["variants", "narrow"] },
    { id: "light-condensed", name: "Helvetica-Condensed-Light-Li", short: "Condensed Light", type: "Helvetica 家族 · 窄细体", origin: "对应 Helvetica Condensed Light 字款", date: "不同版本的发行时间各异", use: "副标题、海报、展示排版", style: "字形窄，笔画细。", look: "对照 H 的竖画和 e 的内白，观察弱化字重后的变化。", compare: "condensed", refs: ["variants"] },
    { id: "inserat", name: "HelveticaInserat-Roman-SemiBold", short: "Helvetica Inserat", type: "Helvetica 家族 · 展示字款", origin: "Helvetica Inserat 的展示字款", date: "不同版本的发行时间各异", use: "广告、大字标题", style: "高窄紧密，笔画厚重。", look: "观察 H、e 的内白，再看字母间距有多紧。", compare: "helvetica", refs: ["inserat"] }
  ]
};

const outlines = JSON.parse(document.getElementById("outlines").textContent);
const shapeClasses = {
  serif: ["song", "source-serif", "times"],
  sans: ["hei", "yahei", "source-sans", "helvetica", "condensed", "narrow", "bold-oblique", "light-condensed", "inserat"]
};
const trueTypeFiles = {
  fang: "simfang.ttf", hei: "simhei.ttf", kai: "simkai.ttf",
  song: "simsun.ttc", yahei: "msyh.ttc", times: "times.ttf"
};
const cadLessons = {
  zh: [
    { id: "shx-hztxt", name: "hztxt.shx", type: "中文 SHX · CAD 大字体", use: "旧版中文工程图的文字标注", style: "用单线表现汉字笔画，可搭配 txt.shx。", look: "观察笔画中心线，再和宋体的填充轮廓比较。", compare: "song", refs: ["cadStandard", "chineseShxSamples"] },
    { id: "shx-gbcbig", name: "gbcbig.shx", type: "中文 SHX · CAD 大字体", use: "AutoCAD 简体中文图纸标注", style: "AutoCAD 随附的简体中文大字体，可搭配常规 SHX 字体。", look: "对照单线「宋」和宋体「宋」，观察横竖笔画。", compare: "song", refs: ["cadBigFont", "chineseShxSamples"] }
  ],
  en: [
    { id: "shx-txt", name: "txt.shx", type: "英文 SHX · 常规字体", use: "CAD 拉丁字母、数字与常见符号标注", style: "常见的 STANDARD 文字样式字体，字形由线段组织。", look: "看小写 a 如何用单线围出字腔。", compare: "times", refs: ["cadStyles", "cadStandard"] },
    { id: "shx-simplex", name: "simplex.shx", type: "英文 SHX · 常规字体", use: "AutoCAD 标注及缺失字体时的默认替代", style: "常见的单线工程字，字母曲线以线段表达。", look: "观察单线如何形成小写 a 的弧形和转折。", compare: "times", refs: ["cadAlternate"] },
    { id: "shx-romans", name: "romans.shx", type: "英文 SHX · Roman Simplex", use: "工程图纸中的比例字母标注", style: "字母宽度随形态变化，常用于工程图注记。", look: "比较整行字样里 A、2 和 a 的字宽。", compare: "times", refs: ["romansSample"] }
  ]
};
for (const language of Object.keys(cadLessons)) lessons[language].push(...cadLessons[language]);

// These centerlines illustrate the stroke construction. Source specimen links stay with each lesson.
const cadGlyphs = {
  "宋": "M29 4L39 16 M9 37L13 22H63L58 35 M11 51H61 M35 35V97 M34 53L28 65 19 76 6 86 M37 53L44 66 54 77 67 85",
  "体": "M24 4L19 20 12 34 3 47 M15 32V96 M28 31H73 M49 6V97 M47 33L39 54 32 67 23 77 M51 33L58 54 66 67 78 77 M33 76H66",
  A: "M3 99L32 3 61 99 M12 71H52",
  2: "M4 23L9 12 19 5 35 5 46 13 50 24 49 34 44 45 7 86 4 96H52",
  a: "M48 29V96 M48 43L41 34 31 29 20 29 10 35 4 46 3 67 7 84 16 94 27 97 38 94 48 84"
};
function assembleStrokeSample(glyphs) {
  let width = 0;
  const paths = glyphs.map(([key, glyphWidth, scale]) => {
    const transform = `translate(${width} 0) scale(${scale} 1)`;
    width += glyphWidth + 13;
    return [cadGlyphs[key], transform];
  });
  return [width - 13, 100, paths];
}
for (const item of cadLessons.zh) {
  const narrow = item.id === "shx-gbcbig";
  const glyphs = [["宋", narrow ? 63 : 72, narrow ? .86 : 1], ["体", narrow ? 72 : 83, narrow ? .86 : 1]];
  outlines[item.id] = {
    full: assembleStrokeSample(glyphs),
    "宋": assembleStrokeSample(glyphs.slice(0, 1)),
    "体": assembleStrokeSample(glyphs.slice(1))
  };
}
for (const item of cadLessons.en) {
  const scale = { "shx-txt": .81, "shx-simplex": 1, "shx-romans": .93 }[item.id];
  const glyphs = [["A", 65 * scale, scale], ["2", 55 * scale, scale], ["a", 52 * scale, scale]];
  outlines[item.id] = { full: assembleStrokeSample(glyphs), a: assembleStrokeSample(glyphs.slice(2)) };
}

const $ = (selector) => document.querySelector(selector);
const all = (selector) => [...document.querySelectorAll(selector)];
const element = (tag, css, copy) => {
  const result = document.createElement(tag);
  if (css) result.className = css;
  if (copy) result.textContent = copy;
  return result;
};
const freshState = () => ({
  lang: "zh", mode: "shared", filter: "all",
  active: { zh: "fang", en: "times" }, compare: { zh: "song", en: "helvetica" },
  glyph: "", size: 100, solo: false,
  layers: { guides: true, names: true, source: true, observations: true }
});
let state = freshState();
const currentGroup = () => lessons[state.lang];
const currentLesson = () => currentGroup().find(item => item.id === state.active[state.lang]);
const compareLesson = () => currentGroup().find(item => item.id === state.compare[state.lang]);
const isShx = item => item.id.startsWith("shx-");
const filteredGroup = () => currentGroup().filter(item => {
  switch (state.filter) {
    case "shx": return isShx(item);
    case "ttf": return Object.hasOwn(trueTypeFiles, item.id);
    case "all": return true;
    default: return shapeClasses[state.filter].includes(item.id);
  }
});
const availableGlyphs = (first, second) => Object.keys(outlines[first.id]).filter(key => (
  key !== "full" && (state.solo || Object.hasOwn(outlines[second.id], key))
));
const displayedGlyph = (keys) => keys.includes(state.glyph) ? state.glyph : keys[0];

function activate(id) {
  state.active[state.lang] = id;
  state.compare[state.lang] = currentLesson().compare;
  state.glyph = "";
  render();
}

function selectCategory() {
  const group = filteredGroup();
  if (!group.includes(currentLesson())) {
    activate(group[0].id);
    return;
  }
  state.glyph = "";
  render();
}

function goBy(step) {
  const group = filteredGroup();
  const index = group.indexOf(currentLesson());
  activate(group[(index + step + group.length) % group.length].id);
}

function makeOutline(item, key, label, frame) {
  const [width, height, pathData] = outlines[item.id][key];
  const namespace = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(namespace, "svg");
  const padding = .75;
  const viewWidth = (frame?.width ?? width) + 2 * padding;
  const viewHeight = (frame?.height ?? height) + 2 * padding;
  svg.setAttribute("viewBox", `0 0 ${viewWidth} ${viewHeight}`);
  svg.setAttribute("width", viewWidth);
  svg.setAttribute("height", viewHeight);
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", label);
  const positioned = document.createElementNS(namespace, "g");
  positioned.setAttribute("transform", `translate(${(viewWidth - width) / 2} ${viewHeight - height - padding})`);
  if (isShx(item)) {
    positioned.setAttribute("fill", "none");
    positioned.setAttribute("stroke", "currentColor");
    positioned.setAttribute("stroke-width", "2.7");
    positioned.setAttribute("stroke-linejoin", "round");
    for (const [data, transform] of pathData) {
      const path = document.createElementNS(namespace, "path");
      path.setAttribute("d", data);
      path.setAttribute("transform", transform);
      positioned.append(path);
    }
  } else {
    const path = document.createElementNS(namespace, "path");
    path.setAttribute("d", pathData);
    path.setAttribute("fill-rule", "evenodd");
    path.setAttribute("fill", "currentColor");
    positioned.append(path);
  }
  svg.append(positioned);
  return svg;
}

function renderInfo(item) {
  const info = $("#info");
  const list = element("dl");
  const fields = [["起源", item.origin], ["时间", item.date], ["示例文件", trueTypeFiles[item.id]], ["用途", item.use], ["风格", item.style]];
  for (const [name, value] of fields.filter(([, value]) => value)) {
    list.append(element("dt", "", name), element("dd", "", value));
  }
  const links = element("div", "refs");
  const sources = state.filter === "ttf" ? [...item.refs, "windows"] : item.refs;
  for (const key of sources) {
    const [label, url] = references[key];
    const a = element("a", "", label);
    a.href = url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    links.append(a);
  }
  info.replaceChildren(element("h2", "", item.name), element("p", "category", item.type), list, links);
}

function renderKnowledge() {
  const target = $("#lesson-list");
  const previous = document.activeElement?.dataset?.lesson;
  const buttons = filteredGroup().map((item) => {
    const button = element("button", "", item.short || item.name);
    button.type = "button";
    button.title = item.name;
    button.dataset.lesson = item.id;
    button.setAttribute("aria-pressed", item === currentLesson());
    button.addEventListener("click", () => {
      if (state.mode === "gallery") state.mode = "shared";
      activate(item.id);
    });
    return button;
  });
  target.replaceChildren(...buttons);
  if (previous) buttons.find(button => button.dataset.lesson === previous)?.focus({ preventScroll: true });

  const notes = {
    serif: state.lang === "zh" ? "看宋体横画末端的小三角，再看横竖粗细。" : "看笔画端部伸出的小短线，这就是衬线。",
    sans: state.lang === "zh" ? "看黑体笔画端部，多为干净的平切。" : "看 Helvetica 的笔画端部和粗细变化。",
    shx: state.lang === "zh" ? "中文大字体可与常规 SHX 搭配，如 txt.shx + gbcbig.shx。" : "常规 SHX 可用于字母、数字与符号。",
    ttf: ".ttf 是单个 TrueType 字体文件，.ttc 是 TrueType 字体集。"
  };
  const note = $("#knowledge-note");
  note.textContent = notes[state.filter] ?? "";
  note.hidden = !note.textContent;
}

function renderSelectors(first, second, available, key) {
  const compare = $("#compare");
  const choices = currentGroup().filter(item => item !== first).map(item => new Option(item.name, item.id));
  compare.replaceChildren(...choices);
  compare.value = second.id;
  compare.disabled = state.solo;
  const glyph = $("#glyph");
  glyph.replaceChildren(...(available.length ? available.map(value => new Option(value, value)) : [new Option("无共用字形", "")]));
  glyph.value = key || "";
  glyph.disabled = !available.length || state.mode === "gallery";
  $("#glyph-note").hidden = available.length > 0 || state.mode !== "shared";
  $("#glyph-note").textContent = "这两款样本没有共有字形，画面显示各自的整行字样。";
  $("#size").value = state.size;
  $("#scale-label").value = `${state.size}%`;
  $("#solo").checked = state.solo;
  for (const box of all("[data-layer]")) box.checked = state.layers[box.dataset.layer];
}

function specimenHint(item, key) {
  const hint = typeof item.look === "function" ? item.look(key) : item.look;
  if (key === "full" || isShx(item) || typeof item.look === "function" || item.id === "times") return hint;
  if (key === "a") return "看 a 的字腔、收笔和笔画轻重。";
  if (state.lang === "zh" && !hint.includes(`「${key}」`)) {
    return `看「${key}」的笔画粗细、转折和收笔。`;
  }
  return hint;
}

function buildSpecimen(item, key, isPrimary, frame) {
  const figure = element("figure", `specimen${isPrimary ? " current" : ""}`);
  const header = element("figcaption", "samplehead");
  const role = isPrimary ? "当前字体" : "对照字体";
  header.append(element("span", "role", isShx(item) ? `${role} · 笔画示意` : role), element("h3", "", item.name));
  header.hidden = !state.layers.names;
  const field = element("div", "glyph-field");
  const outline = makeOutline(item, key, key === "full" ? item.name : `${item.name}的${key}`, frame);
  const pixels = (key === "full" ? 87 : 154) * state.size / 100;
  outline.style.width = `${pixels * (frame.width + 1.5) / 100}px`;
  outline.style.height = "auto";
  field.append(outline);
  figure.append(header, field);

  if (key !== "full" && state.layers.source) {
    const source = element("div", "source-strip");
    const sourceLabel = isShx(item) ? "整行示意" : "原图字样";
    source.append(element("span", "", sourceLabel), makeOutline(item, "full", `${item.name}${sourceLabel}`));
    figure.append(source);
  }
  if (state.layers.observations) {
    const observation = element("div", "observation");
    observation.append(element("strong", "", "观察"), element("span", "", specimenHint(item, key)));
    figure.append(observation);
  }
  return figure;
}

function renderBoard(first, second, key) {
  const board = $("#board");
  const language = state.lang === "zh" ? "中文字体" : "英文字体";
  const isShared = state.mode === "shared" && Boolean(key);
  if (state.mode === "gallery") {
    const gallery = element("div", "gallery");
    const items = filteredGroup();
    for (const item of items) {
      const tile = element("figure", item === first ? "tile current" : "tile");
      const graphic = makeOutline(item, "full", item.name);
      graphic.style.height = `${33 * state.size / 100}px`;
      tile.append(graphic);
      if (state.layers.names) tile.append(element("figcaption", "tile-label", isShx(item) ? `${item.name} · 笔画示意` : item.name));
      gallery.append(tile);
    }
    $("#board-title").textContent = `${language}总览`;
    $("#board-context").textContent = "从知识点选取字体进行对照";
    $("#stage-note").textContent = items.some(isShx) ? "SHX 字样为单线笔画示意。" : "字样取自课堂参考图。";
    board.replaceChildren(gallery);
    return;
  }
  const samples = element("div", `samples${state.solo ? " single" : ""}${state.layers.guides ? " has-guides" : ""}`);
  const renderKey = isShared ? key : "full";
  const sampleItems = state.solo ? [first] : [first, second];
  const dimensions = sampleItems.map(item => outlines[item.id][renderKey]);
  const frame = {
    width: Math.max(...dimensions.map(([width]) => width)),
    height: Math.max(...dimensions.map(([, height]) => height))
  };
  for (const [index, item] of sampleItems.entries()) samples.append(buildSpecimen(item, renderKey, index === 0, frame));
  $("#board-title").textContent = state.solo ? "单款字样" : (isShared ? "同字对照" : "整行字样");
  $("#board-context").textContent = isShared ? `观察字样「${key}」` : language;
  const note = state.mode === "shared" && !key
    ? "暂无共有字形，已显示整行字样。"
    : isShared ? "以整行样本的字高为参照，保留字形宽高比例。" : "";
  const sourceNote = sampleItems.some(isShx) ? "SHX 字样为单线笔画示意。" : !note ? "字样取自课堂参考图。" : "";
  $("#stage-note").textContent = [note, sourceNote].filter(Boolean).join(" ");
  board.replaceChildren(samples);
}

function render() {
  const first = currentLesson();
  const second = compareLesson();
  const available = availableGlyphs(first, second);
  const key = displayedGlyph(available);
  for (const button of all("[data-language]")) button.setAttribute("aria-pressed", button.dataset.language === state.lang);
  for (const button of all("[data-filter]")) button.setAttribute("aria-pressed", button.dataset.filter === state.filter);
  for (const button of all("[data-mode]")) button.setAttribute("aria-pressed", button.dataset.mode === state.mode);
  renderInfo(first);
  renderKnowledge();
  renderSelectors(first, second, available, key);
  renderBoard(first, second, key);
}

for (const button of all("[data-language]")) {
  button.addEventListener("click", () => {
    state.lang = button.dataset.language;
    selectCategory();
  });
}
for (const button of all("[data-filter]")) {
  button.addEventListener("click", () => {
    state.filter = button.dataset.filter;
    selectCategory();
  });
}
for (const button of all("[data-mode]")) {
  button.addEventListener("click", () => {
    state.mode = button.dataset.mode;
    render();
  });
}
$("#previous").addEventListener("click", () => goBy(-1));
$("#next").addEventListener("click", () => goBy(1));
$("#reset").addEventListener("click", () => {
  state = freshState();
  for (const panel of all(".tray details")) panel.open = panel.id === "knowledge";
  render();
});
$("#compare").addEventListener("change", (event) => {
  state.compare[state.lang] = event.target.value;
  state.glyph = "";
  if (state.mode === "gallery") state.mode = "shared";
  render();
});
$("#glyph").addEventListener("change", (event) => {
  state.glyph = event.target.value;
  state.mode = "shared";
  render();
});
$("#size").addEventListener("input", (event) => {
  state.size = Number(event.target.value);
  $("#scale-label").value = `${state.size}%`;
  const first = currentLesson();
  const second = compareLesson();
  renderBoard(first, second, displayedGlyph(availableGlyphs(first, second)));
});
$("#solo").addEventListener("change", (event) => {
  state.solo = event.target.checked;
  if (state.solo && state.mode === "gallery") state.mode = "shared";
  render();
});
for (const box of all("[data-layer]")) {
  box.addEventListener("change", () => {
    state.layers[box.dataset.layer] = box.checked;
    render();
  });
}
window.addEventListener("keydown", (event) => {
  if (event.target.closest?.("input, select, textarea, [contenteditable]") || event.ctrlKey || event.altKey || event.metaKey) return;
  if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
    event.preventDefault();
    goBy(event.key === "ArrowRight" ? 1 : -1);
  }
});
const fullscreen = $("#fullscreen");
function setPresentation(active) {
  document.body.classList.toggle("presentation", active);
  fullscreen.setAttribute("aria-pressed", active);
  fullscreen.textContent = active ? "退出投屏" : "投屏";
}
fullscreen.addEventListener("click", async () => {
  const active = !document.body.classList.contains("presentation");
  setPresentation(active);
  if (active && document.fullscreenEnabled) {
    await document.documentElement.requestFullscreen().catch(() => {});
  } else if (!active && document.fullscreenElement) {
    await document.exitFullscreen().catch(() => {});
  }
});
document.addEventListener("fullscreenchange", () => {
  if (!document.fullscreenElement) setPresentation(false);
});
render();
</script>
</body>
</html>
