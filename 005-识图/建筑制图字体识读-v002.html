:root {
  color-scheme: light;
  --background: #f3f5f0;
  --paper: #fff;
  --ink: #25352f;
  --muted: #54685e;
  --accent: #185c47;
  --line: #dee6dd;
  --inverse-zoom: 1;
  --ui: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
  --serif: "Songti SC", SimSun, "Noto Serif CJK SC", serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; background: var(--background); color: var(--ink); font: 14px/1.5 var(--ui); }
.page { max-width: 1600px; margin: auto; padding: 34px 36px 28px; }
h1 { margin: 0 0 22px; font: 700 clamp(30px, 3.4vw, 44px)/1.16 var(--serif); letter-spacing: .045em; }
.workspace { display: grid; grid-template-columns: minmax(0, 1fr) 188px; gap: 16px; align-items: start; }
.sheet, .tray { min-width: 0; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; }
.sheet { max-height: calc(100dvh - 135px); min-height: 230px; overflow: auto; scrollbar-color: #aabcb0 transparent; scrollbar-width: thin; }
table { width: 100%; border-spacing: 0; text-align: left; font-variant-numeric: tabular-nums; }
th { position: sticky; top: 0; z-index: 1; background: #eaf1e9; }
th, td { padding: 8px 15px; white-space: nowrap; }
th { height: 48px; border-bottom: 1px solid #d6e2d6; color: #264737; font-size: 13px; }
th small { margin-left: 3px; color: var(--muted); font: inherit; font-size: 11px; }
tbody td { border-bottom: 1px solid #e9eee8; height: 40px; }
tr:last-child td { border-bottom: 0; }
th:nth-child(-n+3), td:nth-child(-n+3) { width: 1%; text-align: center; }
td:last-child, th:last-child { border-left: 1px solid #e6ece5; padding-left: 17px; }
tbody td:first-child { color: var(--accent); font-weight: 700; background: #f0f6ee; }
.size-range { color: var(--muted); }
.sample {
  display: block;
  overflow: visible;
  width: calc(var(--ink-width) * var(--inverse-zoom));
  height: calc(var(--ink-height) * var(--inverse-zoom));
}
.sample text { font-family: StudioSong, serif; font-kerning: none; font-variant-ligatures: none; fill: #232d29; user-select: none; }
.sample path { stroke: #232d29; stroke-linecap: round; stroke-linejoin: round; fill: none; }
.tray { display: grid; gap: 10px; padding: 10px; }
.tray-group { display: grid; gap: 6px; }
.tray-group + .tray-group { padding-top: 9px; border-top: 1px solid var(--line); }
.tray-label { margin: 0 0 1px; color: var(--muted); font-size: 11px; font-weight: 600; }
.tray button {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 3px;
  min-height: 49px;
  padding: 7px 10px;
  border: 1px solid #e0e9e1;
  border-radius: 7px;
  background: #f9fbf8;
  color: #40574c;
  text-align: left;
  cursor: pointer;
  font: 600 14px/1.35 var(--ui);
}
.tray button:hover { border-color: #88ab98; }
.tray button[aria-pressed="true"] { color: #fff; border-color: var(--accent); background: var(--accent); }
.format { color: inherit; opacity: .82; font-size: 11px; font-weight: 500; letter-spacing: .02em; }
button:focus-visible, .sheet:focus-visible { outline: 2px solid #26876a; outline-offset: 2px; }
@media (max-width: 900px) {
  .page { padding: 26px 22px; }
  .workspace { grid-template-columns: minmax(0, 1fr) 156px; gap: 12px; }
  th, td { padding-inline: 11px; }
}
@media (max-width: 640px) {
  .page { padding: 18px 12px; }
  h1 { margin-bottom: 14px; }
  .workspace { grid-template-columns: minmax(0, 1fr); }
  .tray { grid-row: 1; gap: 7px; padding: 6px; }
  .tray-group { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .tray-group + .tray-group { padding-top: 6px; }
  .tray-label { grid-column: 1 / -1; }
  .tray button { padding-inline: 5px; font-size: 12px; }
  .sheet { max-height: calc(100dvh - 246px); }
  th, td { padding-inline: 8px; }
  td:last-child, th:last-child { padding-left: 10px; }
}
@page { size: A4 landscape; margin: 12mm; }
@media print {
  body { background: white; }
  .page { padding: 0; }
  .workspace { display: block; }
  .tray { display: none; }
  .sheet { max-height: none; overflow: visible; border: 0; }
  th { position: static; }
  tr { break-inside: avoid; }
  .sample { width: var(--ink-width); height: var(--ink-height); }
}
</style>
</head>
<body>
<main class="page">
  <h1>字体识读</h1>
  <div class="workspace">
    <div class="sheet" tabindex="0" aria-label="字体样张">
      <table aria-label="字高、磅值、字号对照">
        <thead>
          <tr>
            <th scope="col">字高 <small>mm</small></th>
            <th scope="col">磅值 <small>pt</small></th>
            <th scope="col">字号</th>
            <th scope="col">字样 <small id="sample-rule"></small></th>
          </tr>
        </thead>
        <tbody id="specimens"></tbody>
      </table>
    </div>
    <aside class="tray" aria-label="字体选项">
      <div class="tray-group" role="group" aria-labelledby="font-group-label">
        <p class="tray-label" id="font-group-label">字体类型</p>
        <button type="button" data-font="shx" aria-pressed="true">汉字矢量字体<span class="format">SHX 长仿宋</span></button>
        <button type="button" data-font="ttf" aria-pressed="false">TrueType 字体<span class="format">TTF 宋体</span></button>
        <button type="button" data-font="latin" aria-pressed="false">非汉字矢量字体<span class="format">SHX 单线体</span></button>
      </div>
      <div class="tray-group" role="group" aria-labelledby="style-group-label">
        <p class="tray-label" id="style-group-label">字形</p>
        <button type="button" data-style="regular" aria-pressed="true">一般字体<span class="format">笔画宽 1/10 字高</span></button>
        <button type="button" data-style="narrow" aria-pressed="false">窄体字<span class="format">笔画宽 1/14 字高</span></button>
        <button type="button" data-style="oblique" aria-pressed="false">斜体字<span class="format">与底线成 75°</span></button>
      </div>
    </aside>
  </div>
</main>

  const reader = new DataView(bytes.buffer);
  const shapes = new Map();
  let offset = 31 + reader.getUint16(29, true);
  while (offset < bytes.length) {
    const codePoint = reader.getUint16(offset, true);
    const end = offset + 4 + reader.getUint16(offset + 2, true);
    offset += 4;
    while (bytes[offset++] !== 0) { /* Skip the record name. */ }
    shapes.set(codePoint, bytes.subarray(offset, end));
    offset = end;
  }
  let x = 0, y = 0, penDown = false;
  const path = [];
  for (const char of text) {
    const shape = shapes.get(char.codePointAt(0));
    for (let i = 0; i < shape.length - 1; i++) {
      const command = shape[i];
      if (command === 1) {
        penDown = true;
        path.push(`M${x} ${-y}`);
      } else if (command === 2) {
        penDown = false;
      } else if (command === 8) {
        x += (shape[++i] << 24) >> 24;
        y += (shape[++i] << 24) >> 24;
        if (penDown) path.push(`L${x} ${-y}`);
      }
    }
  }
  return { sample: text, advance: x, top: 100, bottom: 0, em: 100, guideTop: 100, guideBottom: 0, path: path.join('') };
}

const fontData = {
  shx: decodeStrokeSample('font-shx', sampleText),
  ttf: {
    sample: sampleText, advance: 8836, top: 880, bottom: -120, em: 1000,
    guideTop: 842, guideBottom: -79, referenceStem: 82,
  },
  latin: decodeStrokeSample('font-latin', latinSample),
};
const styles = {
  regular: { divisor: 10, rule: '笔画宽＝字高的 1/10' },
  narrow: { divisor: 14, rule: '笔画宽＝字高的 1/14' },
  oblique: { divisor: 10, rule: '与底线成 75°，高宽同直体', slanted: true },
};
const mmPerPoint = 25.4 / 72;
const formatNumber = new Intl.NumberFormat('zh-CN', { maximumFractionDigits: 2, useGrouping: false });
const specimens = document.getElementById('specimens');
const sampleRule = document.getElementById('sample-rule');
const selection = { font: 'shx', style: 'regular' };

function sizeName(points) {
  const index = wordSizes.findIndex(([, size]) => points + 1e-9 >= size);
  if (index === -1) return `小于${wordSizes.at(-1)[0]}`;
  const [name, size] = wordSizes[index];
  if (Math.abs(points - size) < 1e-9) return name;
  if (index === 0) return `大于${name}`;
  return `${name}～${wordSizes[index - 1][0]}`;
}

function sizeRows(font) {
  const { em, guideTop, guideBottom } = fontData[font];
  const heightPerPoint = mmPerPoint * (guideTop - guideBottom) / em;
  return standardHeights[font].map(height => {
    const points = height / heightPerPoint;
    return { height, points, name: sizeName(points) };
  });
}

const svgNamespace = 'http://www.w3.org/2000/svg';
function svgElement(name, attributes) {
  const node = document.createElementNS(svgNamespace,name);
  for (const [key,value] of Object.entries(attributes)) node.setAttribute(key,value);
  return node;
}

function makeSample(data, points, style) {
  const scale = points * 96 / 72 / data.em;
  const inkHeight = data.guideTop - data.guideBottom;
  const stroke = inkHeight / style.divisor;
  const slant = style.slanted ? 15 : 0;
  const shift = Math.tan(slant * Math.PI / 180);
  const left = -data.em * .065 + data.bottom * shift;
  const right = data.advance + data.em * .065 + data.top * shift;
  const top = -data.top - data.em * .035;
  const width = right - left;
  const height = data.top - data.bottom + data.em * .07;
  const svg = svgElement('svg', {
    class: 'sample',
    viewBox: `${left} ${top} ${width} ${height}`,
    role: 'img',
    'aria-label': data.sample,
  });
  svg.style.setProperty('--ink-width', `${width * scale}px`);
  svg.style.setProperty('--ink-height', `${height * scale}px`);
  if (data.path) {
    // Inset the stroke centerlines so the ink keeps the indicated cap height.
    const centerlineScale = 1 - stroke / inkHeight;
    const path = data.path.replace(/ (-?\d+)(?=[ML]|$)/g,
      (_, y) => ` ${Number(y) * centerlineScale - stroke / 2}`);
    svg.append(svgElement('path', { d: path, 'stroke-width': stroke }));
  } else {
    // Calibrate the Song contour to the left main stem of the sample's u.
    const weightChange = stroke - data.referenceStem;
    const label = svgElement('text', {
      x: 0, y: 0, 'font-size': data.em,
      stroke: weightChange >= 0 ? '#232d29' : 'white',
      'stroke-width': Math.abs(weightChange),
      'stroke-linejoin': 'round',
    });
    label.textContent = data.sample;
    svg.append(label);
  }
  if (slant) svg.firstElementChild.setAttribute('transform', `skewX(${-slant})`);
  return svg;
}

function renderFont() {
  const { font } = selection;
  const style = styles[selection.style];
  sampleRule.textContent = style.rule;
  sampleRule.title = font === 'ttf' ? '宋体保留粗细笔画，笔画宽度以样字的主笔画示意。' : '';
  const rows = sizeRows(font).map(({ height, points, name }) => {
    const row = document.createElement('tr');
    row.insertCell().textContent = formatNumber.format(height);
    row.insertCell().textContent = formatNumber.format(points);
    const nameCell = row.insertCell();
    nameCell.textContent = name;
    nameCell.className = 'size-range';
    row.insertCell().append(makeSample(fontData[font], points, style));
    return row;
  });
  specimens.replaceChildren(...rows);
}
for (const group of ['font', 'style']) {
  const buttons = document.querySelectorAll(`[data-${group}]`);
  for (const button of buttons) {
    button.addEventListener('click', () => {
      if (selection[group] === button.dataset[group]) return;
      selection[group] = button.dataset[group];
      for (const control of buttons) control.setAttribute('aria-pressed', String(control === button));
      renderFont();
      if (group === 'font') specimens.closest('.sheet').scrollTo(0, 0);
    });
  }
}

const desktopBrowser = window === window.top && !navigator.maxTouchPoints;
const overviewZoom = window.outerWidth / window.innerWidth;
const nativeZoomLevels = [.25,.33,.5,.67,.75,.8,.9,1,1.1,1.25,1.5,1.75,2,2.5,3,4,5];
const closestZoom = nativeZoomLevels.reduce((best, value) =>
  Math.abs(value-overviewZoom) < Math.abs(best-overviewZoom) ? value : best, 1);
const initialZoom = desktopBrowser && Math.abs(closestZoom-overviewZoom)<.022 ? closestZoom : 1;
const initialDensity = (window.devicePixelRatio || 1) / initialZoom;
let densityQuery;
function updateZoom() {
  const density = window.devicePixelRatio || 1;
  const pinch = window.visualViewport?.scale || 1;
  const inverse = initialDensity / density / pinch;
  document.documentElement.style.setProperty('--inverse-zoom',String(inverse));
  densityQuery?.removeEventListener('change',updateZoom);
  densityQuery = matchMedia(`(resolution: ${density}dppx)`);
  densityQuery.addEventListener('change',updateZoom);
}

window.addEventListener('resize',updateZoom,{passive:true});
window.visualViewport?.addEventListener('resize',updateZoom,{passive:true});
renderFont();
updateZoom();
</script>
</body>
</html>
