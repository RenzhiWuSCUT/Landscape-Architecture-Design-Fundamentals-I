<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3.2 标题栏 · 房屋建筑制图统一标准</title>
<style>
  :root {
    color-scheme: light;
    --ink: #162e34;
    --muted: #52676d;
    --soft: #73868a;
    --line: #dce6e4;
    --teal: #116659;
    --teal-dark: #084d43;
    --pale: #e8f4ef;
    --surface: #fff;
    --ui: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    --num: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; color: var(--ink); background: #f4f7f6; font: 14px/1.5 var(--ui); }
  button, summary { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: default; }
  button:focus-visible, summary:focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; }
  .masthead { height: 86px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .mast-inner { max-width: 1700px; height: 100%; margin: auto; padding: 0 31px; display: flex; align-items: center; gap: 15px; }
  .brand { flex: none; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 13px; background: var(--teal-dark); color: white; }
  .brand svg { width: 24px; height: 24px; }
  h1, h2, p { margin: 0; }
  h1 { font-size: 24px; font-weight: 740; letter-spacing: .015em; line-height: 1.22; }
  .source { margin-top: 5px; color: var(--muted); font-size: 12px; }
  .standard { margin-left: auto; color: var(--muted); background: #f4f7f6; border: 1px solid var(--line); padding: 6px 10px; border-radius: 7px; font: 12px var(--num); white-space: nowrap; }
  .workspace { max-width: 1700px; margin: auto; padding: 22px 28px; display: grid; grid-template-columns: minmax(0, 1fr) 328px; gap: 18px; }
  .board, .tray { min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 15px; box-shadow: 0 6px 24px #25423c09; }
  .board { height: max(640px, calc(100dvh - 130px)); display: flex; flex-direction: column; overflow: hidden; }
  .board-head { min-height: 75px; padding: 12px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); }
  .board-head h2 { font-size: 18px; font-weight: 700; letter-spacing: .015em; }
  .fig { color: var(--muted); margin-top: 3px; font-size: 11px; }
  .controls { display: flex; align-items: center; gap: 8px; flex: none; }
  .zoom { display: flex; align-items: center; gap: 1px; padding: 2px; background: #f4f7f6; border: 1px solid var(--line); border-radius: 8px; }
  .control { display: grid; place-items: center; padding: 0; width: 29px; height: 29px; color: #3c575a; border: 0; border-radius: 5px; background: transparent; }
  .control:is(:hover,:focus-visible):not(:disabled) { background: #dcebe5; color: var(--teal-dark); }
  .control:disabled { opacity: .35; }
  .control svg, summary svg, .legend-icon svg, .detail-back svg { width: 16px; height: 16px; }
  .control.fit { width: 43px; font: 11px var(--num); }
  .control.full { width: 34px; height: 35px; border: 1px solid var(--line); border-radius: 8px; }
  .scene { flex: 1; min-height: 0; overflow: hidden; position: relative; background-color: #eef4f1; background-image: radial-gradient(#b9cdc6 0.7px, transparent 0.8px); background-size: 17px 17px; }
  .scene > svg { width: 100%; height: 100%; display: block; -webkit-user-select: none; user-select: none; touch-action: pan-y; }
  .scene > svg.zoomed { cursor: grab; touch-action: none; }
  .scene > svg.dragging { cursor: grabbing; }
  .board-foot { min-height: 45px; padding: 8px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-top: 1px solid var(--line); }
  .measure { display: flex; align-items: center; gap: 10px; color: var(--muted); font: 12px var(--num); white-space: nowrap; }
  .size-tag { color: var(--teal-dark); background: var(--pale); padding: 4px 7px; font-weight: 700; border-radius: 5px; line-height: 1; }
  .status { color: var(--muted); font-size: 11px; text-align: right; }
  .detail-back { display: flex; align-items: center; gap: 5px; padding: 0; border: 0; background: none; color: var(--teal); font-size: 12px; }
  .detail-back:hover { text-decoration: underline; }
  .tray { align-self: start; overflow: auto; max-height: max(640px, calc(100dvh - 130px)); scrollbar-width: thin; scrollbar-color: #b7ccc5 transparent; }
  details + details { border-top: 1px solid var(--line); }
  summary { display: flex; align-items: center; gap: 9px; min-height: 47px; padding: 10px 16px; cursor: pointer; list-style: none; font-size: 13px; font-weight: 700; }
  summary::-webkit-details-marker { display: none; }
  summary:hover { background: #f5f9f7; }
  summary > svg { color: var(--teal); flex: none; }
  summary .chevron { margin-left: auto; color: var(--soft); transition: transform .15s ease; }
  details[open] summary .chevron { transform: rotate(180deg); }
  .panel { padding: 0 16px 14px; }
  .layout-group + .layout-group { margin-top: 11px; }
  .group-head { font-size: 11px; color: var(--muted); font-weight: 650; margin-bottom: 5px; }
  .layout-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .layout { display: grid; justify-items: center; gap: 3px; min-height: 72px; padding: 5px 2px 4px; background: #fafcfb; border: 1px solid var(--line); border-radius: 8px; line-height: 1.18; }
  .layout:hover { border-color: #9bbdb1; background: #f0f7f4; }
  .layout[aria-pressed="true"] { border-color: #5c9b88; color: var(--teal-dark); background: var(--pale); box-shadow: inset 0 0 0 1px #5c9b8824; }
  .layout svg { display: block; width: 49px; height: 32px; }
  .layout-name { font-size: 12px; font-weight: 670; }
  .layout-range { color: var(--muted); font: 10px var(--num); }
  .layout-grid.title-grid { grid-template-columns: repeat(2, 1fr); }
  .title-grid .layout { min-height: 56px; align-content: center; gap: 3px; }
  .title-grid .layout svg { width: 66px; height: 25px; }
  .sizes { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
  .size, .detail-choice { border: 1px solid var(--line); background: #fafcfb; border-radius: 7px; min-height: 33px; }
  .size { font: 700 13px var(--num); }
  .size:hover:not(:disabled), .detail-choice:hover { background: #f0f7f4; border-color: #9bbdb1; }
  .size[aria-pressed="true"], .detail-choice[aria-pressed="true"] { color: #fff; background: var(--teal); border-color: var(--teal); }
  .size:disabled { background: #f6f8f7; color: #879694; border-color: #e9eeec; text-decoration: line-through; }
  .segments { display: flex; background: #f0f5f3; border-radius: 7px; padding: 3px; gap: 3px; }
  .segments button { flex: 1; min-height: 29px; border: 1px solid transparent; border-radius: 5px; background: transparent; font-size: 11px; font-weight: 640; padding: 2px 6px; white-space: nowrap; }
  .segments button:hover { color: var(--teal-dark); }
  .segments button[aria-pressed="true"] { color: var(--teal-dark); background: white; border-color: #dae8e3; box-shadow: 0 1px 2px #1a403217; }
  .layers { margin-top: 8px; display: grid; grid-template-columns: 1fr 1fr; column-gap: 5px; row-gap: 2px; }
  .layer { display: flex; align-items: center; padding: 3px 6px; gap: 7px; min-height: 29px; color: var(--muted); background: transparent; border: 1px solid transparent; border-radius: 6px; text-align: left; font-size: 11.5px; }
  .layer:hover:not(:disabled) { background: #f0f7f4; }
  .layer[aria-pressed="true"] { background: var(--pale); border-color: #c9e5dc; color: var(--teal-dark); font-weight: 700; }
  .layer:disabled { opacity: .44; }
  .legend-icon { display: grid; place-items: center; width: 19px; height: 19px; border-radius: 4px; background: #eaf2ee; color: #3d7468; flex: none; }
  .detail-options { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .detail-choice { padding: 3px 5px; font-size: 11px; }
  .display-tools { display: grid; gap: 6px; margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--line); }
  .tools-label { font-size: 11px; color: var(--muted); }
  .aria-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .paper-bg { fill: white; filter: drop-shadow(0 7px 9px #1c433426) drop-shadow(0 1px 1px #1c433422); }
  .paper-edge { fill: none; stroke: #344d50; stroke-width: 1.05; }
  .frame-edge { fill: none; stroke: #1d373d; stroke-width: 1.75; }
  .title-fill { fill: #e3efeb; }
  .sign-fill { fill: #e3efeb; }
  .block-edge { fill: none; stroke: #29474a; stroke-width: 1.02; }
  .center-mark { stroke: #23444a; stroke-width: 1.2; }
  .dev-label { font-family: var(--ui); }
  .dim-line { stroke: #678084; stroke-width: .82; fill: none; }
  .dim-ext { stroke: #91a5a7; stroke-width: .7; fill: none; }
  .dim-tick { stroke: #48676c; stroke-width: 1.1; fill: none; }
  .dim-text, .dim-symbol { font: 600 12px var(--num); fill: #28454b; paint-order: stroke; stroke: #eef4f1; stroke-width: 4px; stroke-linejoin: round; }
  .dim-symbol { font-size: 11px; font-weight: 450; fill: #587176; }
  .leader { stroke: #508b7e; stroke-width: 1.04; fill: none; }
  .leader-dot { fill: #398374; stroke: white; stroke-width: 1; }
  .name-tag { fill: #f2faf6; stroke: #bddcd1; stroke-width: .8; }
  .name-text { fill: #1b5b50; font-size: 12px; font-weight: 650; }
  .callout.selected .name-tag { fill: var(--teal); stroke: var(--teal); }
  .callout.selected .name-text { fill: white; }
  .callout.selected .leader { stroke: #087361; stroke-width: 1.65; }
  .focus-shape { stroke: #078575; stroke-width: 2.2; fill: none; pointer-events: none; }
  .focus-area { fill: #8cd3bc; fill-opacity: .34; stroke: #078575; stroke-width: 1.2; pointer-events: none; }
  .target { cursor: pointer; outline: none; }
  .hit-area { fill: transparent; }
  .hit-line { fill: none; stroke: transparent; stroke-width: 15; }
  .target:focus-visible .hit-line { stroke: #4ca796; stroke-opacity: .65; stroke-width: 4; }
  .target:focus-visible .hit-area { stroke: #078575; stroke-width: 2; fill: #8cd3bc44; }
  .cell { fill: #fff; stroke: #476363; stroke-width: .9; }
  .cell.alt { fill: #eaf4ef; }
  .cell-table-line { stroke: #657d7e; stroke-width: .9; }
  .cell-name { fill: #245849; font-weight: 650; font-size: 13px; }
  .clause-note { color: var(--muted); margin-top: 8px; font-size: 11px; }
  .board:fullscreen { width: 100%; height: 100%; border: 0; border-radius: 0; }
  @media (max-width: 1030px) {
    .workspace { padding: 16px; grid-template-columns: minmax(0, 1fr) 296px; gap: 12px; }
    .board, .tray { max-height: none; }
    .board { height: max(620px, calc(100dvh - 118px)); }
    .mast-inner { padding: 0 18px; }
  }
  @media (max-width: 760px) {
    .masthead { height: 70px; }
    .mast-inner { gap: 10px; padding: 0 13px; }
    .brand { width: 36px; height: 36px; border-radius: 9px; }
    .brand svg { width: 21px; height: 21px; }
    h1 { font-size: 20px; }
    .source { font-size: 10px; margin-top: 2px; }
    .standard { padding: 5px 6px; font-size: 10px; }
    .workspace { padding: 10px; grid-template-columns: 1fr; gap: 10px; }
    .board { height: 530px; }
    .board-head { min-height: 60px; padding: 8px 10px; gap: 6px; }
    .board-head h2 { font-size: 15px; }
    .controls { gap: 4px; }
    .board-foot { min-height: 42px; padding: 6px 10px; }
    .status { font-size: 10px; }
    .tray { max-height: none; }
  }
  @media (max-width: 380px) {
    .standard { font-size: 9px; }
    .control.full { display: none !important; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="masthead">
  <div class="mast-inner">
    <span class="brand" id="brand" aria-hidden="true"></span>
    <div><h1>3.2 标题栏</h1><p class="source">房屋建筑制图统一标准</p></div>
    <span class="standard">GB/T 50001-2017</span>
  </div>
</header>
<main class="workspace">
  <section class="board" id="board" aria-label="图纸画面">
    <div class="board-head">
      <div><h2 id="figureName"></h2><p class="fig" id="figureRef"></p></div>
      <div class="controls">

          <button class="control" type="button" id="zoomOut" aria-label="缩小" title="缩小"></button>
          <button class="control fit" type="button" id="fit" aria-label="适合画面" title="适合画面">100%</button>
          <button class="control" type="button" id="zoomIn" aria-label="放大" title="放大"></button>
        </div>
        <button class="control full" type="button" id="full" aria-label="全屏" title="全屏"></button>
      </div>
    </div>
    <div class="scene" id="scene">
      <svg id="drawing" aria-label="图纸示意图" role="group"></svg>
    </div>
    <div class="board-foot">
      <div class="measure" id="measure"></div>
      <button class="detail-back" type="button" id="back" hidden>返回幅面</button>
      <p class="status" id="status" role="status">点击或长按图纸查看名称</p>
    </div>
  </section>
  <aside class="tray" aria-label="工具托盘">
    <details open>
      <summary data-icon="book">知识点</summary>
      <div class="panel" id="layouts"></div>
    </details>
    <details open id="presetPanel">
      <summary data-icon="ruler">幅面预设</summary>
      <div class="panel sizes" id="sizes" role="group" aria-label="选择幅面"></div>
    </details>
    <details open>
      <summary data-icon="layers">图层</summary>
      <div class="panel">
        <div class="segments" id="annotationModes" role="group" aria-label="名称标注">
          <button type="button" data-annotation="all">显示全部</button>
          <button type="button" data-annotation="one">显示单项</button>
          <button type="button" data-annotation="none">隐藏名称</button>
        </div>
        <div class="layers" id="layers"></div>
        <div class="display-tools">
          <div class="tools-label" id="dimensionLabel">尺寸标注</div>
          <div class="segments" id="dimensions" role="group" aria-labelledby="dimensionLabel">
            <button type="button" data-dimension="both">数值与符号</button>
            <button type="button" data-dimension="value">仅数值</button>
            <button type="button" data-dimension="none">隐藏尺寸</button>
          </div>
        </div>
      </div>
    </details>
    <details>
      <summary data-icon="detail">其他详图</summary>
      <div class="panel"><div class="detail-options" id="details"></div><p class="clause-note" id="clauseNote" hidden></p></div>
    </details>
  </aside>
</main>
<script>
"use strict";

const icons = {
  brand: '<path d="M3 4h18v16H3zM6.5 7h11v10h-11zM14 13h3.5M14 13v4M3 11.5h3.5M11.5 4v3"/>',
  book: '<path d="M12 5v15m0-14C9 4 6.5 4 3 5v13c3.5-1 6-1 9 1 3-2 5.5-2 9-1V5c-3.5-1-6-1-9 1Z"/>',
  ruler: '<path d="M3 8h18v8H3zM7 8v4m5-4v3m5-3v4"/>',
  layers: '<path d="m12 3 9 5-9 5-9-5 9-5ZM3 12l9 5 9-5M3 16l9 5 9-5"/>',
  detail: '<path d="M4 5h16v14H4zM4 12h16m-6-7v14M8 12v7"/>',
  chevron: '<path d="m6 9 6 6 6-6"/>',
  minus: '<path d="M6 12h12"/>',
  plus: '<path d="M12 6v12M6 12h12"/>',
  full: '<path d="M9 4H4v5m11-5h5v5M9 20H4v-5m16 0v5h-5"/>',
  unfull: '<path d="M4 9h5V4m11 5h-5V4M4 15h5v5m6 0v-5h5"/>',
  back: '<path d="m10 6-6 6 6 6m-6-6h16"/>',
  trim: '<path d="M5 18V6h14" opacity=".8"/>',
  frame: '<path d="M5 18V6h14" stroke-width="2.6"/>',
  binding: '<path d="M4 5h6v14H4zM15 19V5M4 10l6 5M4 14l6 5"/>',
  center: '<path d="M5 6h14m-7-3v7M7 17h10"/>',
  title: '<path d="M4 5h16v14H4zM13 12h7m-7 0v7m3-7v7"/>',
  sign: '<path d="M4 7h16v10H4zM8 7v10m4-10v10m4-10v10"/>',
};
function icon(name, cls = "") {
  return '<svg aria-hidden="true" class="' + cls + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">' + icons[name] + '</svg>';
}
const byId = (id) => document.getElementById(id);
byId("brand").innerHTML = icon("brand");
for (const [id, name] of [["zoomOut","minus"],["zoomIn","plus"],["full","full"]]) byId(id).innerHTML = icon(name);
byId("back").insertAdjacentHTML("afterbegin", icon("back"));
for (const summary of document.querySelectorAll("summary")) {
  summary.insertAdjacentHTML("afterbegin", icon(summary.dataset.icon));
  summary.insertAdjacentHTML("beforeend", icon("chevron", "chevron"));
}
const layouts = [
  { name: "横式幅面（一）", portrait: false, max: 3, title: "right" },
  { name: "横式幅面（二）", portrait: false, max: 3, title: "bottom" },
  { name: "横式幅面（三）", portrait: false, max: 1, title: "corner", sign: "left" },
  { name: "立式幅面（一）", portrait: true, max: 4, title: "bottom" },
  { name: "立式幅面（二）", portrait: true, max: 4, title: "right" },
  { name: "立式幅面（三）", portrait: true, max: 2, title: "corner", sign: "top" }
];
const sizes = [
  { short: 841, long: 1189, c: 10 },
  { short: 594, long: 841, c: 10 },
  { short: 420, long: 594, c: 10 },
  { short: 297, long: 420, c: 5 },
  { short: 210, long: 297, c: 5 }
];
const binding = 25;
const layers = {
  trim: "幅面线", frame: "图框线", binding: "装订边",
  center: "对中标志", title: "标题栏", sign: "会签栏",
  design: "设计单位名称区", seal: "注册师签章区", manager: "项目经理区",
  revision: "修改记录区", project: "工程名称区", number: "图号区",
  signature: "签字区", note: "附注栏", drawing: "图名区",
  specialty: "专业", realName: "实名", autograph: "签名", date: "日期"
};
const detailNames = ["标题栏（一）", "标题栏（二）", "标题栏（三）", "标题栏（四）", "会签栏"];
const fullSheetLayers = ["trim","frame","binding","center","title","sign"];
const regularCells = ["design","seal","manager","revision","project","number","signature","sign","note"];
const compactCells = ["design","project","drawing","signature","number"];
const signCells = ["specialty", "realName", "autograph", "date"];
const state = { layout: 0, preferred: 3, size: 3, mode: "all", layer: "title", picked: null, detail: null, dimensions: "both", zoom: 1, panX: 0, panY: 0 };

const layoutBox = byId("layouts");
function thumbnail(layout) {
  const { portrait, title, sign } = layout;
  const x = portrait ? 13 : 5, y = portrait ? 2 : 4, w = portrait ? 22 : 39, h = portrait ? 28 : 24;
  const ix = x + (portrait ? 2.4 : 4), iy = y + (portrait ? 4 : 2.1), ir = x + w - 2.2, ib = y + h - 2.2;
  const titleX = title === "right" ? ir - 5.2 : title === "corner" ? ir - (portrait ? 9 : 12) : ix;
  const titleY = title === "right" ? iy : ib - 4.1;
  let content = '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="1" fill="white" stroke="#8da8a2"/>';
  content += '<rect x="' + ix + '" y="' + iy + '" width="' + (ir-ix) + '" height="' + (ib-iy) + '" fill="none" stroke="#506f68"/>';
  content += '<rect x="' + titleX + '" y="' + titleY + '" width="' + (ir-titleX) + '" height="' + (ib-titleY) + '" fill="#9dcaba" stroke="#528c7e" stroke-width=".7"/>';
  if (sign === "left") content += '<rect x="' + (ix-2.3) + '" y="' + (iy+1) + '" width="2.3" height="6.7" fill="#9dcaba" stroke="#528c7e" stroke-width=".6"/>';
  if (sign === "top") content += '<rect x="' + (ir-6) + '" y="' + (iy-2.3) + '" width="6" height="2.3" fill="#9dcaba" stroke="#528c7e" stroke-width=".6"/>';
  return '<svg aria-hidden="true" viewBox="0 0 49 32">' + content + '</svg>';
}
for (const first of [0, 3]) {
  const title = first === 0 ? "横式幅面" : "立式幅面";
  const buttons = layouts.slice(first, first + 3).map((layout, i) =>
    '<button type="button" class="layout" data-layout="' + (first+i) + '" aria-label="' + layout.name + '，A0 至 A' + layout.max + '">' +

}
const titlePreviews = [
  { frame: '<rect x="3" y="4" width="60" height="17" rx=".6"/>', dividers: 'M17.4 4v17m16.8-17v17M17.4 9.3h16.8', shade: 'M3 4h14.4v17H3z' },
  { frame: '<rect x="8" y="4" width="50" height="17" rx=".6"/>', dividers: 'M8 9.1h50m-34 0v11.9m21.5-11.9v11.9M24 12.5h21.5', shade: 'M8 4h50v5.1H8z' }

  state.picked = null;
  chooseLayerIfAvailable();
  resetZoom();
  showLayers();
  update();
}
function chooseTarget(target) {
  const {key, target: id} = target.dataset;
  const keyboard = document.activeElement === target;
  state.picked = state.picked?.id === id ? null : { key, id };
  if (state.mode === "one") state.layer = key;
  update();
  if (keyboard) svg.querySelector('[data-target="'+id+'"]')?.focus({preventScroll:true});
}
layoutBox.addEventListener("click",event => {
  const button = event.target.closest("[data-layout], [data-detail]");
  if (button?.hasAttribute("data-layout")) activateSheet(+button.dataset.layout);
  else if (button) activateDetail(+button.dataset.detail);
});
byId("sizes").addEventListener("click",event => {
  const button = event.target.closest("[data-size]");
  if (!button || button.disabled) return;
  state.size = +button.dataset.size;
  state.preferred = state.size;
  state.picked = null;
  update();
});
byId("annotationModes").addEventListener("click",event => {
  const button = event.target.closest("[data-annotation]");
  if (!button) return;
  state.mode = button.dataset.annotation;
  state.picked = null;
  update();
});
byId("layers").addEventListener("click",event => {
  const button = event.target.closest("[data-layer]");
  if (!button || button.disabled) return;
  state.mode = "one";
  state.layer = button.dataset.layer;
  state.picked = null;
  update();
});
byId("details").addEventListener("click",event => {
  const button = event.target.closest("[data-detail]");
  if (button) activateDetail(+button.dataset.detail);
});
byId("dimensions").addEventListener("click",event => {
  const button = event.target.closest("[data-dimension]");
  if (!button) return;
  state.dimensions = button.dataset.dimension;
  update();
});
byId("back").addEventListener("click",() => activateSheet(state.layout));
byId("zoomOut").addEventListener("click",() => changeZoom(1/1.25));
byId("zoomIn").addEventListener("click",() => changeZoom(1.25));
byId("fit").addEventListener("click",() => { resetZoom(); applyTransform(); syncControls(); });
const full = byId("full");
full.hidden = !document.fullscreenEnabled;
full.addEventListener("click",async () => {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else await byId("board").requestFullscreen();
  } catch {
    byId("status").textContent = "当前浏览器无法进入全屏";
  }
});
document.addEventListener("fullscreenchange",() => {
  const label = document.fullscreenElement ? "退出全屏" : "全屏";
  full.innerHTML = icon(document.fullscreenElement ? "unfull" : "full");
  full.setAttribute("aria-label",label);
  full.title = label;
});

let press = null;
let timer = 0;
let suppressClick = false;
function clearPress() {
  clearTimeout(timer);
  press = null;
  svg.classList.remove("dragging");
}
svg.addEventListener("pointerdown",event => {
  if (!event.isPrimary || event.button !== 0) return;
  const target = event.target.closest("[data-target]");
  suppressClick = false;
  press = { x:event.clientX, y:event.clientY, startX:state.panX, startY:state.panY, active:event.pointerId, moved:false };
  if (target) timer = setTimeout(() => {
    if (!press || press.moved || !target.isConnected) return;
    suppressClick = true;
    chooseTarget(target);
  }, 440);
});
svg.addEventListener("pointermove",event => {
  if (!press || press.active !== event.pointerId) return;
  const dx = event.clientX-press.x, dy = event.clientY-press.y;
  if (!press.moved && Math.hypot(dx,dy) < 6) return;
  clearTimeout(timer);
  press.moved = true;
  suppressClick = true;
  if (state.zoom > 1) {
    if (!svg.hasPointerCapture(event.pointerId)) svg.setPointerCapture(event.pointerId);
    svg.classList.add("dragging");
    state.panX = press.startX+dx;
    state.panY = press.startY+dy;
    applyTransform();
  }
});
addEventListener("pointerup",clearPress);
addEventListener("pointercancel",clearPress);
svg.addEventListener("contextmenu",event => {
  if (event.target.closest("[data-target]") || suppressClick) event.preventDefault();
});
svg.addEventListener("click",event => {
  if (suppressClick) { suppressClick = false; return; }
  const target = event.target.closest("[data-target]");
  if (target) chooseTarget(target);
  else if (state.picked) { state.picked = null; update(); }
});
svg.addEventListener("keydown",event => {
  const target = event.target.closest("[data-target]");
  if (target && (event.key === "Enter" || event.key === " ")) {
    event.preventDefault();
    chooseTarget(target);
  }
  if (event.key === "Escape" && state.picked) {
    state.picked = null;
    update();
    if (target) svg.querySelector('[data-target="'+target.dataset.target+'"]')?.focus({preventScroll:true});
  }
});

activateSheet(0);
new ResizeObserver(render).observe(byId("scene"));
</script>
</body>
</html>
