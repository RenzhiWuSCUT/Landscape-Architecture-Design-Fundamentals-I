<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>图线识读练习</title>
<style>
:root {
  color-scheme: light;
  --bg: #edf0ec;
  --paper: #fff;
  --ink: #202b26;
  --muted: #5c6860;
  --border: #dce3dc;
  --light: #f4f7f3;
  --pine: #285143;
  --pine-deep: #1d3a30;
  --sage: #e7efe8;
  --accent: #a4442c;
  --c-line: #28352f;
  --radius: 16px;
  font-family: "Inter", "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); }
button, input { font: inherit; }
button { color: inherit; cursor: pointer; }
button:focus-visible, summary:focus-visible, input:focus-visible { outline: 2px solid #287d65; outline-offset: 3px; }
button:disabled { cursor: default; opacity: .38; }
[hidden] { display: none !important; }
.topbar { background: var(--pine-deep); color: #fff; }
.topinner { max-width: 1650px; margin: auto; padding: 15px 31px; display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 76px; }
.brand { display: flex; align-items: center; gap: 13px; }
.brand-mark { width: 42px; height: 42px; display: grid; place-items: center; border: 1px solid #ffffff46; border-radius: 11px; color: #dceadd; flex: none; }
.brand-mark svg { width: 24px; }
h1, h2, h3, p { margin: 0; }
h1 { font-size: clamp(21px, 2.1vw, 28px); line-height: 1.2; letter-spacing: .03em; }
.subtitle { margin-top: 5px; color: #c9d9ce; font-size: 11px; letter-spacing: .08em; }
.progress { color: #e2ede4; font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; padding: 8px 11px; border: 1px solid #ffffff36; border-radius: 7px; }
.workspace { max-width: 1650px; padding: 22px 30px 28px; margin: auto; display: grid; grid-template-columns: minmax(0, 1fr) clamp(302px, 26vw, 366px); align-items: start; gap: 18px; }
.workarea { min-width: 0; }
.sheet, .panel { background: var(--paper); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 8px 22px #19332307; }
.sheet { overflow: hidden; padding: 19px 21px 20px; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; }
.sheet-head h2 { font-size: clamp(21px, 2.35vw, 31px); font-weight: 720; line-height: 1.2; letter-spacing: .015em; }
.sheet-head .view-name { color: var(--muted); margin-top: 5px; font-size: 13px; }
.figure-status { padding: 6px 10px; background: #f6f1e9; color: #6c513b; font-size: 12px; border-radius: 6px; flex: none; }
.figure-status.selected { color: var(--pine-deep); background: var(--sage); }
.plot { margin: 0; position: relative; min-width: 0; }
.overview, .detail, .thumb, .modal-view { overflow: hidden; background: #fff; border: 1px solid var(--border); border-radius: 10px; }
.overview { background: #fafffc; }
.overview svg { width: 100%; height: clamp(240px, 38vh, 420px); display: block; }
.exercise { display: grid; grid-template-columns: minmax(180px, .78fr) minmax(275px, 1.22fr); align-items: start; gap: 18px; margin-top: 6px; }
.detail-head { position: relative; display: flex; gap: 8px; align-items: center; justify-content: space-between; margin: 0 0 8px; min-height: 29px; }
.detail-label { display: flex; gap: 7px; align-items: center; font-size: 13px; font-weight: 650; }
.detail-label b { background: #f6eae3; color: var(--accent); display: grid; place-items: center; width: 23px; height: 23px; border-radius: 5px; font-family: ui-monospace, monospace; font-size: 13px; }
.iconbtn { display: grid; place-items: center; width: 30px; height: 29px; background: white; border: 1px solid var(--border); border-radius: 7px; padding: 0; }
.iconbtn:hover { background: var(--light); }
.iconbtn svg { width: 15px; height: 15px; }
.detail { border-color: #d5a797; }
.detail svg { display: block; width: 100%; aspect-ratio: 1.74; max-height: 212px; }
.question { min-width: 0; padding-top: 8px; }
.question-head { display: flex; gap: 12px; align-items: start; justify-content: space-between; margin-bottom: 10px; }
.question h3 { font-size: 15px; font-weight: 700; line-height: 1.55; }
.choice-count { font-size: 11px; color: var(--muted); background: var(--light); padding: 4px 7px; border-radius: 5px; white-space: nowrap; }
.choices { display: grid; gap: 8px; grid-template-columns: repeat(var(--choices), minmax(0, 1fr)); }
.choice { min-width: 0; text-align: left; background: #fff; border: 1px solid var(--border); border-radius: 9px; padding: 5px; transition: border-color .12s, box-shadow .12s; }
.choice:hover { border-color: #83a092; }
.choice[aria-pressed="true"] { border-color: var(--pine); box-shadow: 0 0 0 1px var(--pine); }
.choice.is-answer { border-color: #54866c; background: #edf5ef; }
.choice.is-wrong { border-color: #a85944; box-shadow: 0 0 0 1px #a85944; background: #faf2ee; }
.thumb { border: 1px solid #e4e8e2; border-radius: 5px; }
.thumb svg { width: 100%; aspect-ratio: 1.49; max-height: 110px; display: block; }
.choice-tag { display: flex; align-items: center; gap: 5px; justify-content: space-between; padding: 4px 3px 1px; font-size: 11px; min-height: 24px; color: var(--muted); }
.choice-letter { color: var(--ink); font-family: ui-monospace, monospace; font-size: 13px; font-weight: 700; }
.is-answer .choice-tag { color: var(--pine); }
.sheet-foot { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sequence { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.tray { min-width: 0; display: grid; gap: 10px; }
.panel { overflow: clip; }
.panel summary { display: flex; gap: 8px; align-items: center; padding: 12px 14px; cursor: pointer; list-style: none; font-size: 14px; font-weight: 730; user-select: none; }
summary::-webkit-details-marker { display: none; }
summary:focus-visible { outline-offset: -4px; }
.summary-icon { width: 16px; height: 16px; color: var(--pine); flex: none; }
.summary-title { flex: 1; }
.chevron { width: 15px; height: 15px; color: var(--muted); transition: transform .15s; }
details[open] > summary > .chevron { transform: rotate(180deg); }
.panel-body { padding: 0 12px 12px; }
.topic-list, .variant-list { display: grid; gap: 4px; }
.topic, .variant { width: 100%; display: flex; gap: 9px; align-items: center; text-align: left; border: 1px solid transparent; padding: 7px 8px; background: #fff; border-radius: 7px; min-height: 34px; font-size: 13px; }
.topic:hover, .variant:hover { background: var(--light); }
.topic[aria-current="true"], .variant[aria-current="true"] { background: var(--sage); border-color: #d7e5da; color: var(--pine-deep); font-weight: 700; }
.topic-marker { min-width: 24px; text-align: center; color: var(--pine); font-family: ui-monospace, monospace; font-size: 12px; }
.topic-ref { margin-left: auto; white-space: nowrap; color: var(--muted); font-size: 11px; font-weight: 500; }
.variant { min-height: 32px; padding-block: 5px; }
.variant-title { flex: 1; }
.variant-num { font-variant-numeric: tabular-nums; font-size: 11px; color: var(--muted); min-width: 21px; text-align: center; }
.done-dot { width: 6px; height: 6px; margin: 0 5px; background: #58906c; border-radius: 50%; }
.btn { border: 1px solid var(--border); border-radius: 7px; background: #fff; padding: 7px 12px; font-size: 13px; line-height: 1.3; min-height: 33px; }
.btn:hover:not(:disabled) { background: var(--light); border-color: #abbcaf; }
.btn.primary { color: #fff; background: var(--pine); border-color: var(--pine); }
.btn.primary:hover { background: #346753; }
.sheet-foot .btn { min-width: 73px; }
.answer-button { width: 100%; }
.answer-live { margin-top: 10px; padding: 10px; border-radius: 8px; background: var(--light); font-size: 13px; line-height: 1.58; }
.answer-live strong { color: var(--pine-deep); }
.answer-live p { margin-top: 4px; }
.answer-rule { padding-top: 7px; margin-top: 7px !important; border-top: 1px solid #dfe7dd; color: var(--muted); font-size: 12px; }
.answer-live .btn { margin-top: 8px; }
.layer-list { display: grid; gap: 8px; padding: 0 6px 2px; font-size: 13px; }
.layer-list label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.layer-list input { accent-color: var(--pine); width: 16px; height: 16px; }
.tool-buttons { display: flex; flex-wrap: wrap; gap: 6px; }
dialog { border: 1px solid var(--border); background: var(--paper); color: var(--ink); border-radius: var(--radius); padding: 16px; width: min(760px, calc(100vw - 30px)); }
dialog::backdrop { background: #142e25a8; }
.modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 10px; }
.modal-head h2 { font-size: 17px; }
.modal-view svg { display: block; width: 100%; max-height: 70vh; aspect-ratio: 1.74; }
.diagram { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
.diagram .outline, .diagram .fine, .diagram .cut, .diagram .measure, .diagram .hidden-line, .diagram .centerline, .diagram .guide, .diagram .callout { fill: none; stroke-linecap: butt; stroke-linejoin: round; }
.diagram .outline { stroke: var(--c-line); stroke-width: 1.8; }
.diagram .cut { stroke: var(--c-line); stroke-width: 2.65; }
.diagram .fine { stroke: #67736b; stroke-width: .95; }
.diagram .measure { stroke: #65736b; stroke-width: .8; }
.diagram .hidden-line { stroke: #32443c; stroke-width: 1.35; }
.diagram .centerline { stroke: #354c41; stroke-width: 1.05; }
.diagram .guide { stroke: #738178; stroke-width: .8; }
.diagram .note { fill: #394b42; font-size: 11px; }
.diagram .target-note { fill: #263931; font-size: 10px; }
.diagram .dim-text { fill: #4c6255; font-size: 10px; font-family: ui-monospace, monospace; }
.diagram .slate { fill: #eff2ee; }
.diagram .wood { fill: #f7f3e9; }
.diagram .earth { fill: #f0f3eb; }
.diagram .water { fill: #eef5f4; }
.diagram .metal { fill: #e8eeec; }
.diagram .white { fill: #fff; }
.diagram .ground { stroke: #748b7d; stroke-width: 1.2; }
.diagram .callout { stroke: var(--accent); stroke-width: 1.4; vector-effect: non-scaling-stroke; }
.diagram .callout.tag { fill: #fcf2ee; }
.diagram .callout-text { fill: var(--accent); font-size: 12px; font-family: ui-monospace, monospace; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
.diagram .mid { text-anchor: middle; }
.diagram .end { text-anchor: end; }
@media (max-width: 1120px) {
  .topinner { padding-inline: 20px; }
  .workspace { padding-inline: 19px; gap: 13px; grid-template-columns: minmax(0, 1fr) 296px; }
  .sheet { padding-inline: 15px; }
  .exercise { gap: 12px; grid-template-columns: minmax(145px, .71fr) minmax(240px, 1.29fr); }
  .choices { gap: 6px; }
}
@media (max-width: 830px) {
  .workspace { grid-template-columns: 1fr; }
  .tray { grid-template-columns: 1fr 1fr; align-items: start; }
  .overview svg { height: clamp(215px, 38vw, 330px); }
}
@media (max-width: 505px) {
  .topinner { padding-inline: 12px; }
  .workspace { padding: 12px 9px 20px; }
  .sheet { padding-inline: 11px; }
  .exercise, .tray { grid-template-columns: 1fr; }
  .overview svg { height: auto; min-height: 140px; aspect-ratio: 2.3; }
  .detail svg { max-height: 158px; }
  .thumb svg { max-height: 92px; }
  .question { padding-top: 0; }
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topinner">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.35"><path d="M4 5h16v14H4zM3 12h3m2 0h3m2 0h3m2 0h3M12 3v18"/></svg>
      </span>
      <div><h1>图线识读练习</h1><p class="subtitle">大一上 Studio · 风景园林识图</p></div>
    </div>
    <p id="progress" class="progress" aria-live="polite"></p>
  </div>
</header>
<main class="workspace">
  <article class="workarea" aria-labelledby="sceneTitle">
    <div class="sheet">
      <header class="sheet-head">
        <div><h2 id="sceneTitle"></h2><p class="view-name" id="viewName"></p></div>
        <span class="figure-status" id="figureStatus" aria-live="polite"></span>
      </header>
      <figure class="plot" aria-label="构件全图及特写位置"><div class="overview" id="overview"></div></figure>
      <div class="exercise">
        <figure class="plot" aria-labelledby="detailCaption">
          <figcaption class="detail-head">
            <span class="detail-label" id="detailCaption"><b>Ⅰ</b> 局部放大</span>
            <button class="iconbtn" type="button" data-zoom id="detailZoom" aria-label="放大特写" title="放大特写"></button>
          </figcaption>
          <div class="detail" id="detailView"></div>
        </figure>
        <section class="question" aria-labelledby="questionText">
          <div class="question-head"><h3 id="questionText"></h3><span class="choice-count" id="choiceCount"></span></div>
          <div class="choices" id="choices" role="group" aria-label="选择一种画法"></div>
        </section>
      </div>
      <nav class="sheet-foot" aria-label="题目导航">
        <button class="btn" id="prev" type="button">‹ 上一题</button>
        <span class="sequence" id="sequence"></span>
        <button class="btn" id="next" type="button">下一题 ›</button>
      </nav>
    </div>
  </article>
  <aside class="tray" aria-label="教学托盘">
    <details class="panel" open>
      <summary data-icon="book"><span class="summary-title">知识点</span></summary>
      <div class="panel-body"><nav class="topic-list" id="topics" aria-label="选择知识点"></nav></div>
    </details>
    <details class="panel" open>
      <summary data-icon="list"><span class="summary-title">选题</span></summary>
      <div class="panel-body"><nav class="variant-list" id="variants" aria-label="选择本知识点的题目"></nav></div>
    </details>
    <details class="panel" open>
      <summary data-icon="answer"><span class="summary-title">答案与解析</span></summary>
      <div class="panel-body">
        <button class="btn primary answer-button" id="answerToggle" aria-controls="answerLive" aria-expanded="false" type="button">公布答案</button>
        <div class="answer-live" id="answerLive" aria-live="polite" hidden>
          <strong id="answerTitle"></strong><p id="answerExplanation"></p><p class="answer-rule" id="answerRule"></p>
          <button class="btn" id="compare" type="button" hidden>显示正确画法</button>
        </div>
      </div>
    </details>
    <details class="panel">
      <summary data-icon="layers"><span class="summary-title">图层</span></summary>
      <div class="panel-body layer-list" id="layers">
        <label><input type="checkbox" value="outline" checked> 构件轮廓</label>
        <label><input type="checkbox" value="material" checked> 材料纹理</label>
        <label><input type="checkbox" value="annotation" checked> 参考尺寸与标注</label>
        <label><input type="checkbox" value="callout" checked> 特写框与引线</label>
      </div>
    </details>
    <details class="panel">
      <summary data-icon="view"><span class="summary-title">视图工具</span></summary>
      <div class="panel-body tool-buttons">
        <button class="btn" type="button" data-zoom>放大特写</button>
        <button class="btn" id="layerReset" type="button">恢复图层</button>
        <button class="btn" id="fullscreen" type="button">全屏</button>
      </div>
    </details>
  </aside>
</main>
<dialog id="zoomDialog" aria-labelledby="zoomTitle">
  <div class="modal-head"><h2 id="zoomTitle">局部放大</h2><form method="dialog"><button class="btn" type="submit">关闭</button></form></div>
  <div class="modal-view" id="modalView"></div>
</dialog>
<script>
'use strict';
const line = (x1, y1, x2, y2, cls = 'fine') =>
  `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="${cls}"/>`;
const path = (d, cls = 'outline') => `<path d="${d}" class="${cls}"/>`;
const rect = (x, y, w, h, cls = 'outline') =>
  `<rect x="${x}" y="${y}" width="${w}" height="${h}" class="${cls}"/>`;
const circle = (x, y, r, cls = 'outline') => `<circle cx="${x}" cy="${y}" r="${r}" class="${cls}"/>`;
const label = (x, y, words, cls = 'note') =>
  `<text x="${x}" y="${y}" class="${cls}">${words}</text>`;
const translate = (x, y, svg) => `<g transform="translate(${x} ${y})">${svg}</g>`;
const hatchRect = (x, y, w, h, name) =>
  `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#@-${name})"/>`;
const hatchCircle = (x, y, r, name) =>
  `<circle cx="${x}" cy="${y}" r="${r}" fill="url(#@-${name})"/>`;
const ticks = (n, step, start, draw) => Array.from({length: n}, (_, i) => draw(start + i * step, i)).join('');

function dimH(x1, x2, y, from, value) {
  return path(`M${x1} ${from}V${y + 8} M${x2} ${from}V${y + 8} M${x1 - 6} ${y}H${x2 + 6} M${x1 - 3} ${y + 3}l6 -6 M${x2 - 3} ${y + 3}l6 -6`, 'measure')
    + label((x1 + x2) / 2, y - 5, value, 'dim-text mid');
}
function dimV(y1, y2, x, from, value) {
  const textY = (y1 + y2) / 2;
  return path(`M${from} ${y1}H${x - 8} M${from} ${y2}H${x - 8} M${x} ${y1 - 6}V${y2 + 6} M${x - 3} ${y1 + 3}l6 -6 M${x - 3} ${y2 + 3}l6 -6`, 'measure')
    + `<text x="${x - 6}" y="${textY}" transform="rotate(-90 ${x - 6} ${textY})" class="dim-text mid">${value}</text>`;
}
function note(words, x, y, toX, toY) {
  return label(x, y - 5, words) + path(`M${x} ${y}h28L${toX} ${toY}`, 'measure')
    + `<circle cx="${toX}" cy="${toY}" r="1.65" fill="#627268"/>`;
}

const dashPattern = [[-5, 5]];
const chainPattern = [[-10, 10], [15, 17]];
const doublePattern = [[-10, 10], [14, 16], [20, 22]];
function patterned(axis, start, end, pattern, period, phase, cls, offset = 0) {
  const marks = [];
  const first = Math.floor((start - phase) / period) - 1;
  const last = Math.ceil((end - phase) / period) + 1;
  for (let i = first; i <= last; i++) {
    for (const [lo, hi] of pattern) {
      const a = Math.max(start, i * period + phase + lo);
      const b = Math.min(end, i * period + phase + hi);
      if (b > a) marks.push(axis === 'h' ? line(a, offset, b, offset, cls) : line(offset, a, offset, b, cls));
    }
  }
  return marks.join('');
}
const dash = (axis, a, b, phase = 0) =>
  patterned(axis, a, b, dashPattern, 16, phase, 'hidden-line');
const seatEdge = phase => dash('v', 0, 77, phase) + dash('v', 77, 93, 8);
const seamDash = (a, b, phase = 0) => patterned('h', a, b, dashPattern, 15, phase, 'hidden-line');
const chain = (axis, a, b, phase = 0, offset = 0) =>
  patterned(axis, a, b, chainPattern, 32, phase, 'centerline', offset);
const doubleChain = (axis, a, b, phase = 0, offset = 0) =>
  patterned(axis, a, b, doublePattern, 34, phase, 'centerline', offset);

function ringAxis(axis, center) {
  const pattern = [[-11, 11], [14, 16]];
  const segment = (a, b, phase = 0) =>
    patterned(axis, a, b, pattern, 27, phase, 'centerline');
  if (center === 0) return segment(-107, 107);
  return segment(-107, -12) + segment(-12, 12, center) + segment(12, 107);
}
const linesAt = (lines, x, y) => translate(x, y, lines);

function railingPost(x, top, bottom) {
  return rect(x - 7, top, 14, bottom - top, 'slate outline')
    + rect(x - 12, bottom - 4, 24, 4, 'metal outline');
}
function decking(x, y, w, h, horizontal = true) {
  const marks = horizontal
    ? ticks(Math.floor((h - 1) / 14), 14, y + 14, dy => line(x, dy, x + w, dy))
    : ticks(Math.floor((w - 1) / 14), 14, x + 14, dx => line(dx, y, dx, y + h));
  return hatchRect(x, y, w, h, 'wood') + marks;
}
function staggeredPaving(x, y, w, h) {
  return hatchRect(x, y, w, h, 'paving');
}
function woodBeams(x, y, w, h) {
  return ticks(Math.floor(w / 36) + 1, 36, x, dx => rect(dx, y, 11, h, 'wood outline'));
}
function grateBars(x, y, w, h) {
  return ticks(Math.floor((w - 1) / 10), 10, x + 10, dx => line(dx, y, dx, y + h));
}
function levelMark(y, value, x = 0) {
  return path(`M${x} ${y}l-7 -8h14z M${x + 7} ${y - 8}h34`, 'outline')
    + label(x + 12, y - 11, value, 'target-note');
}

const topics = [
  {ref: 'a', title: '虚线交接', rule: '虚线与虚线或其他图线交接时，应由线段相接。'},
  {ref: 'b', title: '虚线延续实线', rule: '虚线为实线的延长线时，应在实线末端与首段虚线之间留空。'},
  {ref: 'c', title: '长画线交接', rule: '单点长画线、双点长画线彼此交接或与其他图线交接时，应在线段处相接。'},
  {ref: 'f', title: '小图形线型简化', rule: '较小图形中，单点长画线、双点长画线难以绘制时，可用实线代替。'},
  {ref: 'g', title: '图线避让标注', rule: '图线应避开文字、数字、符号。重叠不可避免时，断开相应图线以保证标注清晰。'}
];

// Each option is expressed in the same local coordinates as the detail box.
const cases = [
  {

function withGap(svg, mode, correct, misplaced) {
  if (mode === 'overlap') return svg;
  const [x, y, w, h] = mode === 'gap' ? correct : misplaced;
  return `<defs><mask id="@-gap" maskUnits="userSpaceOnUse" x="-500" y="-300" width="1000" height="600">
    <rect x="-500" y="-300" width="1000" height="600" fill="white"/>
    <rect x="${x}" y="${y}" width="${w}" height="${h}" fill="black"/>
  </mask></defs><g mask="url(#@-gap)">${svg}</g>`;
}

  return path('M-73 8h146 M-73 11l6 -6 M67 11l6 -6', 'measure')

function wallNumber(mode) {
  const hatch = hatchRect(-68, -46, 136, 117, 'section');

function pavingLabel(mode) {

    + levelMark(0, '+0.450');

const defs = `<defs>
  <pattern id="@-board" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r=".55" fill="#c5d4ca" opacity=".7"/>
  </pattern>
  <pattern id="@-stone" width="17" height="13" patternUnits="userSpaceOnUse">
    <path d="M2 4h1m8 5h1m2-7h1M4 12h1" fill="none" stroke="#aebcb1" stroke-width=".7"/>
  </pattern>
  <pattern id="@-wood" width="31" height="13" patternUnits="userSpaceOnUse">
    <path d="M3 3h18m4 6h5M0 9h12" fill="none" stroke="#d3c8ac" stroke-width=".6"/>
  </pattern>
  <pattern id="@-paving" width="32" height="22" patternUnits="userSpaceOnUse">
    <path d="M0 0h32M0 11h32M0 0v11m16 0v11" fill="none" stroke="#b4c0b6" stroke-width=".78"/>
  </pattern>
  <pattern id="@-masonry" width="33" height="19" patternUnits="userSpaceOnUse">
    <path d="M0 0h33M0 9.5h33M0 0v9.5m16.5 0v9.5" fill="none" stroke="#a6b1a9" stroke-width=".8"/>
  </pattern>
  <pattern id="@-concrete" width="14" height="12" patternUnits="userSpaceOnUse">
    <path d="M3 3l2 1-2 1zM9 8l2-1" fill="none" stroke="#9eada2" stroke-width=".65"/>
  </pattern>
  <pattern id="@-earth" width="13" height="11" patternUnits="userSpaceOnUse">
    <path d="M2 6h4m3-4h2m-3 8h3" fill="none" stroke="#a7b5a4" stroke-width=".7"/>
  </pattern>
  <pattern id="@-water" width="31" height="14" patternUnits="userSpaceOnUse">
    <path d="M3 9h10m7-5h7" fill="none" stroke="#bbd1cc" stroke-width=".75"/>
  </pattern>
  <pattern id="@-section" width="9" height="9" patternUnits="userSpaceOnUse">
    <path d="M-1 1l2-2M0 9L9 0m-1 10 2-2" fill="none" stroke="#4a584f" stroke-width=".8"/>
  </pattern>
</defs>`;

const byId = id => document.getElementById(id);
const letters = ['A', 'B', 'C'];
const counts = ['零', '一', '二', '三'];
const layerDefaults = {outline: true, material: true, annotation: true, callout: true};
const layers = {...layerDefaults};
const selections = new Map();
const drawings = cases.map(scene => ({
  outline: scene.outline(),
  material: scene.material(),
  annotation: scene.annotation()
}));
let current = 0;
let revealed = false;
let showingAnswer = false;

function detailBox(scene) {
  const [x, y] = scene.target;
  const [w, h] = scene.box;
  return [x - w / 2, y - h / 2, w, h];
}
function callout(scene) {
  const [x, y, w, h] = detailBox(scene);
  const upward = scene.target[1] < 128;
  const startY = upward ? y : y + h;
  const badgeY = startY + (upward ? -18 : 18);
  const startX = x + w;
  const badgeX = startX + 34;
  return rect(x, y, w, h, 'callout')
    + path(`M${startX} ${startY}l17 ${badgeY - startY}H${badgeX - 11}`, 'callout')
    + circle(badgeX, badgeY, 11, 'callout tag')
    + label(badgeX, badgeY, 'Ⅰ', 'callout-text');
}
function diagramMarkup(kind, option) {
  const scene = cases[current];
  const drawing = drawings[current];
  const full = kind === 'overview';
  const thumb = kind.startsWith('option');
  const viewBox = full ? [0, 0, 800, 290] : detailBox(scene);
  const idSuffix = `drawing-${kind}`;
  const head = full
    ? rect(0, 0, 800, 290, 'white') + hatchRect(0, 0, 800, 290, 'board')
      + label(18, 23, '构件全图', 'note') + (layers.annotation ? label(782, 23, 'mm', 'dim-text end') : '')
    : rect(...viewBox, 'white');
  const visibleTarget = scene.options[option] ?? scene.pending ?? '';
  const svg = defs + head
    + ((layers.outline || thumb) ? drawing.outline : '')
    + ((layers.material || thumb) ? drawing.material : '')
    + ((layers.annotation && !thumb) ? drawing.annotation : '')
    + translate(scene.target[0], scene.target[1], visibleTarget)
    + ((full && layers.callout) ? callout(scene) : '');
  const aria = thumb ? 'aria-hidden="true"' : `role="img" aria-label="${scene.title}${full ? '全图及局部位置' : '局部图'}"`;
  return `<svg class="diagram" viewBox="${viewBox.join(' ')}" ${aria}>${svg.replaceAll('@', idSuffix)}</svg>`;
}

function activeDrawing() {
  if (revealed && (showingAnswer || !selections.has(current))) return cases[current].answer;
  return selections.get(current);
}
function updateDrawings() {
  const option = activeDrawing();
  byId('overview').innerHTML = diagramMarkup('overview', option);
  byId('detailView').innerHTML = diagramMarkup('detail', option);
  if (byId('zoomDialog').open) byId('modalView').innerHTML = diagramMarkup('modal', option);
  const status = byId('figureStatus');
  status.textContent = option === undefined ? '待选画法'
    : revealed && (showingAnswer || !selections.has(current)) ? `正确画法 ${letters[option]}`
    : `画法 ${letters[option]}`;
  status.classList.toggle('selected', option !== undefined);
}
function renderTopics() {
  byId('topics').innerHTML = topics.map((topic, index) =>
    `<button type="button" class="topic" data-topic="${index}" aria-current="${index === cases[current].topic}">
      <span class="topic-marker">${String(index + 1).padStart(2, '0')}</span>
      <span>${topic.title}</span><span class="topic-ref">图 ${topic.ref}</span>
    </button>`).join('');
}
function renderVariants() {
  const related = cases.map((scene, index) => ({scene, index})).filter(item => item.scene.topic === cases[current].topic);
  byId('variants').innerHTML = related.map(({scene, index}, order) =>
    `<button type="button" class="variant" data-question="${index}" aria-current="${index === current}">
      <span class="variant-num">${String(order + 1).padStart(2, '0')}</span>
      <span class="variant-title">${scene.title}</span>
      ${selections.has(index) ? '<span class="done-dot" title="已作答" aria-label="已作答"></span>' : ''}
    </button>`).join('');
}
function renderChoices() {
  const scene = cases[current];
  byId('choices').style.setProperty('--choices', scene.options.length);
  byId('choices').innerHTML = scene.options.map((_, index) =>
    `<button type="button" class="choice" data-choice="${index}" aria-pressed="false" aria-label="画法 ${letters[index]}">
      <div class="thumb">${diagramMarkup('option' + index, index)}</div>
      <div class="choice-tag"><span class="choice-letter">${letters[index]}</span><span class="choice-state"></span></div>
    </button>`).join('');
}
function updateAnswers() {
  const scene = cases[current];
  const selected = selections.get(current);
  const toggle = byId('answerToggle');
  const live = byId('answerLive');
  toggle.textContent = revealed ? '隐藏答案' : '公布答案';
  toggle.setAttribute('aria-expanded', String(revealed));
  live.hidden = !revealed;
  if (revealed) {
    const feedback = selected === undefined ? '' : selected === scene.answer ? ' · 你选对了' : ` · 你选了 ${letters[selected]}`;
    byId('answerTitle').textContent = `正确答案 ${letters[scene.answer]}${feedback}`;
    byId('answerExplanation').textContent = scene.explanation;
    const topic = topics[scene.topic];
    byId('answerRule').textContent = `图 ${topic.ref} · ${topic.rule}`;
    byId('compare').hidden = selected === undefined || selected === scene.answer;
    byId('compare').textContent = showingAnswer ? '返回所选画法' : '显示正确画法';
  } else {
    byId('answerTitle').textContent = '';
    byId('answerExplanation').textContent = '';
    byId('answerRule').textContent = '';
    byId('compare').hidden = true;
  }
  byId('choices').querySelectorAll('.choice').forEach(button => {
    const index = Number(button.dataset.choice);
    const chosen = selected === index;
    const correct = revealed && scene.answer === index;
    const wrong = revealed && chosen && !correct;
    const state = correct ? '正确' : wrong ? '所选' : chosen ? '已选' : '';
    button.classList.toggle('is-answer', correct);
    button.classList.toggle('is-wrong', wrong);
    button.setAttribute('aria-pressed', String(chosen));
    button.setAttribute('aria-label', [`画法 ${letters[index]}`, state].filter(Boolean).join('，'));
    button.querySelector('.choice-state').textContent = state;
  });
}
function refreshProgress() {
  byId('progress').textContent = `已作答 ${selections.size} / ${cases.length}`;
}
function renderQuestion() {
  const scene = cases[current];
  byId('sceneTitle').textContent = scene.title;
  byId('viewName').textContent = scene.view;
  byId('questionText').textContent = scene.question;
  byId('choiceCount').textContent = `${counts[scene.options.length]}选一`;
  byId('sequence').textContent = `第 ${current + 1} / ${cases.length} 题`;
  byId('prev').disabled = current === 0;
  byId('next').disabled = current === cases.length - 1;
  renderTopics();
  renderVariants();
  renderChoices();
  updateAnswers();
  updateDrawings();
}
function goTo(index) {
  if (index < 0 || index >= cases.length || index === current) return;
  current = index;
  revealed = false;
  showingAnswer = false;
  renderQuestion();
}

byId('topics').addEventListener('click', event => {
  const button = event.target.closest('[data-topic]');
  if (!button) return;
  const topic = Number(button.dataset.topic);
  if (topic === cases[current].topic) return;
  goTo(cases.findIndex(scene => scene.topic === topic));
  byId('topics').querySelector('[aria-current="true"]').focus({preventScroll: true});
});
byId('variants').addEventListener('click', event => {
  const button = event.target.closest('[data-question]');
  if (!button) return;
  goTo(Number(button.dataset.question));
  byId('variants').querySelector('[aria-current="true"]').focus({preventScroll: true});
});
byId('choices').addEventListener('click', event => {
  const button = event.target.closest('[data-choice]');
  if (!button) return;
  selections.set(current, Number(button.dataset.choice));
  showingAnswer = false;
  refreshProgress();
  renderVariants();
  updateAnswers();
  updateDrawings();
});
byId('prev').addEventListener('click', () => goTo(current - 1));
byId('next').addEventListener('click', () => goTo(current + 1));
byId('answerToggle').addEventListener('click', () => {
  revealed = !revealed;
  showingAnswer = false;
  updateAnswers();
  updateDrawings();
});
byId('compare').addEventListener('click', () => {
  showingAnswer = !showingAnswer;
  updateAnswers();
  updateDrawings();
});
byId('layers').addEventListener('change', event => {
  layers[event.target.value] = event.target.checked;
  updateDrawings();
});
byId('layerReset').addEventListener('click', () => {
  Object.assign(layers, layerDefaults);
  byId('layers').querySelectorAll('input').forEach(input => { input.checked = layers[input.value]; });
  updateDrawings();
});
byId('detailZoom').innerHTML = icon('zoom');
document.querySelectorAll('[data-zoom]').forEach(button => button.addEventListener('click', () => {
  byId('modalView').innerHTML = diagramMarkup('modal', activeDrawing());
  byId('zoomDialog').showModal();
}));
byId('zoomDialog').addEventListener('close', () => { byId('modalView').innerHTML = ''; });
const fullscreen = byId('fullscreen');
fullscreen.hidden = !document.fullscreenEnabled;
fullscreen.addEventListener('click', async () => {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else await document.documentElement.requestFullscreen();
  } catch {
    fullscreen.hidden = true;
  }
});
document.addEventListener('fullscreenchange', () => {
  fullscreen.textContent = document.fullscreenElement ? '退出全屏' : '全屏';
});

refreshProgress();
renderQuestion();
</script>
</body>
</html>
