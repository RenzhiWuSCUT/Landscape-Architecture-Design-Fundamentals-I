<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="google" content="notranslate">
<meta name="theme-color" content="#eef2eb">
<title>定位轴线｜房屋建筑制图</title>
<style>
:root{color-scheme:light;--bg:#eef2eb;--white:#fff;--paper:#f8faf6;--ink:#182d25;--muted:#56685d;--green:#1d6249;--line:#d9e3d9;--soft:#eaf2e9;--warm:#a14520;--warm-bg:#faeee5;--axis:#497561;--structure:#263e34;--dim:#557064;font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;color:var(--ink);background:var(--bg);font-size:14px}
button,select,input{font:inherit}
button,summary{cursor:pointer;-webkit-tap-highlight-color:transparent}
button{color:inherit}
button:focus-visible,summary:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--green);outline-offset:2px}
a{color:var(--green);text-underline-offset:3px}
.wrap{width:min(1580px,100%);margin:auto;padding:29px clamp(13px,3vw,48px) 25px}
.mast{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:23px}
.eyebrow,.clause{font-weight:650;letter-spacing:.05em;color:var(--green);font-size:11px}
.eyebrow{display:flex;gap:10px;align-items:center;color:var(--muted);flex-wrap:wrap}
.eyebrow span+span{color:var(--green);padding-left:10px;border-left:1px solid #b6c8ba}
h1{font-size:clamp(34px,4vw,52px);line-height:1.13;letter-spacing:-.05em;margin:5px 0 0}
h2{margin:4px 0 0;font-size:clamp(20px,2.3vw,29px);line-height:1.2;letter-spacing:-.035em}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 298px;gap:16px;align-items:start}
.board,.panel{background:var(--white);border:1px solid var(--line);border-radius:15px}
.board{overflow:hidden;min-width:0}
.board-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:17px 18px 16px}
.seg{display:flex;flex-wrap:wrap;gap:3px;padding:3px;background:#f0f4ee;border-radius:8px}
.seg button,.plain,.icon-btn{min-height:31px;border:1px solid transparent;border-radius:6px;background:transparent;padding:4px 10px;font-size:12px;white-space:nowrap}
.seg button:hover,.plain:hover,.icon-btn:hover{background:var(--soft)}
.seg button[aria-pressed="true"]{background:#fff;border-color:#cfdcd0;font-weight:680;color:var(--green)}
.plain,.icon-btn{background:#fff;border-color:var(--line)}
.icon-btn{display:grid;place-items:center;width:36px;height:36px;padding:0}
.icon{height:16px;width:16px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;flex:none}
.stage{display:grid;grid-template-columns:minmax(0,1.76fr) minmax(235px,1fr);gap:9px;padding:10px;background:var(--paper);background-image:radial-gradient(#d9e5db .8px,transparent .8px);background-size:15px 15px;border-block:1px solid var(--line)}
.stage[data-view="plan"]{grid-template-columns:minmax(0,1fr)}
.frame{min-width:0;border:1px solid #dce6dc;border-radius:9px;background:#fff;overflow:hidden;display:flex;flex-direction:column}
.frame-head{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:11px 12px 9px;min-height:40px;color:var(--muted);font-weight:620;font-size:11px}
.frame-head strong{font-size:13px;color:var(--ink)}
.diagram{min-height:360px;display:grid;place-items:center;flex:1;touch-action:manipulation;padding:1px 4px}
.diagram svg,.model svg{display:block;width:100%;height:auto;max-height:520px;user-select:none;-webkit-user-select:none}
.stage[data-view="plan"] .diagram svg{max-height:535px}
.stage[data-lesson="bent"] .line-axis{stroke-width:1.7;stroke-dasharray:27 7 2.6 7}
.stage[data-lesson="bent"] .bubble{stroke-width:1.5}
.stage[data-lesson="bent"] .bnum{font-size:25px;transform:translateY(3px)}
.stage[data-lesson="bent"] .hit:hover .line-axis,.stage[data-lesson="bent"] .is-active .line-axis{stroke-width:2.8}
@media(max-width:690px){.stage[data-lesson="detail"] .diagram svg{max-height:none}}
.pick-strip{border-top:1px solid #ebf0eb;display:flex;align-items:center;gap:8px;min-height:52px;padding:8px 12px}
.pick-key{color:var(--warm);font-weight:750;min-width:49px;white-space:nowrap}
.pick-hint{font-size:12px;color:var(--muted);line-height:1.55}
.photo-frame{background:#f7f9f5}
.photo-shell{position:relative;min-width:0;background:#dde7df}
.photo-shell img{display:block;width:100%;height:auto;max-height:302px;min-height:180px;object-fit:cover;object-position:center}
.photo-shell[data-photo="survey"] img{aspect-ratio:1.2;object-position:50% 69%}
.photo-shell[data-photo="frame"] img,.photo-shell[data-photo="columns"] img{aspect-ratio:1.16}
.scene-nav{display:flex;flex-wrap:wrap;gap:5px;padding:9px 10px}
.scene-nav button{border:1px solid #dce7de;border-radius:5px;background:#fff;color:var(--muted);font-size:11px;padding:5px 7px}
.scene-nav button:hover{border-color:#8eaf99}
.scene-nav button[aria-pressed="true"]{background:var(--soft);color:var(--green);border-color:#bcd1c1;font-weight:700}
.photo-caption{padding:4px 11px 10px;font-size:12px;color:var(--muted);line-height:1.58}
.photo-caption strong{display:block;margin-bottom:3px;color:var(--ink);font-weight:680}
.photo-credit{border-top:1px solid var(--line);margin-top:auto;padding:7px 11px;font-size:10px;color:var(--muted)}
.photo-credit summary{width:max-content}
.photo-credit div{margin-top:5px;line-height:1.7}
.model{padding:5px;flex:1;display:grid;place-items:center;min-height:280px;background:linear-gradient(#fbfcf9,#f1f6ef)}
.board-notes{display:flex;justify-content:space-between;gap:14px;padding:12px 17px;color:var(--muted);font-size:12px;align-items:center}
.board-notes p{margin:0;line-height:1.65}
.pagers{display:flex;flex:none;gap:4px}
.pagers button{padding-inline:9px}.pagers button:disabled{opacity:.45;cursor:default}
.tray{display:grid;gap:9px}
.panel{overflow:hidden;min-width:0}
.panel>summary{display:flex;align-items:center;gap:8px;list-style:none;font-weight:720;padding:11px 12px;min-height:43px}
.panel>summary::-webkit-details-marker{display:none}
.panel>summary:focus-visible{outline-offset:-3px}
.panel>summary>.icon{color:var(--green)}
.chevron{margin-left:auto;height:13px;width:13px}
.panel[open]>summary>.chevron{transform:rotate(180deg)}
.tray-body{padding:0 11px 11px}
.topic-group+.topic-group{margin-top:9px;padding-top:8px;border-top:1px solid #e8eee8}
.topic-group h3{margin:0 0 5px;font-size:11px;color:var(--muted);font-weight:670}
.topic-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.topic{display:flex;align-items:center;justify-content:space-between;gap:2px;min-height:33px;text-align:left;border:1px solid #e3ebe2;border-radius:6px;background:#f7f9f6;padding:5px 7px;font-size:11.5px}
.topic:hover{background:var(--soft);border-color:#bdcfc2}
.topic[aria-current="true"]{color:#fff;background:var(--green);border-color:var(--green);font-weight:680}
.topic[aria-current="true"]::after{content:"";width:5px;height:5px;background:#dcebdc;border-radius:50%;flex:none}
.rules{list-style:none;margin:0;padding:2px 0 0;color:var(--muted);font-size:12px;line-height:1.63}
.rules li{display:grid;grid-template-columns:5px 1fr;gap:7px;padding:3px 0}
.rules li::before{content:"";width:4px;height:4px;border-radius:50%;background:#539071;margin-top:8px}
.layer-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 9px;font-size:12px;padding:3px 1px 8px}
.layer-grid label{display:flex;align-items:center;gap:5px;cursor:pointer}
input{accent-color:var(--green)}
.layer-label{font-size:11px;color:var(--muted);margin:3px 0 6px}
#axis-target{width:100%;border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 7px;font-size:12px;margin-top:6px;color:var(--ink)}
.tools{display:flex;gap:5px;flex-wrap:wrap}
#variants{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid #edf1ed;padding:0 10px 7px}
#variants button{min-height:27px;font-size:11px}
.hide-structure [data-layer="structure"],.hide-axis [data-layer="axis"],.hide-dim [data-layer="dim"],.hide-labels [data-layer="labels"],.one-label [data-layer="labels"]:not(.is-target){display:none}
svg .line-axis{fill:none;stroke:var(--axis);stroke-width:1;stroke-dasharray:15 4 1.6 4;stroke-linecap:round}
svg .neck{fill:none;stroke:var(--axis);stroke-width:1}
svg .line-dim{fill:none;stroke:var(--dim);stroke-width:1.15;stroke-linecap:round}
svg .tick{stroke-width:1.6}
svg .line-structure{fill:none;stroke:var(--structure);stroke-width:1.8;stroke-linejoin:round}
svg .thin{stroke-width:1}
svg .slab{fill:#f0f4ed}
svg .room{fill:#e5eee5}
svg .column{fill:#8caa99;stroke:var(--structure);stroke-width:1.5}
svg .wall{fill:#cfdbd0;stroke:var(--structure);stroke-width:1.1}
svg .bubble{fill:#fff;stroke:var(--axis);stroke-width:1}
svg text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;text-anchor:middle;pointer-events:none}
svg .bnum{fill:#1c4e3a;font-size:14px;font-weight:720}
svg .bsmall{font-size:10px}
svg .dim-text{fill:var(--dim);font:650 14px system-ui,sans-serif;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
svg .scene-text{fill:#5e7065;font-size:15px;font-weight:570;paint-order:stroke;stroke:#fff;stroke-width:2.5px}
svg .small{font-size:11px}
svg .mark{fill:#a84c25}
svg .halo{fill:#f9ece2;stroke:#ad532e;stroke-width:1.3}
svg .aux{stroke:#af633e}
svg .faint{opacity:.62}
svg .hit{cursor:pointer;outline:none}
svg .hit-helper{fill:none;stroke:transparent;stroke-width:17}
svg .hot{fill:#fff;fill-opacity:0;stroke:none}
svg .column-center{stroke:#456657;stroke-width:.8}
svg .lesson-title{fill:var(--ink);font-size:21px;font-weight:720}
svg .lesson-subtitle{fill:var(--muted);font-size:13px;font-weight:620}
svg .lesson-band{fill:#f4f7f1;stroke:#e0e8de;stroke-width:1}
svg .lesson-divider{fill:none;stroke:#d3ded4;stroke-width:1}
svg .applicable{fill:#f5decb;stroke:#aa512d;stroke-width:1}
svg .section-mark{fill:none;stroke:#9b4623;stroke-width:2.7;stroke-linecap:round}
svg .detail-number{fill:#973e20;font-size:12px;font-weight:760}
svg .index-circle{fill:#fffaf5;stroke:#9b4623;stroke-width:1.25}
svg .detail-name-circle{fill:#fff;stroke:#445c4d;stroke-width:2.3}
svg .detail-concrete{fill:#d8e5d9;stroke:#263e34;stroke-width:1.5}
svg .detail-floor{fill:#e8eee5;stroke:#3f5c4b;stroke-width:1.15}
svg .detail-ground{fill:#f2efe8;stroke:#677669;stroke-width:.9}
svg .detail-range-text{fill:var(--green);font-size:14px;font-weight:700}
svg .is-active .index-circle,svg .hit:focus-visible .index-circle{fill:#f2d4bd;stroke-width:2}
svg .is-active .column-center{stroke:#70341e}
svg .hit:hover .line-axis,svg .is-active .line-axis,svg .hit:focus-visible .line-axis,svg .is-active .neck{stroke:#a54b24;stroke-width:2}
svg .hit:hover .bubble,svg .is-active .bubble,svg .hit:focus-visible .bubble{fill:#f9eee4;stroke:#a54b24;stroke-width:1.5}
svg .hit:hover .column,svg .is-active .column,svg .hit:focus-visible .column,svg .is-active .wall{fill:#ce7c51;stroke:#812e15}
svg .hit:focus-visible .line-structure,svg .is-active .line-structure{stroke:#a54b24}
svg .model-top{fill:#b9cdbd;stroke:#577b68;stroke-width:1}
svg .model-front{fill:#819f91;stroke:#476858;stroke-width:1}
svg .model-side{fill:#a2b9ab;stroke:#476858;stroke-width:1}
svg .is-active .model-top{fill:#f2bb96;stroke:#8b421f}
svg .is-active .model-front{fill:#c3774e;stroke:#8b421f}
svg .is-active .model-side{fill:#dea582;stroke:#8b421f}
body.mono{--axis:#3f4841;--dim:#383f3a;--structure:#222}
body.mono .stage{background-image:none}
body.mono svg .slab,body.mono svg .wall,body.mono svg .column,body.mono svg .room{fill:#e8eae7}
@media(max-width:1170px){.layout{grid-template-columns:minmax(0,1fr) 265px;gap:12px}.stage{grid-template-columns:minmax(0,1.7fr) minmax(190px,1fr)}.diagram{min-height:290px}.topic{font-size:11px}}
@media(max-width:910px){.stage{grid-template-columns:minmax(0,1fr)}.diagram{min-height:235px}.photo-shell img{min-height:0;max-height:270px}.board-head{align-items:flex-start;flex-direction:column}.board-notes{flex-wrap:wrap}.model{min-height:180px}}
@media(max-width:690px){.wrap{padding-top:15px}.layout{grid-template-columns:minmax(0,1fr)}.mast{margin-bottom:15px}.stage{padding:7px}.board-head,.board-notes{padding-inline:11px}.pick-strip{min-height:42px}.tray{gap:7px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div>
      <div class="eyebrow"><span>房屋建筑制图统一标准</span><span>GB/T 50001–2017 · 第 8 章</span></div>
      <h1>定位轴线</h1>
    </div>
    <button class="icon-btn" id="full" title="全屏" aria-label="全屏"></button>
  </header>
  <main class="layout">
    <section class="board" aria-labelledby="title">
      <div class="board-head">
        <div><div class="clause" id="clause"></div><h2 id="title"></h2></div>
        <div class="seg" id="views" role="group" aria-label="画面">
          <button data-view="photo">实景对照</button>
          <button data-view="model">构件对照</button>
          <button data-view="plan">只看图纸</button>
        </div>
      </div>
      <div class="stage" id="stage">
        <section class="frame">
          <div class="frame-head"><strong id="plan-name">教学平面图</strong><span id="drawing-unit"></span></div>
          <div class="seg" id="variants" role="group" aria-label="图纸示例" hidden></div>
          <div class="diagram" id="diagram"></div>
          <div class="pick-strip"><span class="pick-key" id="pick-key"></span><span class="pick-hint" id="pick-hint" aria-live="polite"></span></div>
        </section>
        <section class="frame photo-frame" id="photo-panel">
          <div class="frame-head"><strong>现场实拍</strong><span>施工参照</span></div>
          <div class="photo-shell" id="photo-shell"><img id="site-photo" decoding="async" alt=""></div>
          <div class="scene-nav" id="scene-nav" role="group" aria-label="选择现场照片"></div>
          <div class="photo-caption"><strong id="scene-name"></strong><span id="scene-text"></span></div>
          <details class="photo-credit"><summary>照片来源</summary><div id="scene-credit"></div></details>
        </section>
        <section class="frame" id="model-panel" hidden>
          <div class="frame-head"><strong>同一轴网的构件模型</strong><span>几何示意</span></div>
          <div class="model" id="model"></div>
          <div class="pick-strip"><span class="pick-hint">点选任一柱，平面图同步定位。</span></div>
        </section>
      </div>
      <div class="board-notes">
        <p id="footer-note"></p>
        <div class="pagers">
          <button class="plain" id="prev">‹ 上一项</button>
          <button class="plain" id="next">下一项 ›</button>
        </div>
      </div>
    </section>
    <aside class="tray" aria-label="教学托盘">
      <details class="panel" open>
        <summary data-icon="book">知识点</summary>
        <div class="tray-body" id="topics"></div>
      </details>
      <details class="panel" open>
        <summary data-icon="read">读图要点</summary>
        <div class="tray-body"><ul class="rules" id="rules"></ul></div>
      </details>
      <details class="panel" open>
        <summary data-icon="layers">图层</summary>
        <div class="tray-body">
          <div class="layer-grid" id="layers">
            <label><input type="checkbox" data-layer-toggle="structure" checked>构件轮廓</label>
            <label><input type="checkbox" data-layer-toggle="axis" checked>定位轴线</label>
            <label><input type="checkbox" data-layer-toggle="dim" checked>定位尺寸</label>
          </div>
          <div class="layer-label" id="label-name">轴号</div>
          <div class="seg" id="labels" role="group" aria-labelledby="label-name">
            <button data-mode="all">全部</button><button data-mode="one">指定轴线</button><button data-mode="none">隐藏</button>
          </div>
          <select id="axis-target" aria-label="指定轴线" hidden></select>
        </div>
      </details>
      <details class="panel">
        <summary data-icon="screen">显示工具</summary>
        <div class="tray-body tools">
          <button class="plain" id="monochrome" aria-pressed="false">黑白图线</button>
          <button class="plain" id="reset">恢复默认</button>
        </div>
      </details>
    </aside>
  </main>
</div>
<script>
"use strict";

   foot:"点数字看径向轴，点 A 或 B 看环向轴。两类轴的交点可以定位柱。"},
  {id:"bent",group:"特殊轴网",short:"折线形平面",title:"建筑转了个角，轴线怎么接？",clause:"8.0.10",photo:"frame",view:"plan",focus:"B",options:bentOptions,
   draw:bentDrawing,rules:["图中 1～4 轴在左翼，5、6 轴穿过斜向转折段，7、8 轴在右翼，分别沿各自轴线向外引出编号。","A、B、C 三根轴线在转折段折转，继续延伸至另一翼。","点选 B 轴，可从左往右沿折线追踪，经过 5、6 轴后继续向上。"],
   foot:"依据 GB/T 50001–2017 图 8.0.10 重绘。该图为折线形平面的编号示例。"}
];

const byId=id=>document.getElementById(id);
const stage=byId("stage"), diagram=byId("diagram"), model=byId("model"), variants=byId("variants");
const viewMenu=byId("views"), labelMenu=byId("labels"), layerMenu=byId("layers"), axisTarget=byId("axis-target");
const state={index:0,variant:0,view:"photo",photo:"frame",pick:"2/B",label:"all",axis:"2"};
const compactDiagram=matchMedia("(max-width: 690px)");
let pendingPress=null;
let pressTimeout;
let longPressTarget=null;
const current=()=>topics[state.index];
const axisOptions=()=>{
  const options=current().options;
  return typeof options==="function"?options(state.variant):options;
};
const allPress=(container,attr,value)=>container.querySelectorAll(`button[data-${attr}]`).forEach(b=>b.setAttribute("aria-pressed",String(b.dataset[attr]===String(value))));

function renderMenu() {
  const html=[...new Set(topics.map(t=>t.group))].map(group=>
    `<section class="topic-group"><h3>${group}</h3><div class="topic-grid">${topics.map((t,i)=>t.group===group?
    `<button class="topic" data-index="${i}">${t.short}</button>`:"").join("")}</div></section>`).join("");
  byId("topics").innerHTML=html;
  byId("scene-nav").innerHTML=Object.entries(images).map(([key,i])=>
    `<button data-photo="${key}">${i.name}</button>`).join("");
}
function renderPhoto() {
  const i=images[state.photo];
  const photo=byId("site-photo");
  if (photo.dataset.photo!==state.photo) {
    photo.dataset.photo=state.photo;
    photo.src=i.data;
  }
  photo.alt=i.name+"现场照片";
  byId("photo-shell").dataset.photo=state.photo;
  byId("scene-name").textContent=i.name;
  byId("scene-text").textContent=i.caption;
  byId("scene-credit").innerHTML=`<a href="${i.url}" target="_blank" rel="noopener noreferrer">${i.author} / Wikimedia Commons</a> · <a href="${i.licenseUrl}" target="_blank" rel="noopener noreferrer">${i.license}</a><br>照片缩放后按画框裁切显示，左图为独立的教学示例。`;
  allPress(byId("scene-nav"),"photo",state.photo);
}
function updateVisibility() {
  const detail=current().id==="detail";
  const view=detail?"plan":state.view;
  stage.dataset.view=view;
  stage.dataset.lesson=current().id;
  byId("photo-panel").hidden=view!=="photo";
  byId("model-panel").hidden=view!=="model";
  viewMenu.hidden=detail;
  viewMenu.querySelector('[data-view="model"]').hidden=!current().model;
  allPress(viewMenu,"view",view);
  if (view==="photo") renderPhoto();
  layerMenu.querySelectorAll("input").forEach(input=>
    stage.classList.toggle("hide-"+input.dataset.layerToggle,!input.checked));
  stage.classList.toggle("hide-labels",state.label==="none");
  stage.classList.toggle("one-label",state.label==="one");
  axisTarget.hidden=state.label!=="one";
  allPress(labelMenu,"mode",state.label);
  axisTarget.value=state.axis;
}
function describe(key) {
  if (!key) return ["","点选图中的轴线、轴号或构件，查看它的位置。"];
  if (current().id==="detail" && /^[1-5]$/.test(key)) {
    const matches=detailCases[state.variant].positions.includes(Number(key));
    const linked=detailCases[state.variant].indices.includes(Number(key));
    return [`${key}/A 柱脚`,linked
      ? "平面图在这个柱脚标出索引 12，对应右侧柱脚详图。"
      : matches
        ? "这个柱脚也在详图 12 的 1～5 轴适用范围内。"
        : detailCases[state.variant].summary];
  }
  if (key==="wall") return ["偏轴墙","墙中心距 3 轴 150 mm，墙厚 200 mm。"];
  const columnKey=gridColumns.find(([id])=>id===key);
  if (columnKey) {
    const [number,letter]=key.split("/");
    return [columnKey[1],`${number} 轴与 ${letter} 轴的交点。`];
  }
  const special={
    after2:["1/2","2 号主轴线之后的第 1 根附加轴线。"],
    pre1:["1/01","1 号主轴线之前的第 1 根附加轴线。"],
    preA:["1/0A","A 主轴线之前的第 1 根附加轴线。"],
    join:[axisOptions().find(([id])=>id==="join")?.[1],"同一根共用轴线，同时注明两侧编号。"],
    "detail-range":["1～5 轴","连续适用，包含 1 至 5 的每根轴线。"],
    "detail-common":["通用详图","端部画轴号圆，圆内留空。"],
    ringA:["A 环向轴","外圈。环向编号从外向内。"],
    ringB:["B 环向轴","内圈。环向编号从外向内。"],
    "radial-center":["圆心 P","同心环向轴以 P 为圆心，径向轴沿半径方向布置。"]
  };
  if (special[key]) return special[key];
  if (/^r\d+$/.test(key)) return [key.slice(1)+" 径向轴","径向轴按角度定位，数字宜按逆时针方向编写。"];
  const axis=axisOptions().find(([id])=>id===key);
  return [axis?.[1]||"",current().id==="bent" && /^[ABC]$/.test(key)?
    "沿折点连续追踪，可以找到另一翼上对应的轴线。":"点选后整根轴线高亮，端部圆内是轴号。"];
}
function updatePick() {
  const pair=gridColumns.some(([key])=>key===state.pick) ? state.pick.split("/") : [];
  for(const element of stage.querySelectorAll("[data-key]")) {
    const key=element.dataset.key;
    const selectedDetailRange=current().id==="detail" && state.variant===1 && /^[1-5]$/.test(state.pick||"") && key==="detail-range";
    element.classList.toggle("is-active",key===state.pick||pair.includes(key)||selectedDetailRange);
  }
  for(const element of stage.querySelectorAll('[data-layer="labels"][data-axis]')) {
    element.classList.toggle("is-target",element.dataset.axis===state.axis);
  }
  const [key,note]=describe(state.pick);
  byId("pick-key").textContent=key;
  byId("pick-key").hidden=!key;
  byId("pick-hint").textContent=note;
}
function renderDrawing() {
  const t=current();
  diagram.innerHTML=t.draw(state.variant,compactDiagram.matches);
  model.innerHTML=t.model?modelGraphic():"";
  const options=axisOptions();
  if(!options.some(([key])=>key===state.axis)) state.axis=options[0][0];
  axisTarget.replaceChildren(...options.map(([key,label])=>new Option(label,key)));
  updateVisibility();
  updatePick();
}
function renderTopic() {
  const t=current();
  byId("title").textContent=t.title;
  byId("clause").textContent=t.clause;
  byId("plan-name").textContent=t.id==="offset"?"柱墙定位详图":t.id==="detail"?"同一图纸中的两种图样":"教学平面图";
  byId("drawing-unit").textContent=t.unit||(t.id==="detail"?"构造示意":"轴网示意");
  byId("rules").replaceChildren(...t.rules.map(rule=>Object.assign(document.createElement("li"),{textContent:rule})));
  byId("footer-note").textContent=t.foot;
  document.querySelectorAll(".topic").forEach((button,i)=>{
    if(i===state.index) button.setAttribute("aria-current","true");
    else button.removeAttribute("aria-current");
  });
  variants.hidden=!t.variants;
  variants.innerHTML=(t.variants||[]).map((name,i)=>`<button data-choice="${i}">${name}</button>`).join("");
  allPress(variants,"choice",state.variant);
  byId("prev").disabled=state.index===0;
  byId("next").disabled=state.index===topics.length-1;
  renderDrawing();
}
function navigate(i,scroll=false) {
  if(!topics[i])return;
  state.index=i;
  state.variant=0;
  state.photo=current().photo;
  state.pick=current().focus;
  if(current().view)state.view=current().view;
  else if(!current().model&&state.view==="model")state.view="photo";
  state.axis=axisOptions().find(([id])=>id===state.pick)?.[0]||axisOptions()[0][0];
  renderTopic();
  if(scroll&&compactDiagram.matches)byId("title").scrollIntoView({block:"start"});
}
function pick(key) {
  state.pick=key;
  if(state.label==="one"&&axisOptions().some(([id])=>key===id)) {
    state.axis=key;
    axisTarget.value=key;
  }
  updatePick();
}
function handleButtons(root,attr,handler) {
  root.addEventListener("click",e=>{
    const b=e.target.closest(`button[data-${attr}]`);
    if(b)handler(b.dataset[attr]);
  });
}
document.querySelectorAll("summary[data-icon]").forEach(el=>{
  el.insertAdjacentHTML("afterbegin",icon(el.dataset.icon));
  el.insertAdjacentHTML("beforeend",icon("chevron"));
});
handleButtons(byId("topics"),"index",i=>navigate(Number(i),true));
handleButtons(viewMenu,"view",view=>{state.view=view;updateVisibility();});
handleButtons(byId("scene-nav"),"photo",photo=>{state.photo=photo;renderPhoto();});
handleButtons(labelMenu,"mode",label=>{state.label=label;updateVisibility();updatePick();});
handleButtons(variants,"choice",choice=>{
  state.variant=Number(choice);
  state.pick=current().variantFocus?.[state.variant]||current().focus;
  allPress(variants,"choice",state.variant);
  renderDrawing();
});
compactDiagram.addEventListener("change",()=>{
  if(current().id==="detail")renderDrawing();
});
byId("prev").addEventListener("click",()=>navigate(state.index-1));
byId("next").addEventListener("click",()=>navigate(state.index+1));
layerMenu.addEventListener("change",updateVisibility);
axisTarget.addEventListener("change",()=>{
  state.axis=axisTarget.value;
  pick(state.axis);
});
function clearPress() {
  clearTimeout(pressTimeout);
  pendingPress=null;
}
stage.addEventListener("pointerdown",e=>{
  const target=e.target.closest("[data-key]");
  if(!target||e.button!==0||!e.isPrimary)return;
  clearPress();
  longPressTarget=null;
  pendingPress=[e.clientX,e.clientY];
  pressTimeout=setTimeout(()=>{
    longPressTarget=target;
    pick(target.dataset.key);
  },470);
});
stage.addEventListener("click",e=>{
  const target=e.target.closest("[data-key]");
  if(target&&target!==longPressTarget)pick(target.dataset.key);
  longPressTarget=null;
});
stage.addEventListener("contextmenu",e=>{if(e.target.closest(".diagram,.model"))e.preventDefault();});
stage.addEventListener("keydown",e=>{
  const target=e.target.closest("[data-key]");
  if(target&&(e.key==="Enter"||e.key===" ")){e.preventDefault();pick(target.dataset.key);}
  if(e.key==="Escape")pick(null);
});
document.addEventListener("pointermove",e=>{
  if(pendingPress&&Math.hypot(e.clientX-pendingPress[0],e.clientY-pendingPress[1])>9)clearPress();
});
document.addEventListener("pointerup",clearPress);
document.addEventListener("pointercancel",clearPress);
const mono=byId("monochrome");
function setMono(on) {
  document.body.classList.toggle("mono",on);
  mono.setAttribute("aria-pressed",String(on));
}
mono.addEventListener("click",()=>setMono(!document.body.classList.contains("mono")));
byId("reset").addEventListener("click",()=>{
  setMono(false);
  layerMenu.querySelectorAll("input").forEach(input=>input.checked=true);
  state.label="all";
  state.view="photo";
  navigate(state.index);
});
const full=byId("full");
function updateFull(){
  const name=document.fullscreenElement?"退出全屏":"全屏";
  full.title=name;
  full.setAttribute("aria-label",name);
  full.innerHTML=icon(document.fullscreenElement?"exit":"full");
}
full.hidden=!document.fullscreenEnabled;
full.addEventListener("click",async()=>{
  try{
    if(document.fullscreenElement)await document.exitFullscreen();
    else await document.documentElement.requestFullscreen();
  }catch{full.hidden=true;}
});
document.addEventListener("fullscreenchange",updateFull);
updateFull();
renderMenu();
renderTopic();
</script>
</body>
</html>
