<style>

edge p[data-point="3"] b{color:#9d742c}.knowledge p.muted{opacity:.35}.view-tag{position:absolute;bottom:29px;right:27px;font-size:11px;letter-spacing:1px;color:#6a817c;background:#f7faf4b8;border:1px solid #d9e3d8;border-radius:20px;padding:5px 12px;pointer-events:none}#tray{position:fixed;right:0;top:0;bottom:0;width:304px;z-index:5;padding:0;background:#fafbf7f2;border-left:1px solid #d5dfd7;backdrop-filter:blur(18px);display:flex;flex-direction:column;transition:transform .25s}.tray-closed #tray{transform:translateX(100%)}.tray-head{height:78px;flex-shrink:0;padding:25px 22px 18px;display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:600;letter-spacing:2px}.tray-head button{border:1px solid var(--line);background:transparent;width:28px;height:28px;border-radius:8px;font-size:18px;line-height:1}.tray-scroll{overflow-y:auto;flex:1;padding:0 22px 20px;scrollbar-width:thin;scrollbar-color:#bccac0 transparent}.tray-scroll::-webkit-scrollbar{width:5px}.tray-scroll::-webkit-scrollbar-thumb{background:#bccac0;border-radius:10px}.tray-open{position:fixed;right:17px;top:22px;border:1px solid var(--line);border-radius:12px;padding:9px 14px;background:#fafbf7;z-index:4;display:none}.tray-closed .tray-open{display:block}details{border-top:1px solid var(--line);padding:16px 0}summary{list-style:none;cursor:pointer;font-size:12px;letter-spacing:1px;font-weight:650;display:flex;align-items:center;justify-content:space-between}summary::-webkit-details-marker{display:none}summary:after{content:'＋';font-size:15px;font-weight:400;color:#8b9c92}details[open]>summary:after{content:'−'}.section-content{padding-top:14px}.views{display:grid;grid-template-columns:1fr 1fr;gap:7px}.views button{background:#f1f4ee;border:1px solid #e0e6dd;padding:9px 2px;border-radius:8px;font-size:12px}.views button.active{background:#e0eee4;border-color:#99b8a5;color:#2b6257}.row{display:flex;align-items:center;justify-content:space-between;margin:11px 0;gap:8px;font-size:12px}.row label{display:flex;align-items:center;gap:8px;cursor:pointer}.dot{display:inline-block;width:7px;height:7px;border-radius:100%;background:var(--teal)}.toggle{appearance:none;width:30px;height:17px;border-radius:20px;background:#d9e1d9;cursor:pointer;position:relative;transition:background .15s;flex-shrink:0;margin:0}.toggle:before{content:'';position:absolute;width:11px;height:11px;top:3px;left:3px;background:white;border-radius:100%;box-shadow:0 1px 3px #52625230;transition:transform .15s}.toggle:checked{background:#438976}.toggle:checked:before{transform:translateX(13px)}.range-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-top:14px}.range-head:first-child{margin-top:0}.range-head output{font-size:11px;color:#789085;font-variant-numeric:tabular-nums}.range{width:100%;accent-color:#468876;height:18px;cursor:pointer;margin:6px 0 0}.tray-bottom{border-top:1px solid var(--line);padding:15px 22px;display:flex;gap:8px;flex-shrink:0}.tray-bottom button{border:1px solid var(--line);background:transparent;border-radius:8px;padding:7px 12px;font-size:12px;flex:1}.tray-bottom button:hover,.views button:hover{background:#e4eee3}.mini{font-size:11px;color:#71887a}.hidden{display:none!important}#fallback{position:absolute;inset:30% 10%;padding:25px;background:#fff;display:none}.swatches{display:flex;gap:12px;position:absolute;top:122px;left:36px;pointer-events:none;font-size:11px;color:#73877f}.swatches span{display:flex;align-items:center;gap:6px}@media(max-width:900px){#stage{right:270px}#tray{width:270px}.masthead{left:22px;top:22px}.masthead h1{font-size:22px}.knowledge{left:22px;bottom:22px;width:calc(100% - 44px);padding:12px 14px}.view-tag{bottom:12px;right:15px;font-size:10px}.swatches{left:24px;top:118px}.knowledge p,.knowledge .lead{font-size:12px}}@media(max-width:640px){#stage{right:0}#tray{width:270px;box-shadow:-8px 0 35px #233e3920}.masthead h1{font-size:21px}.masthead{left:20px}.focus-row{max-width:300px}.chi /* Compact tray spacing and controls. */
#tray{font-size:11.5px;line-height:1.35}
#tray .tray-head{height:44px;padding:9px 16px;font-size:13px;letter-spacing:1px}
#tray .tray-head button{width:24px;height:24px;border-radius:6px;font-size:17px}
#tray .tray-scroll{padding:0 16px 8px}
#tray details{padding:7px 0}

#tray .inline-control{display:grid;grid-template-columns:58px minmax(0,1fr) 58px;align-items:center;gap:5px;min-height:22px;margin:3px 0;font-size:11px}

#tray .tray-bottom button{padding:4px 9px;line-height:17px;font-size:11px;border-radius:6px}

#tray .range:disabled{opacity:.6;cursor:default}

#background{position:absolute;inset:0;pointer-events:none}#scene{position:relative}

#tray .tray-head{height:32px;padding:3px 16px;justify-content:flex-end}

.chip[data-focus="4"].active{background:#74648a;border-color:#74648a}
.knowledge p[data-point="4"] b{color:#74648a}

#tray .number-input::-webkit-inner-spin-button,#tray .number-input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
#tray .number-input:focus{border-color:#438976;background:white;outline:1px solid #438976;outline-offset:0}
#tray .number-unit{font-size:10px;color:#789085}
#tray .inline-control{grid-template-columns:58px minmax(0,1fr) 75px}
#tray .inline-control .number-input{width:57px}
</style>

<body>
<main id="stage">
<canvas id="background" aria-hidden="true"></canvas><canvas id="scene" tabindex="0" aria-label="可旋转的三维人物与视平线场景"></canvas><canvas id="overlay" aria-hidden="true"></canvas>
<aside class="knowledge" id="knowledge"><p class="lead">平视时，<b>视平线与地平线重合</b>，表示与观察者眼睛等高的水平面。</p><p data-point="1">① <b>身高相近的人</b>站在同一地面，眼睛与观察者等高，处于视平线上。</p><p data-point="2">② <b>身高略低的人</b>，其头顶靠近视平线。</p><p data-point="3">③ <b>身高约成人一半的儿童</b>，头顶约在站立成人的半腰处。</p><p data-point="4">④ <b>踩高跷的人</b>，高跷与自身等高，头顶离地高度为原身高的两倍。</p></aside>
<div id="fallback">当前浏览器无法显示 3D 场景，请使用支持 WebGL 的浏览器打开。</div>
</main>
<button class="tray-open" id="openTray" aria-controls="tray" aria-expanded="false" aria-label="展开工具栏">☰</button>
<aside id="tray" aria-label="工具栏"><div class="tray-head"><button id="closeTray" aria-label="折叠工具栏">›</button></div><div class="tray-scroll">
<details open><summary>知识点</summary><div class="section-content knowledge-options"><button class="chip" data-focus="1" aria-pressed="false">等高人物的眼睛</button><button class="chip" data-focus="2" aria-pressed="false">略矮人物的头顶</button><button class="chip" data-focus="3" aria-pressed="false">小孩与成人半高</button><button class="chip" data-focus="4" aria-pressed="false">高跷与双倍身高</button></div></details>
<details open><summary>视角</summary><div class="section-content"><div class="views"><button data-view="eye" class="active">观察者视角</button><button data-view="global">全局</button><button data-view="parallelFront" title="拖动平移，滚轮缩放">正面平行投影</button><button data-view="parallelSide" title="拖动平移，滚轮缩放">侧面平行投影</button></div><div class="pitch-control"><div class="inline-control"><label for="pitch">俯仰度数</label><input class="range" id="pitch" type="range" min="-65" max="65" step="1" value="0"><span class="numeric-value"><input class="number-input" id="pitchOut" data-number="pitch" aria-label="俯仰度数（°）" type="number" inputmode="decimal" min="-65" max="65" step="1" value="0"><span class="number-unit">°</span></span></div></div></div></details>
<details open><summary>人物</summary><div class="section-content">
<div class="range-head height-head"><label for="observerHeight">观察者身高</label><span class="numeric-value"><input class="number-input" id="observerHeightOut" data-number="observerHeight" aria-label="观察者身高（米）" type="number" inputmode="decimal" min="0.4" max="2.4" step="0.001" value="1.72"><span class="number-unit">米</span></span><input class="toggle" id="observer" aria-label="观察者显示开关" type="checkbox" checked></div><div class="range-wrap"><input class="range" id="observerHeight" type="range" min="0.4" max="2.4" step="0.001" value="1.72"><button class="eye-marker" id="observerHeightEye" type="button" data-tip="眼高" aria-label="眼高" tabindex="0"></button></div>
<div class="range-head height-head"><label for="adultHeight">男人</label><span class="numeric-value"><input class="number-input" id="adultHeightOut" data-number="adultHeight" aria-label="男人身高（米）" type="number" inputmode="decimal" min="0.4" max="2.4" step="0.001" value="1.72"><span class="number-unit">米</span></span><input class="toggle" id="group1" aria-label="男人显示开关" type="checkbox" checked></div><div class="range-wrap"><input class="range" id="adultHeight" type="range" min="0.4" max="2.4" step="0.001" value="1.72"><button class="eye-marker" id="adultHeightEye" type="button" data-tip="眼高" aria-label="眼高" tabindex="0"></button></div>
<div class="range-head height-head"><label for="womanHeight">女人</label><span class="numeric-value"><input class="number-input" id="womanHeightOut" data-number="womanHeight" aria-label="女人身高（米）" type="number" inputmode="decimal" min="0.4" max="2.4" step="0.001" value="1.6"><span class="number-unit">米</span></span><input class="toggle" id="group2" aria-label="女人显示开关" type="checkbox" checked></div><div class="range-wrap"><input class="range" id="womanHeight" type="range" min="0.4" max="2.4" step="0.001" value="1.6"><button class="eye-marker" id="womanHeightEye" type="button" data-tip="眼高" aria-label="眼高" tabindex="0"></button></div>
<div class="range-head height-head"><label for="childHeight">小孩身高</label><span class="numeric-value"><input class="number-input" id="childHeightOut" data-number="childHeight" aria-label="小孩身高（米）" type="number" inputmode="decimal" min="0.4" max="1.6" step="0.001" value="0.86"><span class="number-unit">米</span></span><input class="toggle" id="group3" aria-label="小孩显示开关" type="checkbox" checked></div><div class="range-wrap"><input class="range" id="childHeight" type="range" min="0.4" max="1.6" step="0.001" value="0.86"><button class="eye-marker" id="childHeightEye" type="button" data-tip="眼高" aria-label="眼高" tabindex="0"></button></div>
<div class="range-head height-head"><label for="stiltTotalHeight" title="总高自动等于男人身高的两倍">高跷男人总高</label><span class="numeric-value"><input class="number-input" id="stiltTotalHeightOut" data-number="stiltTotalHeight" aria-label="高跷男人总高（米）" type="number" inputmode="decimal" min="0.8" max="4.8" step=".002" value="3.44"><span class="number-unit">米</span></span><input class="toggle" id="group4" aria-label="踩高跷的男人显示开关" type="checkbox" checked></div><div class="range-wrap"><input class="range" id="stiltTotalHeight" type="range" min="0.8" max="4.8" step="0.001" value="3.44" disabled><button class="eye-marker" id="stiltTotalHeightEye" type="button" data-tip="眼高" aria-label="眼高" tabindex="0"></button></div>

</div></details>
<details open><summary>距离</summary><div class="section-content"><div class="inline-control"><label for="stiltDistance">高跷前后</label><input class="range" id="stiltDistance" type="range" min="4" max="28" step="0.1" value="8.5"><span class="numeric-value"><input class="number-input" id="stiltDistanceOut" data-number="stiltDistance" aria-label="高跷前后（米）" type="number" inputmode="decimal" min="4" max="28" step="0.1" value="8.5"><span class="number-unit">米</span></span></div><div class="inline-control"><label for="near">近处</label><input class="range" id="near" type="range" min="4.5" max="8" step="0.1" value="6"><span class="numeric-value"><input class="number-input" id="nearOut" data-number="near" aria-label="近处距离（米）" type="number" inputmode="decimal" min="4.5" max="8" step="0.1" value="6"><span class="number-unit">米</span></span></div><div class="inline-control"><label for="middle">中间</label><input class="range" id="middle" type="range" min="8.5" max="14" step="0.1" value="11"><span class="numeric-value"><input class="number-input" id="middleOut" data-number="middle" aria-label="中间距离（米）" type="number" inputmode="decimal" min="8.5" max="14" step="0.1" value="11"><span class="number-unit">米</span></span></div><div class="inline-control"><label for="far">远处</label><input class="range" id="far" type="range" min="14.5" max="28" step="0.1" value="19"><span class="numeric-value"><input class="number-input" id="farOut" data-number="far" aria-label="远处距离（米）" type="number" inputmode="decimal" min="14.5" max="28" step="0.1" value="19"><span class="number-unit">米</span></span></div><div class="inline-control"><label for="rulerX">标尺横向</label><input class="range" id="rulerX" type="range" min="-6" max="6" step="0.1" value="-4.6"><span class="numeric-value"><input class="number-input" id="rulerXOut" data-number="rulerX" aria-label="标尺横向位置（米）" type="number" inputmode="decimal" min="-6" max="6" step="0.1" value="-4.6"><span class="number-unit">米</span></span></div><div class="inline-control"><label for="rulerDistance">标尺前后</label><input class="range" id="rulerDistance" type="range" min="3" max="30" step="0.1" value="8.5"><span class="numeric-value"><input class="number-input" id="rulerDistanceOut" data-number="rulerDistance" aria-label="标尺前后位置（米）" type="number" inputmode="decimal" min="3" max="30" step="0.1" value="8.5"><span class="number-unit">米</span></span></div></div></details>
<details open><summary>图层</summary><div class="section-content">
<div class="row"><label for="horizon"><i class="dot" style="background:var(--pink)"></i>视平线</label><input class="toggle" id="horizon" type="checkbox" checked></div>
<div class="row"><label for="guides">高度辅助线</label><input class="toggle" id="guides" type="checkbox" checked></div>
<div class="row"><label for="grid">地面网格</label><input class="toggle" id="grid" type="checkbox" checked></div>
<div class="row"><label for="ruler">标尺</label><input class="toggle" id="ruler" type="checkbox" checked></div>
<div class="row"><label for="labels">人物标注</label><input class="toggle" id="labels" type="checkbox"></div>
<div class="row"><label for="text">文字说明</label><input class="toggle" id="text" type="checkbox" checked></div>
</div></details>
</div><div class="tray-bottom"><button id="reset">恢复初始</button><button id="fullscreen">全屏</button></div></aside>
<script>
'use strict';
// No network requests or external dependencies. Geometry and renderer are embedded.
const $=id=>document.getElementById(id), canvas=$('scene'), overlay=$('overlay'),ctx=overlay.getContext('2d'),background=$('background'),bgctx=background.getContext('2d');
const gl=canvas.getContext('webgl',{antialias:true,alpha:true,preserveDrawingBuffer:true});
if(!gl){$('fallback').style.display='block';throw new Error('WebGL unavailable');}
const EYE_RATIO=1.524/1.65;
const defaults={horizon:true,guides:true,grid:true,ruler:true,labels:false,text:true,group1:true,group2:true,group3:true,group4:true,observer:true,observerHeight:1.72,adultHeight:1.72,womanHeight:1.6,childHeight:.86,near:6,middle:11,far:19,stiltDistance:8.5,rulerX:-4.6,rulerDistance:8.5,pitch:0};
const state={...defaults,view:'eye',focus:0,observerX:0,observerZ:-5,lookYaw:0,orbitYaw:33,orbitElevation:24,zoom:100,panX:0,panY:0};
Object.defineProperties(state,{plane:{enumerable:true,get:()=>state.horizon},relations:{enumerable:true,get:()=>state.guides},waist:{enumerable:true,get:()=>state.guides},rays:{enumerable:true,get:()=>false},dimensions:{enumerable:true,get:()=>false},stiltManHeight:{enumerable:true,get:()=>state.adultHeight},stiltHeight:{enumerable:true,get:()=>state.adultHeight},stiltTotalHeight:{enumerable:true,get:()=>state.adultHeight*2}});
const observerEye=()=>{const t=state.lookYaw*Math.PI/180,offset=state.observerHeight*.066;return [state.observerX+Math.sin(t)*offset,state.observerHeight*EYE_RATIO,state.observerZ+Math.cos(t)*offset];};

function backgroundTicks(){if(camera.kind!=='orthographic'||!state.ruler)return [];let scale=height/camera.span,start=Math.max(0,Math.ceil((camera.target[1]-.6*camera.span)*10)),end=Math.ceil((camera.target[1]+.4*camera.span)*10),step=scale*.1<7?5:1;start=Math.ceil(start/step)*step;let ticks=[];for(let i=start;i<=end;i+=step){const p=project([camera.target[0],i/10,camera.target[2]]);if(p&&p.y>=0&&p.y<=height)ticks.push({height:i/10,y:p.y,major:i%5===0,whole:i%10===0});}return ticks;}

const heldKeys=new Set();let lastFrame=0;
function advanceMovement(dt){if(state.view!=='eye'||!heldKeys.size)return false;let forward=(heldKeys.has('KeyW')?1:0)-(heldKeys.has('KeyS')?1:0),side=(heldKeys.has('KeyD')?1:0)-(heldKeys.has('KeyA')?1:0);if(!forward&&!side)return false;let len=Math.hypot(forward,side),step=dt*(heldKeys.has('ShiftLeft')||heldKeys.has('ShiftRight')?3.3:1.7)/len,t=state.lookYaw*Math.PI/180;state.observerX+=step*(Math.sin(t)*forward-Math.cos(t)*side);state.observerZ+=step*(Math.cos(t)*forward+Math.sin(t)*side);state.observerX=Math.min(35,Math.max(-35,state.observerX));state.observerZ=Math.min(45,Math.max(-35,state.observerZ));guidesDirty=true;return true;}

function schedule(rebuildGeometry=false){if(rebuildGeometry===true)dirty=true;if(rebuildGeometry==='guides')guidesDirty=true;if(!raf)raf=requestAnimationFrame(render);}
function numberText(key){const value=state[key];return key==='pitch'?String(Math.round(value)):['near','middle','far','stiltDistance','rulerX','rulerDistance'].includes(key)?Number(value).toFixed(1):Number(value).toFixed(3);}
function sync(){for(let key of Object.keys(defaults)){let input=$(key);if(!input)continue;if(input.type==='checkbox')input.checked=state[key];else input.value=state[key];let out=$(key+'Out');if(out&&document.activeElement!==out)out.value=numberText(key);}
$('stiltTotalHeight').value=state.stiltTotalHeight;if(document.activeElement!==$('stiltTotalHeightOut'))$('stiltTotalHeightOut').value=numberText('stiltTotalHeight');
for(let key of ['observerHeight','adultHeight','womanHeight','childHeight','stiltTotalHeight']){const marker=$(key+'Eye'),input=$(key),relative=key==='stiltTotalHeight'?state.adultHeight*(1+EYE_RATIO):state[key]*EYE_RATIO,eye=relative;let fraction=Math.min(1,Math.max(0,(relative-Number(input.min))/(Number(input.max)-Number(input.min))));marker.style.left=`calc(${fraction*100}% + ${8-16*fraction}px)`;marker.dataset.tip='眼高 '+eye.toFixed(3)+' 米';marker.setAttribute('aria-label',marker.dataset.tip);}
document.querySelectorAll('[data-view]').forEach(b=>{let active=b.dataset.view===state.view;b.classList.toggle('active',active);b.setAttribute('aria-pressed',active);});document.querySelectorAll('[data-focus]').forEach(b=>{let active=+b.dataset.focus===state.focus;b.classList.toggle('active',active);b.setAttribute('aria-pressed',active);});document.querySelectorAll('[data-point]').forEach(p=>p.classList.toggle('muted',state.focus&&+p.dataset.point!==state.focus));$('knowledge').classList.toggle('hidden',!state.text);}
function setView(view){if(!['eye','global','parallelFront','parallelSide'].includes(view))return;heldKeys.clear();state.view=view;state.zoom=100;state.panX=state.panY=0;if(view==='global'){state.orbitYaw=33;state.orbitElevation=24;}sync();schedule('guides');}
for(let key of Object.keys(defaults))$(key).addEventListener('input',()=>{let el=$(key);state[key]=el.type==='checkbox'?el.checked:Number(el.value);sync();let staticKeys=['group1','group2','group3','group4','adultHeight','womanHeight','childHeight','near','middle','far','stiltDistance'];schedule(staticKeys.includes(key)?true:['grid','text','labels'].includes(key)?false:'guides');});

$('reset').onclick=()=>{heldKeys.clear();Object.assign(state,defaults,{view:'eye',focus:0,observerX:0,observerZ:-5,lookYaw:0,orbitYaw:33,orbitElevation:24,zoom:100,panX:0,panY:0});sync();schedule(true);};

let pointers=new Map(),last=null,pinch=null;
