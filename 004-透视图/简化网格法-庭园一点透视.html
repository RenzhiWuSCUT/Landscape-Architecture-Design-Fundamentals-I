function resetView(){state.yaw=-.57;state.pitch=.53;state.zoom=1;state.pan=[0,0];state.planPan=[0,0];state.orbitTarget=null;state.tempOrbit=false;state.view=effectiveView();dirty=true;updateUI()}
function resetObserver(){state.eyeX=0;state.eye=1.65;state.distance=3.8;state.heading=0;meshDirty=true;dirty=true;updateUI()}
function alignOrbitToObserver(){const o=observerFrame();state.orbitTarget=V.add(o.eye,V.mul(o.forward,6));state.yaw=-state.heading*Math.PI/180;state.pitch=0;state.zoom=14/6;state.tempOrbit=true;state.view=effectiveView();dirty=true;updateUI()}
$('#prev').onclick=()=>setStep(state.step-1);$('#next').onclick=()=>setStep(state.step+1);$('#stepRange').addEventListener('input',e=>setStep(Number(e.target.value)));$('#viewReset').onclick=resetView;$('#observerReset').onclick=resetObserver;$('#alignDirection').onclick=()=>{state.heading=state.angle;meshDirty=true;dirty=true;updateUI()};$('#observerView').onclick=alignOrbitToObserver;$('#reset').onclick=()=>{stop();resetObserver();state.angle=0;state.wall=3;state.observer=true;resetView();setStep(1)};
$('#play').onclick=()=>{if(playTimer){stop();return}if(state.step===12)setStep(1);$('#play').textContent='暂停';playTimer=setInterval(()=>{if(state.step===12){stop();return}setStep(state.step+1,true)},4400)};
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));$('#tray').addEventListener('toggle',resize);
function screenPosition(e){const r=canvas.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
function groundAt(x,y,height=state.eye){if(camera.ortho){return [(x-W/2)*camera.width/W+camera.target[0],height,(H/2-y)*camera.height/H+camera.target[2]]}const f=V.unit(V.sub(camera.target,camera.eye)),back=V.mul(f,-1),right=V.unit(V.cross(back,[0,1,0])),up=V.cross(right,back),ray=V.add(f,V.add(V.mul(right,(x-W/2)/camera.focal),V.mul(up,(H/2-y)/camera.focal)));if(Math.abs(ray[1])<.0001)return null;const t=(height-camera.eye[1])/ray[1];if(t<=0)return null;return V.add(camera.eye,V.mul(ray,t))}
function hitHandle(x,y){if(!observerVisible())return null;const o=observerFrame(),eye=project(o.eye,false),tip=project(V.add(o.eye,V.mul(o.forward,1.45)),false);if(tip&&Math.hypot(x-tip.x,y-tip.y)<19)return 'heading';if(eye&&Math.hypot(x-eye.x,y-eye.y)<19)return 'eye';return null}
function moveHandle(kind,x,y){const p=groundAt(x,y);if(!p)return;if(kind==='eye'){state.eyeX=Math.min(4,Math.max(-4,p[0]));state.distance=Math.min(8,Math.max(2.5,-p[2]))}else{state.heading=Math.min(60,Math.max(-60,Math.atan2(p[0]-state.eyeX,p[2]+state.distance)*180/Math.PI))}meshDirty=true;dirty=true;updateUI()}
let pointer=null,touches=new Map(),pinch=0;
canvas.addEventListener('pointerdown',e=>{heightHoverPosition=null;updateHeightTip();stop();canvas.setPointerCapture(e.pointerId);const pos=screenPosition(e);touches.set(e.pointerId,[pos.x,pos.y]);pointer={id:e.pointerId,x:pos.x,y:pos.y,handle:hitHandle(pos.x,pos.y),pan:e.shiftKey||e.button===2};if(touches.size===2){pointer.handle=null;const a=[...touches.values()];pinch=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])}});
canvas.addEventListener('pointermove',e=>{const pos=screenPosition(e);if(!touches.has(e.pointerId)){heightHoverPosition=e.pointerType==='touch'?null:pos;updateHeightTip();canvas.style.cursor=hitHandle(pos.x,pos.y)?'grab':heightLineAt(pos.x,pos.y)?'help':state.view==='orbit'?'grab':'default';return}touches.set(e.pointerId,[pos.x,pos.y]);if(touches.size===2){const a=[...touches.values()],d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);if(pinch>0)state.zoom=Math.min(3.2,Math.max(.48,state.zoom*d/pinch));pinch=d;dirty=true;return}if(!pointer||pointer.id!==e.pointerId)return;const dx=pos.x-pointer.x,dy=pos.y-pointer.y;pointer.x=pos.x;pointer.y=pos.y;if(pointer.handle){moveHandle(pointer.handle,pos.x,pos.y);return}if(state.view==='picture'&&Math.hypot(dx,dy)>0){alignOrbitToObserver();setCamera()}if(state.view==='orbit'){if(pointer.pan){const r=14/state.zoom*.0018,t=state.orbitTarget||[0,1,1.9];state.orbitTarget=V.add(t,[-dx*Math.cos(state.yaw)*r,dy*r,-dx*Math.sin(state.yaw)*r])}else{state.yaw-=dx*.006;state.pitch=Math.min(1.48,Math.max(-.1,state.pitch+dy*.005))}}else if(state.view==='plan'){state.planPan[0]-=dx*camera.width/W;state.planPan[1]+=dy*camera.height/H}dirty=true;updateUI()});
canvas.addEventListener('pointerleave',()=>{heightHoverPosition=null;updateHeightTip()});
function release(e){touches.delete(e.pointerId);pointer=null;pinch=0;if(touches.size===1){const [id,p]=[...touches.entries()][0];pointer={id,x:p[0],y:p[1],handle:null,pan:false}}}canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);canvas.addEventListener('contextmenu',e=>e.preventDefault());canvas.addEventListener('wheel',e=>{e.preventDefault();state.zoom=Math.min(3.2,Math.max(.48,state.zoom*Math.exp(-e.deltaY*.001)));dirty=true},{passive:false});
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='BUTTON'||e.target.tagName==='SUMMARY')return;if(e.key==='ArrowRight')setStep(state.step+1);if(e.key==='ArrowLeft')setStep(state.step-1);if(e.code==='Space'){e.preventDefault();$('#play').click()}});

const miniCanvas=$('#miniMap'),miniCtx=miniCanvas.getContext('2d');let miniFrame=null,miniDrag=null;
function miniFit(w,h){const o=observerFrame(),tip=V.add(o.eye,V.mul(o.forward,1.6)),points=[o.eye,tip];for(const p of [[-3.2,0,0],[3.2,0,0],[-3.2,0,6.2],[3.2,0,6.2]])points.push(worldPoint(p));if(state.step>=2&&state.plane)points.push(planePoint(-3.7,0),planePoint(3.7,0));const xs=points.map(p=>p[0]),zs=points.map(p=>p[2]),loX=Math.min(...xs)-.65,hiX=Math.max(...xs)+.65,loZ=Math.min(...zs)-.65,hiZ=Math.max(...zs)+.65;return {w,h,cx:(loX+hiX)/2,cz:(loZ+hiZ)/2,scale:Math.min((w-10)/(hiX-loX),(h-10)/(hiZ-loZ))}}
function miniProject(p,model=false){const f=miniFrame,q=model?worldPoint(p):p;return {x:f.w/2+(q[0]-f.cx)*f.scale,y:f.h/2-(q[2]-f.cz)*f.scale}}
function miniUnproject(x,y){const f=miniFrame;return [f.cx+(x-f.w/2)/f.scale,0,f.cz+(f.h/2-y)/f.scale]}
function miniPath(points,fill=null,stroke='#82928a',width=.7,model=true){miniCtx.beginPath();points.forEach((p,i)=>{const q=miniProject(p,model);i?miniCtx.lineTo(q.x,q.y):miniCtx.moveTo(q.x,q.y)});miniCtx.closePath();if(fill){miniCtx.fillStyle=fill;miniCtx.fill()}if(stroke){miniCtx.strokeStyle=stroke;miniCtx.lineWidth=width;miniCtx.stroke()}}
function miniLine(a,b,color='#afb8b0',width=.6,model=true){const p=miniProject(a,model),q=miniProject(b,model);miniCtx.beginPath();miniCtx.moveTo(p.x,p.y);miniCtx.lineTo(q.x,q.y);miniCtx.strokeStyle=color;miniCtx.lineWidth=width;miniCtx.stroke()}
function miniRect(x,z,w,d,fill,stroke='#82928a'){miniPath([[x,0,z],[x+w,0,z],[x+w,0,z+d],[x,0,z+d]],fill,stroke)}
function miniCircle(p,r,fill,stroke=null,width=.7,model=true){const q=miniProject(p,model);miniCtx.beginPath();miniCtx.arc(q.x,q.y,r*miniFrame.scale,0,Math.PI*2);if(fill){miniCtx.fillStyle=fill;miniCtx.fill()}if(stroke){miniCtx.strokeStyle=stroke;miniCtx.lineWidth=width;miniCtx.stroke()}}
function renderMiniMap(){const r=miniCanvas.getBoundingClientRect(),w=r.width,h=r.height;if(w<1||h<1)return;const pixelRatio=Math.min(devicePixelRatio||1,2);if(miniCanvas.width!==Math.round(w*pixelRatio)||miniCanvas.height!==Math.round(h*pixelRatio)){miniCanvas.width=Math.round(w*pixelRatio);miniCanvas.height=Math.round(h*pixelRatio)}miniCtx.setTransform(pixelRatio,0,0,pixelRatio,0,0);miniCtx.clearRect(0,0,w,h);miniFrame=miniDrag?miniDrag.frame:miniFit(w,h);
miniRect(-3,0,6,6,'#f0f0e9');for(let i=1;i<8;i++){miniLine([-3+i*.75,0,0],[-3+i*.75,0,6]);miniLine([-3,0,i*.75],[3,0,i*.75])}
miniRect(-2.93,0,1.64,1.05,'#dce5d7');miniRect(-2.92,5.05,5.86,.88,'#dce5d7');miniRect(1.55,2.65,1.38,2.42,'#dce5d7');
for(const [x,z,w,d]of [[-3.11,0,.16,6.1],[-3.11,5.94,6.22,.16],[2.96,0,.1,5.94]])miniRect(x,z,w,d,'#8a9690','#74827c');
for(const [x,z,w,d]of [[1.49,2.59,.17,2.47],[1.49,4.90,1.48,.17],[2.13,.61,.75,1.88],[-2.96,2.72,.67,1.16],[-2.96,4.30,3.14,.63]])miniRect(x,z,w,d,'#f7f6f0','#788982');
miniCircle([-2.03,0,1.86],.75,'#f6f7f0','#7d908f');miniCircle([-2.03,0,1.86],.59,'#7db9c8','#689baa');for(const radius of [.4,.25,.1])miniCircle([-2.03,0,1.86],radius,null,'#d9ecee',.6);
for(const [x,z,rad]of [[-2.13,.49,.5],[-2.32,5.5,.43],[-1.5,5.42,.43],[-.63,5.49,.58],[.43,5.46,.49],[1.06,5.63,.48],[2.04,5.46,.96],[2.31,4.82,.36],[2.31,4.14,.36],[2.31,3.47,.36],[2.31,2.9,.32]]){miniCircle([x,0,z],rad,'#a4b89e','#819c80');miniCircle([x-.12,0,z+.09],rad*.62,'#b6c8ab',null)}
if(state.step>=2&&state.plane)miniLine(planePoint(-3.7,0),planePoint(3.7,0),'#6da5bd',1,false);
const o=observerFrame(),tip=V.add(o.eye,V.mul(o.forward,1.6));miniLine(o.eye,tip,'#cd655a',1.25,false);const base=V.sub(tip,V.mul(o.forward,.29));miniPath([tip,V.add(base,V.mul(o.right,.13)),V.sub(base,V.mul(o.right,.13))],'#cf6559',null,1,false);
for(const p of [o.eye,tip]){const q=miniProject(p);miniCtx.beginPath();miniCtx.arc(q.x,q.y,3.5,0,Math.PI*2);miniCtx.fillStyle='#fff';miniCtx.fill();miniCtx.strokeStyle='#c86156';miniCtx.lineWidth=1;miniCtx.stroke()}const q=miniProject(o.eye);miniCtx.beginPath();miniCtx.arc(q.x,q.y,2,0,Math.PI*2);miniCtx.fillStyle='#cd6055';miniCtx.fill();}
function miniPosition(e){const r=miniCanvas.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
function miniHit(x,y){if(!miniFrame)return null;const o=observerFrame(),eye=miniProject(o.eye),tip=miniProject(V.add(o.eye,V.mul(o.forward,1.6)));if(Math.hypot(x-tip.x,y-tip.y)<10)return 'heading';if(Math.hypot(x-eye.x,y-eye.y)<10)return 'eye';return null}
function miniMove(kind,x,y){const p=miniUnproject(x,y);if(kind==='eye'){state.eyeX=Math.min(4,Math.max(-4,p[0]));state.distance=Math.min(8,Math.max(2.5,-p[2]))}else{state.heading=Math.min(60,Math.max(-60,Math.atan2(p[0]-state.eyeX,p[2]+state.distance)*180/Math.PI))}meshDirty=true;dirty=true;updateUI()}
miniCanvas.addEventListener('pointerdown',e=>{const p=miniPosition(e),kind=miniHit(p.x,p.y);if(!kind)return;stop();e.preventDefault();miniCanvas.setPointerCapture(e.pointerId);miniDrag={id:e.pointerId,kind,frame:{...miniFrame}};miniCanvas.style.cursor='grabbing'});
miniCanvas.addEventListener('pointermove',e=>{const p=miniPosition(e);if(miniDrag&&miniDrag.id===e.pointerId){miniMove(miniDrag.kind,p.x,p.y)}else if(!miniDrag)miniCanvas.style.cursor=miniHit(p.x,p.y)?'grab':'default'});
function miniRelease(e){if(miniDrag&&miniDrag.id===e.pointerId){miniDrag=null;dirty=true;miniCanvas.style.cursor='default'}}miniCanvas.addEventListener('pointerup',miniRelease);miniCanvas.addEventListener('pointercancel',miniRelease);
miniCanvas.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();e.stopPropagation();stop();if(e.shiftKey&&(e.key==='ArrowLeft'||e.key==='ArrowRight'))state.heading=Math.min(60,Math.max(-60,state.heading+(e.key==='ArrowLeft'?-2:2)));else if(e.key==='ArrowLeft'||e.key==='ArrowRight')state.eyeX=Math.min(4,Math.max(-4,state.eyeX+(e.key==='ArrowLeft'?-.1:.1)));else state.distance=Math.min(8,Math.max(2.5,state.distance+(e.key==='ArrowUp'?-.1:.1)));meshDirty=true;dirty=true;updateUI()});
window.addEventListener('resize',resize);const layoutObserver=new ResizeObserver(resize);layoutObserver.observe($('#viewport'));layoutObserver.observe($('#miniMap'));if(window.innerWidth<500)$('#tray').open=false;initGL();setStep(1);resize();loop();
