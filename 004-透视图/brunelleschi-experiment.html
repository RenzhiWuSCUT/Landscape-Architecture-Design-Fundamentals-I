function textureTriangle(im,src,dst,alpha){ctx.save();ctx.globalAlpha=alpha||1;ctx.beginPath();ctx.moveTo(...dst[0]);ctx.lineTo(...dst[1]);ctx.lineTo(...dst[2]);ctx.closePath();ctx.clip();const [a,b,c]=src,[A,B,C]=dst,d=(b[0]-a[0])*(c[1]-a[1])-(c[0]-a[0])*(b[1]-a[1]);const m11=((B[0]-A[0])*(c[1]-a[1])-(C[0]-A[0])*(b[1]-a[1]))/d,m12=((B[1]-A[1])*(c[1]-a[1])-(C[1]-A[1])*(b[1]-a[1]))/d,m21=((C[0]-A[0])*(b[0]-a[0])-(B[0]-A[0])*(c[0]-a[0]))/d,m22=((C[1]-A[1])*(b[0]-a[0])-(B[1]-A[1])*(c[0]-a[0]))/d;ctx.transform(m11,m12,m21,m22,A[0]-m11*a[0]-m21*a[1],A[1]-m12*a[0]-m22*a[1]);ctx.drawImage(im,0,0);ctx.restore()}

function draw(){camera();ctx.clearRect(0,0,width,height);ctx.fillStyle='#e1e4d7';let ground=[[-8.5,0,-3.4],[6.2,0,-3.4],[6.2,0,3.4],[-8.5,0,3.4]].map(project);ctx.beginPath();ground.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fill();let queue=[];for(let f of meshes){let p=f.points.map(project);if(p.some(a=>a[2]<.1))continue;let center=mul(f.points.reduce((a,b)=>add(a,b),[0,0,0]),1/f.points.length);let k=f.shade?.56+.40*Math.max(0,dot(f.n,light))+.13*Math.max(0,dot(f.n,unit(sub(cam,center)))):1;let color=f.color.map(v=>Math.min(255,Math.round(v*k)));queue.push({d:p.reduce((s,a)=>s+a[2],0)/p.length,draw:()=>{ctx.fillStyle=`rgb(${color})`;ctx.beginPath();p.forEach((a,i)=>i?ctx.lineTo(a[0],a[1]):ctx.moveTo(a[0],a[1]));ctx.closePath();ctx.fill();ctx.strokeStyle=`rgb(${color})`;ctx.lineWidth=.42;ctx.stroke()}})}for(let de of decals){let p=de.points.map(project),sz=de.image.width,src=[[0,sz],[sz,sz],[sz,0],[0,0]];queue.push({d:p.reduce((s,a)=>s+a[2],0)/4-.004,draw:()=>{textureTriangle(de.image,[src[0],src[1],src[2]],[p[0],p[1],p[2]].map(a=>a.slice(0,2)),de.alpha);textureTriangle(de.image,[src[0],src[2],src[3]],[p[0],p[2],p[3]].map(a=>a.slice(0,2)),de.alpha)}})}queue.sort((a,b)=>b.d-a.d);queue.forEach(f=>f.draw());for(let l of lines){let p=l.points.map(project);ctx.save();ctx.strokeStyle=l.col;ctx.lineWidth=l.width;ctx.globalAlpha=l.alpha;ctx.setLineDash(l.dash?[6,6]:[]);ctx.beginPath();p.forEach((a,i)=>i?ctx.lineTo(a[0],a[1]):ctx.moveTo(a[0],a[1]));ctx.stroke();ctx.restore()}for(let l of labels){let p=project(l.p());l.el.style.left=p[0]+'px';l.el.style.top=p[1]+'px';l.el.style.display=p[0]<20||p[0]>width-20||p[1]<10||p[1]>height-20?'none':'block'}dirty=false;}
const steps=[['观察镜像','画面朝向镜子；同一只眼睛透过小孔，观看画作的反射。'],['移开镜子','移开镜子，从同一小孔看真实洗礼堂，与画作镜像比较。']];
function update(){step=step>=.5?1:0;let i=step;$('step').value=step;$('step').style.setProperty('--progress',step*100+'%');$('stepname').textContent=steps[i][0];$('stepnum').textContent=i+1;$('description').textContent=steps[i][1];document.querySelectorAll('[data-step]').forEach(b=>b.classList.toggle('active',+b.dataset.step===i));let real=step===1;$('viewmode').textContent=real?'真实洗礼堂':'画作的镜像';illustration(ec,!real);let g=ec.createRadialGradient(260,200,130,260,200,310);g.addColorStop(0,'#283b3200');g.addColorStop(1,'#283b32b0');ec.fillStyle=g;ec.fillRect(0,0,520,400);rebuild();dirty=true;}
function stop(){playing=comparing=false;$('play').textContent='自动演示';$('compare').textContent='交替比较'}
$('step').addEventListener('input',e=>{stop();step=+e.target.value;update()});document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{stop();step=+b.dataset.step;update()});$('play').onclick=()=>{let was=playing;stop();if(!was){playing=true;step=0;clock=0;$('play').textContent='暂停';update()}};$('compare').onclick=()=>{let was=comparing;stop();if(!was){comparing=true;clock=0;step=0;$('compare').textContent='停止比较';update()}};$('reset').onclick=()=>{yaw=.90;pitch=.31;zoom=1;dirty=true};
let pointer=null;canvas.addEventListener('pointerdown',e=>{pointer={x:e.clientX,y:e.clientY,id:e.pointerId};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!pointer)return;yaw-=(e.clientX-pointer.x)*.006;pitch=Math.max(.06,Math.min(1.1,pitch+(e.clientY-pointer.y)*.005));pointer.x=e.clientX;pointer.y=e.clientY;dirty=true});canvas.addEventListener('pointerup',()=>pointer=null);canvas.addEventListener('pointercancel',()=>pointer=null);canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.7,Math.min(1.8,zoom*Math.exp(-e.deltaY*.001)));dirty=true},{passive:false});
function resize(){const r=canvas.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);width=r.width;height=r.height;canvas.width=width*d;canvas.height=height*d;ctx.setTransform(d,0,0,d,0,0);dirty=true}new ResizeObserver(resize).observe(canvas);
function animate(t){let dt=Math.min(.05,(t-last)/1000||0);last=t;if(playing){clock+=dt;let s=clock>=3?1:0;if(s!==step){step=s;update()}if(clock>=6)stop()}if(comparing){clock+=dt;let s=Math.floor(clock/1.5)%2;if(s!==step){step=s;update()}}if(dirty)draw();requestAnimationFrame(animate)}
update();resize();requestAnimationFrame(animate);
