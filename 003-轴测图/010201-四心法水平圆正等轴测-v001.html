<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>四心法：画水平圆的正等轴测图</title>
  <style>
    :root {
      --ink: #101828;
      --muted: #667085;
      --line: #dfe4ea;
      --blue: #1677ff;
      --orange: #f08a24;
      --red: #ef476f;
      --violet: #8854d0;
      --paper: #fff;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
      font-family: "Microsoft YaHei", "微软雅黑", "PingFang SC", Arial, sans-serif;
    }

    button,
    input { font: inherit; }

    .app {
      min-height: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: clamp(10px, 1.6vh, 18px);
      padding: clamp(18px, 2.8vh, 30px) clamp(18px, 3vw, 42px) clamp(16px, 2.2vh, 24px);
      background: #fff;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      max-width: 1480px;
      width: 100%;
      margin: 0 auto;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 2.2vw, 34px);
      line-height: 1.2;
      letter-spacing: -.035em;
      font-weight: 700;
    }

    .stage-readout {
      display: flex;
      align-items: baseline;
      gap: 12px;
      white-space: nowrap;
    }

    .stage-index {
      color: var(--blue);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .12em;
    }

    .stage-title {
      color: var(--muted);
      font-size: 15px;
      font-weight: 600;
    }

    .board {
      position: relative;
      min-height: 0;
      max-width: 1480px;
      width: 100%;
      margin: 0 auto;
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      background: #fff;
    }

    .board::before {
      content: "";
      position: absolute;
      left: 38%;
      top: 4%;
      bottom: 4%;
      width: 1px;
      background: #edf0f3;
      pointer-events: none;
    }

    svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    svg text {
      font-family: "Microsoft YaHei", "微软雅黑", "PingFang SC", Arial, sans-serif;
      user-select: none;
    }

    .view-tag {
      fill: var(--muted);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .12em;
    }

    .source-line,
    .object-line,
    .axis,
    .rhombus,
    .guide-line,
    .radius-line,
    .right-angle {
      vector-effect: non-scaling-stroke;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .source-line { stroke: #27364a; stroke-width: 2.35; }
    .object-line { stroke: #111827; stroke-width: 3; }
    .axis { stroke: var(--orange); stroke-width: 1.6; }
    .rhombus { stroke: var(--blue); stroke-width: 2.05; }
    .guide-line { stroke: var(--blue); stroke-width: 1.7; }
    .radius-line { stroke: var(--orange); stroke-width: 1.55; }
    .right-angle { stroke: var(--blue); stroke-width: 1.7; }

    .axis-label {
      fill: var(--orange);
      font-size: 18px;
      font-weight: 700;
      font-style: italic;
    }

    .point {
      fill: #fff;
      stroke: #e4572e;
      stroke-width: 2.4;
      vector-effect: non-scaling-stroke;
    }

    .center-point {
      fill: var(--red);
      stroke: #fff;
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }

    .point-label {
      fill: #365ec9;
      font-size: 17px;
      font-weight: 700;
      font-style: italic;
    }

    .center-label {
      fill: #e4572e;
      font-size: 15px;
      font-weight: 700;
      font-style: italic;
    }

    .origin-label {
      fill: var(--violet);
      font-size: 17px;
      font-weight: 700;
      font-style: italic;
    }

    [data-show],
    [data-hide] { opacity: 0; }

    .controls {
      max-width: 1480px;
      width: 100%;
      margin: 0 auto;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 18px;
      align-items: center;
    }

    .play {
      width: 46px;
      height: 46px;
      border: 1px solid #cfd6df;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      transition: border-color .18s ease, color .18s ease, background .18s ease;
    }

    .play:hover,
    .play:focus-visible {
      border-color: var(--blue);
      color: var(--blue);
      background: #f7fbff;
      outline: none;
    }

    .play svg { width: 18px; height: 18px; }
    .timeline { min-width: 0; }

    .range-wrap {
      position: relative;
      height: 22px;
      display: flex;
      align-items: center;
    }

    .track,
    .track-fill {
      position: absolute;
      left: 0;
      right: 0;
      top: 10px;
      height: 4px;
      border-radius: 99px;
      pointer-events: none;
    }

    .track { background: #e6eaf0; }
    .track-fill { right: auto; width: 0; background: var(--blue); }

    input[type="range"] {
      position: relative;
      z-index: 2;
      width: 100%;
      margin: 0;
      height: 22px;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      cursor: ew-resize;
    }

    input[type="range"]::-webkit-slider-runnable-track { height: 4px; background: transparent; }
    input[type="range"]::-moz-range-track { height: 4px; background: transparent; }

    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      margin-top: -7px;
      border: 3px solid var(--blue);
      border-radius: 50%;
      background: #fff;
    }

    input[type="range"]::-moz-range-thumb {
      width: 13px;
      height: 13px;
      border: 3px solid var(--blue);
      border-radius: 50%;
      background: #fff;
    }

    input[type="range"]:focus-visible { outline: none; }

    .ticks {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      margin-top: 6px;
    }

    .tick {
      position: relative;
      min-width: 0;
      padding-top: 10px;
      border: 0;
      background: transparent;
      color: #98a2b3;
      font-size: 12px;
      line-height: 1.25;
      text-align: center;
      cursor: pointer;
      transition: color .18s ease;
    }

    .tick::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      transform: translateX(-50%);
      background: #cfd6df;
    }

    .tick:first-child { text-align: left; }
    .tick:first-child::before { left: 0; transform: none; }
    .tick:last-child { text-align: right; }
    .tick:last-child::before { left: auto; right: 0; transform: none; }
    .tick.done,
    .tick.active { color: var(--blue); }
    .tick.done::before,
    .tick.active::before { background: var(--blue); }
    .tick.active { font-weight: 700; }

    @media (max-width: 980px) {
      .tick { font-size: 11px; }
    }

    @media (max-width: 820px) {
      .app { padding-inline: 12px; }
      header { align-items: flex-start; flex-direction: column; gap: 5px; }
      .stage-readout { width: 100%; justify-content: space-between; }
      .board::before { display: none; }
      .controls { grid-template-columns: 40px minmax(0, 1fr); gap: 10px; }
      .play { width: 40px; height: 40px; }
      .tick span { display: none; }
      .tick { min-height: 18px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>四心法：画水平圆的正等轴测图</h1>
      <div class="stage-readout" aria-live="polite">
        <span class="stage-index" id="stageIndex">01 / 08</span>
        <span class="stage-title" id="stageTitle">读取原图</span>
      </div>
    </header>

    <section class="board" aria-label="四心法画水平圆正等轴测图的作图过程">
      <svg viewBox="0 0 1280 650" role="img" aria-labelledby="svgTitle svgDesc" preserveAspectRatio="xMidYMid meet">
        <title id="svgTitle">四心法：画水平圆的正等轴测图</title>
        <desc id="svgDesc">左侧为水平圆及其外切正方形，右侧依次画轴测菱形、四条垂线，确定四个圆心，并用两段大圆弧和两段小圆弧组成近似椭圆。</desc>

        <g id="sourceDrawing">
          <text class="view-tag" x="74" y="77">原图</text>
          <rect class="rhombus" x="90" y="170" width="290" height="290" />
          <circle class="source-line" cx="235" cy="315" r="145" />
        </g>

        <g id="sourceAxes" data-hide="82,88">
          <path class="axis" d="M 68 315 L 405 315 M 235 148 L 235 486" />
          <text class="axis-label" x="397" y="306">X</text>
          <text class="axis-label" x="247" y="481">Y</text>
          <text class="origin-label" x="247" y="338">O</text>
        </g>

        <g id="sourcePoints" data-show="4,10" data-hide="82,88">
          <circle class="point" cx="90" cy="315" r="6.5" />
          <circle class="point" cx="380" cy="315" r="6.5" />
          <circle class="point" cx="235" cy="460" r="6.5" />
          <circle class="point" cx="235" cy="170" r="6.5" />
          <text class="point-label" x="69" y="307">a</text>
          <text class="point-label" x="390" y="307">b</text>
          <text class="point-label" x="245" y="481">c</text>
          <text class="point-label" x="245" y="162">d</text>
        </g>

        <g id="targetAxes" data-show="4,10" data-hide="82,88">
          <path class="axis" d="M 900 315 L 676 444 M 900 315 L 1124 186 M 900 315 L 676 186 M 900 315 L 1124 444 M 900 542 L 900 80" />
          <text class="axis-label" x="1134" y="181">X₁</text>
          <text class="axis-label" x="1134" y="462">Y₁</text>
          <text class="axis-label" x="912" y="95">Z₁</text>
          <text class="origin-label" x="912" y="307">O₁</text>
        </g>

        <g id="targetTangencyPoints" data-show="4,10" data-hide="82,88">
          <circle class="point" cx="730" cy="413" r="6.5" />
          <circle class="point" cx="1070" cy="217" r="6.5" />
          <circle class="point" cx="1070" cy="413" r="6.5" />
          <circle class="point" cx="730" cy="217" r="6.5" />
          <text class="point-label" x="700" y="439">a₁</text>
          <text class="point-label" x="1080" y="210">b₁</text>
          <text class="point-label" x="1080" y="439">c₁</text>
          <text class="point-label" x="700" y="210">d₁</text>
        </g>

        <g id="targetRhombus" data-show="16,22" data-hide="82,88">
          <path class="rhombus" d="M 560 315 L 900 119 L 1240 315 L 900 511 Z" />
          <circle class="center-point" cx="900" cy="119" r="7" />
          <circle class="center-point" cx="900" cy="511" r="7" />
          <text class="center-label" x="912" y="112">O₃</text>
          <text class="center-label" x="912" y="536">O₂</text>
        </g>

        <g id="perpendiculars" data-show="29,35" data-hide="82,88">
          <path class="guide-line" d="M 900 119 L 730 413 M 900 119 L 1070 413 M 900 511 L 730 217 M 900 511 L 1070 217" />
          <path class="right-angle" d="M 737 400 L 724 392 L 716 406 M 1063 400 L 1076 392 L 1084 406 M 737 230 L 724 238 L 716 224 M 1063 230 L 1076 238 L 1084 224" />
        </g>

        <g id="minorCenters" data-show="42,48" data-hide="82,88">
          <circle class="center-point" cx="786.667" cy="315" r="7" />
          <circle class="center-point" cx="1013.333" cy="315" r="7" />
          <text class="center-label" x="756" y="307">O₄</text>
          <text class="center-label" x="1023" y="307">O₅</text>
        </g>

        <g id="majorRadii" data-show="54,58" data-hide="67,73">
          <path class="radius-line" d="M 900 511 L 730 217 M 900 511 L 1070 217 M 900 119 L 730 413 M 900 119 L 1070 413" />
        </g>

        <g id="majorArcs" data-show="54,60">
          <path class="object-line ellipse-arc" d="M 730 217 A 339.482 339.482 0 0 1 1070 217" />
          <path class="object-line ellipse-arc" d="M 1070 413 A 339.482 339.482 0 0 1 730 413" />
        </g>

        <g id="minorRadii" data-show="67,71" data-hide="82,88">
          <path class="radius-line" d="M 786.667 315 L 730 217 M 786.667 315 L 730 413 M 1013.333 315 L 1070 217 M 1013.333 315 L 1070 413" />
        </g>

        <g id="minorArcs" data-show="67,73">
          <path class="object-line ellipse-arc" d="M 730 413 A 113.161 113.161 0 0 1 730 217" />
          <path class="object-line ellipse-arc" d="M 1070 217 A 113.161 113.161 0 0 1 1070 413" />
        </g>
      </svg>
    </section>

    <div class="controls">
      <button class="play" id="playButton" type="button" aria-label="播放作图过程" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path id="playIcon" fill="currentColor" d="M8 5.8v12.4c0 .8.9 1.3 1.6.8l9-6.2a1 1 0 0 0 0-1.6l-9-6.2A1 1 0 0 0 8 5.8Z"/>
        </svg>
      </button>

      <div class="timeline">
        <div class="range-wrap">
          <div class="track"></div>
          <div class="track-fill" id="trackFill"></div>
          <input id="progress" type="range" min="0" max="100" step="0.1" value="0" aria-label="拖动作图时间轴" />
        </div>
        <div class="ticks">
          <button class="tick active" data-value="0" type="button"><span>读取原图</span></button>
          <button class="tick" data-value="10" type="button"><span>确定四个切点</span></button>
          <button class="tick" data-value="22" type="button"><span>画轴测菱形</span></button>
          <button class="tick" data-value="35" type="button"><span>画四条垂线</span></button>
          <button class="tick" data-value="48" type="button"><span>确定小圆弧圆心</span></button>
          <button class="tick" data-value="60" type="button"><span>画两段大圆弧</span></button>
          <button class="tick" data-value="73" type="button"><span>画两段小圆弧</span></button>
          <button class="tick" data-value="88" type="button"><span>整理成图</span></button>
        </div>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const range = document.getElementById('progress');
      const fill = document.getElementById('trackFill');
      const playButton = document.getElementById('playButton');
      const playIcon = document.getElementById('playIcon');
      const stageIndex = document.getElementById('stageIndex');
      const stageTitle = document.getElementById('stageTitle');
      const ticks = [...document.querySelectorAll('.tick')];
      const animated = [...document.querySelectorAll('[data-show], [data-hide]')];
      const sourceOutlines = [...document.querySelectorAll('.source-line')];
      const ellipseArcs = [...document.querySelectorAll('.ellipse-arc')];

      const stages = [
        { at: 0, title: '读取原图' },
        { at: 10, title: '确定四个切点' },
        { at: 22, title: '画轴测菱形' },
        { at: 35, title: '画四条垂线' },
        { at: 48, title: '确定小圆弧圆心' },
        { at: 60, title: '画两段大圆弧' },
        { at: 73, title: '画两段小圆弧' },
        { at: 88, title: '整理成图' }
      ];

      const clamp01 = value => Math.max(0, Math.min(1, value));
      const smooth = value => {
        const t = clamp01(value);
        return t * t * (3 - 2 * t);
      };

      const parsePair = (value, fallbackSpan = 5) => {
        if (!value) return null;
        const parts = value.split(',').map(Number);
        return parts.length > 1 ? parts : [parts[0], parts[0] + fallbackSpan];
      };

      function render(value) {
        const p = Number(value);
        range.value = p;
        fill.style.width = `${p}%`;

        animated.forEach(element => {
          const show = parsePair(element.dataset.show);
          const hide = parsePair(element.dataset.hide);
          let opacity = 1;
          if (show) opacity *= smooth((p - show[0]) / (show[1] - show[0] || 1));
          if (hide) opacity *= 1 - smooth((p - hide[0]) / (hide[1] - hide[0] || 1));
          element.style.opacity = String(clamp01(opacity));
        });

        const finalT = smooth((p - 82) / 6);
        sourceOutlines.forEach(line => {
          line.style.strokeWidth = String(2.35 + (4.8 - 2.35) * finalT);
        });
        ellipseArcs.forEach(arc => {
          arc.style.strokeWidth = String(3 + (5.1 - 3) * finalT);
        });

        let active = 0;
        stages.forEach((stage, index) => { if (p >= stage.at) active = index; });
        stageIndex.textContent = `${String(active + 1).padStart(2, '0')} / 08`;
        stageTitle.textContent = stages[active].title;
        ticks.forEach((tick, index) => {
          tick.classList.toggle('active', index === active);
          tick.classList.toggle('done', index < active);
        });
      }

      let playing = false;
      let animationFrame = 0;
      let lastTime = 0;

      function setPlaying(next) {
        playing = next;
        playButton.setAttribute('aria-pressed', String(next));
        playButton.setAttribute('aria-label', next ? '暂停作图过程' : '播放作图过程');
        playIcon.setAttribute('d', next
          ? 'M7 5.5h3.5v13H7zM13.5 5.5H17v13h-3.5z'
          : 'M8 5.8v12.4c0 .8.9 1.3 1.6.8l9-6.2a1 1 0 0 0 0-1.6l-9-6.2A1 1 0 0 0 8 5.8Z');
        if (next) {
          if (Number(range.value) >= 99.9) render(0);
          lastTime = performance.now();
          animationFrame = requestAnimationFrame(step);
        } else {
          cancelAnimationFrame(animationFrame);
        }
      }

      function step(now) {
        if (!playing) return;
        const delta = now - lastTime;
        lastTime = now;
        const next = Number(range.value) + delta / 110;
        if (next >= 100) {
          render(100);
          setPlaying(false);
          return;
        }
        render(next);
        animationFrame = requestAnimationFrame(step);
      }

      range.addEventListener('input', event => {
        if (playing) setPlaying(false);
        render(event.target.value);
      });
      playButton.addEventListener('click', () => setPlaying(!playing));
      ticks.forEach(tick => tick.addEventListener('click', () => {
        if (playing) setPlaying(false);
        render(tick.dataset.value);
      }));
      window.addEventListener('keydown', event => {
        if (event.code === 'Space') {
          event.preventDefault();
          setPlaying(!playing);
        }
        if (event.code === 'ArrowLeft' || event.code === 'ArrowRight') {
          event.preventDefault();
          if (playing) setPlaying(false);
          const direction = event.code === 'ArrowLeft' ? -1 : 1;
          render(Math.max(0, Math.min(100, Number(range.value) + direction * 2)));
        }
      });
      render(0);
    })();
  </script>
</body>
</html>
