<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>三个体块：先分割底面再取高度</title>
  <style>
    :root {
      --ink: #101828;
      --muted: #667085;
      --line: #dfe4ea;
      --blue: #1677ff;
      --orange: #f08a24;
      --red: #ef476f;
      --green: #20a464;
      --violet: #8854d0;
      --paper: #fff;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
      font-family: "Microsoft YaHei", "微软雅黑", "PingFang SC", Arial, sans-serif;
    }

    button,
    input { font: inherit; }

    .app {
      min-height: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: clamp(10px, 1.6vh, 18px);
      padding: clamp(18px, 2.8vh, 30px) clamp(18px, 3vw, 42px) clamp(16px, 2.2vh, 24px);
      background: #fff;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      max-width: 1480px;
      width: 100%;
      margin: 0 auto;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 2.2vw, 34px);
      line-height: 1.2;
      letter-spacing: -.035em;
      font-weight: 700;
    }

    .stage-readout {
      display: flex;
      align-items: baseline;
      gap: 12px;
      white-space: nowrap;
    }

    .stage-index {
      color: var(--blue);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .12em;
    }

    .stage-title {
      color: var(--muted);
      font-size: 15px;
      font-weight: 600;
    }

    .board {
      position: relative;
      min-height: 0;
      max-width: 1480px;
      width: 100%;
      margin: 0 auto;
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      background: #fff;
    }

    .board::before {
      content: "";
      position: absolute;
      left: 41%;
      top: 4%;
      bottom: 4%;
      width: 1px;
      background: #edf0f3;
      pointer-events: none;
    }

    svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    svg text {
      font-family: "Microsoft YaHei", "微软雅黑", "PingFang SC", Arial, sans-serif;
      user-select: none;
    }

    .view-tag {
      fill: var(--muted);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .12em;
    }

    .source-line,
    .object-line,
    .axis,
    .guide-line,
    .highlight-line {
      vector-effect: non-scaling-stroke;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .source-line { stroke: #27364a; stroke-width: 2.35; }
    .object-line { stroke: #111827; stroke-width: 2.65; }
    .axis { stroke: var(--blue); stroke-width: 1.6; }
    .guide-line { stroke: #98a2b3; stroke-width: 1.35; }
    .highlight-line { stroke-width: 3.1; }
    .orange { stroke: var(--orange); }
    .red { stroke: var(--red); }
    .green { stroke: var(--green); }

    .axis-label {
      fill: var(--blue);
      font-size: 18px;
      font-weight: 700;
      font-style: italic;
    }

    .point {
      fill: #fff;
      stroke: #e4572e;
      stroke-width: 2.4;
      vector-effect: non-scaling-stroke;
    }

    .target-point {
      fill: var(--red);
      stroke: #fff;
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }

    .origin-point {
      fill: #fff;
      stroke: var(--violet);
      stroke-width: 2.4;
      vector-effect: non-scaling-stroke;
    }

    .point-label {
      fill: #e4572e;
      font-size: 16px;
      font-weight: 700;
      font-style: italic;
    }

    .target-label {
      fill: #344054;
      font-size: 17px;
      font-weight: 700;
      font-style: italic;
    }

    .origin-label {
      fill: var(--violet);
      font-size: 16px;
      font-weight: 700;
      font-style: italic;
    }

    [data-draw],
    [data-show],
    [data-hide] { opacity: 0; }

    .controls {
      max-width: 1480px;
      width: 100%;
      margin: 0 auto;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 18px;
      align-items: center;
    }

    .play {
      width: 46px;
      height: 46px;
      border: 1px solid #cfd6df;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      transition: border-color .18s ease, color .18s ease, background .18s ease;
    }

    .play:hover,
    .play:focus-visible {
      border-color: var(--blue);
      color: var(--blue);
      background: #f7fbff;
      outline: none;
    }

    .play svg { width: 18px; height: 18px; }
    .timeline { min-width: 0; }

    .range-wrap {
      position: relative;
      height: 22px;
      display: flex;
      align-items: center;
    }

    .track,
    .track-fill {
      position: absolute;
      left: 0;
      right: 0;
      top: 10px;
      height: 4px;
      border-radius: 99px;
      pointer-events: none;
    }

    .track { background: #e6eaf0; }
    .track-fill { right: auto; width: 0; background: var(--blue); }

    input[type="range"] {
      position: relative;
      z-index: 2;
      width: 100%;
      margin: 0;
      height: 22px;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      cursor: ew-resize;
    }

    input[type="range"]::-webkit-slider-runnable-track { height: 4px; background: transparent; }
    input[type="range"]::-moz-range-track { height: 4px; background: transparent; }

    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      margin-top: -7px;
      border: 3px solid var(--blue);
      border-radius: 50%;
      background: #fff;
    }

    input[type="range"]::-moz-range-thumb {
      width: 13px;
      height: 13px;
      border: 3px solid var(--blue);
      border-radius: 50%;
      background: #fff;
    }

    input[type="range"]:focus-visible { outline: none; }

    .ticks {
      display: grid;
      grid-template-columns: repeat(15, 1fr);
      margin-top: 6px;
    }

    .tick {
      position: relative;
      min-width: 0;
      padding-top: 10px;
      border: 0;
      background: transparent;
      color: #98a2b3;
      font-size: 10.5px;
      line-height: 1.25;
      text-align: center;
      cursor: pointer;
      transition: color .18s ease;
    }

    .tick::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      transform: translateX(-50%);
      background: #cfd6df;
    }

    .tick:first-child { text-align: left; }
    .tick:first-child::before { left: 0; transform: none; }
    .tick:last-child { text-align: right; }
    .tick:last-child::before { left: auto; right: 0; transform: none; }
    .tick.done,
    .tick.active { color: var(--blue); }
    .tick.done::before,
    .tick.active::before { background: var(--blue); }
    .tick.active { font-weight: 700; }

    @media (max-width: 820px) {
      .app { padding-inline: 12px; }
      header { align-items: flex-start; flex-direction: column; gap: 5px; }
      .stage-readout { width: 100%; justify-content: space-between; }
      .board::before { display: none; }
      .controls { grid-template-columns: 40px minmax(0, 1fr); gap: 10px; }
      .play { width: 40px; height: 40px; }
      .tick span { display: none; }
      .tick { min-height: 18px; }
    }
  #projectionSelect{font:inherit;font-size:14px;color:#344054;background:#f8fafc;border:1px solid #dfe4ea;border-radius:8px;padding:8px 12px;cursor:pointer;margin-left:auto}header{flex-wrap:wrap;gap:12px} </style>
</head>

        <div class="ticks"><button class="tick" data-value="0" type="button"><span>读取正投影图</span></button><button class="tick" data-value="12" type="button"><span>画总包围矩形</span></button><button class="tick" data-value="20" type="button"><span>沿 X 分段</span></button><button class="tick" data-value="28" type="button"><span>作 Y 向平行线</span></button><button class="tick" data-value="35" type="button"><span>沿 Y 分段</span></button><button class="tick" data-value="44" type="button"><span>作 X 向平行线</span></button><button class="tick" data-value="50" type="button"><span>圈第一块底面</span></button><button class="tick" data-value="56" type="button"><span>圈低体块底面</span></button><button class="tick" data-value="62" type="button"><span>圈第三块底面</span></button><button class="tick" data-value="70" type="button"><span>取第一块高度</span></button><button class="tick" data-value="78" type="button"><span>取低体块高度</span></button><button class="tick" data-value="86" type="button"><span>取第三块高度</span></button><button class="tick" data-value="92" type="button"><span>描可见轮廓</span></button><button class="tick" data-value="98" type="button"><span>擦除辅助线</span></button><button class="tick" data-value="100" type="button"><span>整理成图</span></button></div>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const range = document.getElementById('progress');
      const fill = document.getElementById('trackFill');
      const playButton = document.getElementById('playButton');
      const playIcon = document.getElementById('playIcon');
      const stageIndex = document.getElementById('stageIndex');
      const stageTitle = document.getElementById('stageTitle');
      const ticks = [...document.querySelectorAll('.tick')];
      const animated = [...document.querySelectorAll('[data-show], [data-hide]')];
      const sourceOutlines = [...document.querySelectorAll('.source-line')];
      let objectOutlines = [...document.querySelectorAll('.object-line')];

      const stages = [{"at": 0, "title": "读取正投影图", "note": "先从俯视图确定三个体块的位置，再从正视图读取高度。", "hint": "底面不凭目测摆放，所有角点先用两组平行线定位。"}, {"at": 3, "title": "画总包围矩形", "note": "在俯视图外包一个 L × W 矩形，先画它的轴测底面。", "hint": "从 O 沿 X 取 L、沿 Y 取 W，再作平行线闭合；不必是正方形。"}, {"at": 14, "title": "沿 X 分段", "note": "读取各竖向边界距左边的 x₁、x₂、x₃、x₄。", "hint": "从轴测原点 O 沿 X 轴按相同比例取这些距离。"}, {"at": 21, "title": "作 Y 向平行线", "note": "过每个 X 分点作平行 Y 轴的线，贯穿总包围矩形。", "hint": "每条线上所有点的 X 坐标相同。"}, {"at": 29, "title": "沿 Y 分段", "note": "读取各横向边界距上边的 y₁、y₂、y₃。", "hint": "从 O 沿 Y 轴按相同比例取这些距离。"}, {"at": 36, "title": "作 X 向平行线", "note": "过每个 Y 分点作平行 X 轴的线，与前一组线相交。", "hint": "交点 (xᵢ, yⱼ, 0) 就是可用的底面定位点。"}, {"at": 45, "title": "圈第一块底面", "note": "取 X = 0、x₂ 与 Y = 0、y₂ 围成的四个交点。", "hint": "按顺序连接，确定第一块的底面。"}, {"at": 51, "title": "圈低体块底面", "note": "取 X = x₁、x₄ 与 Y = y₁、y₃ 围成的四个交点。", "hint": "与其他体块重叠的底面先保留，整理时再处理遮挡。"}, {"at": 57, "title": "圈第三块底面", "note": "取 X = x₃、L 与 Y = y₂、W 围成的四个交点。", "hint": "三个底面的全部顶点都已由平面分割确定。"}, {"at": 64, "title": "取第一块高度", "note": "从第一块底面各角沿 Z 轴取正视图中的 h₁，再连接顶面。", "hint": "底点 (x,y,0) 对应顶点 (x,y,h₁)，平面位置不变。"}, {"at": 72, "title": "取低体块高度", "note": "从低体块底面各角沿 Z 轴取 h₂，再连接顶面。", "hint": "高度必须从共同底面起量。"}, {"at": 80, "title": "取第三块高度", "note": "从第三块底面各角沿 Z 轴取 h₃，再连接顶面。", "hint": "所有竖棱互相平行，各自高度来自正视图。"}, {"at": 88, "title": "描可见轮廓", "note": "按前后遮挡描实组合体的可见棱线。", "hint": "相交处只保留实际轮廓，不把被挡住的底面画成实线。"}, {"at": 93, "title": "擦除辅助线", "note": "擦除总包围矩形、分割线和被遮挡的辅助棱线。", "hint": "保留三个体块形成的完整可见轮廓。"}, {"at": 99, "title": "整理成图", "note": "底面来自平面分割交点，高度来自正视图。", "hint": "同轴方向始终平行；三个方向按相同的比例取长。"}];

      const clamp01 = value => Math.max(0, Math.min(1, value));
      const smooth = value => {
        const t = clamp01(value);
        return t * t * (3 - 2 * t);
      };

      const parsePair = (value, fallbackSpan = 5) => {
        if (!value) return null;
        const parts = value.split(',').map(Number);
        return parts.length > 1 ? parts : [parts[0], parts[0] + fallbackSpan];
      };

      function render(value) {
        const p = Number(value);
        range.value = p;
        fill.style.width = `${p}%`;

        animated.forEach(element => {
          const show = parsePair(element.dataset.show);
          const hide = parsePair(element.dataset.hide);
          let opacity = 1;
          if (show) opacity *= smooth((p - show[0]) / (show[1] - show[0] || 1));
          if (hide) opacity *= 1 - smooth((p - hide[0]) / (hide[1] - hide[0] || 1));
          element.style.opacity = String(clamp01(opacity));
        });

        document.querySelectorAll('[data-draw]').forEach(line => {
          const [a,b] = line.dataset.draw.split(',').map(Number);
          const draw = smooth((p-a)/(b-a));
          let erase = 0;
          if (line.dataset.erase) {
            const [c,d] = line.dataset.erase.split(',').map(Number);
            erase = smooth((p-c)/(d-c));
          }
          const length = Math.max(0,draw-erase);
          line.style.strokeDasharray = length >= 0.99999 ? 'none' : `${length} 2`;
          line.style.strokeDashoffset = String(-erase);
          line.style.opacity = length > 0.00001 ? '1' : '0';
          line.style.stroke = p > a && p < b ? '#f08a24' : '';
        });
        const finalT = smooth((p - 90) / 10);
        sourceOutlines.forEach(line => {
          line.style.strokeWidth = String(2.35 + (2.8 - 2.35) * finalT);
        });
        objectOutlines.forEach(line => {
          line.style.strokeWidth = String(2.65 + (3.15 - 2.65) * finalT);
        });

        let active = 0;
        stages.forEach((stage, index) => { if (p >= stage.at) active = index; });
        stageIndex.textContent = `${String(active + 1).padStart(2, '0')} / 15`;
        stageTitle.textContent = stages[active].title;
        document.getElementById('stepNote').textContent = stages[active].note;
        document.getElementById('stepHint').textContent = stages[active].hint;
        ticks.forEach((tick, index) => {
          tick.classList.toggle('active', index === active);
          tick.classList.toggle('done', index < active);
        });
      }

      let playing = false;
      let animationFrame = 0;
      let lastTime = 0;
      let playbackValue = 0;

      function setPlaying(next) {
        playing = next;
        playButton.setAttribute('aria-pressed', String(next));
        playButton.setAttribute('aria-label', next ? '暂停作图过程' : '播放作图过程');
        playIcon.setAttribute('d', next
          ? 'M7 5.5h3.5v13H7zM13.5 5.5H17v13h-3.5z'
          : 'M8 5.8v12.4c0 .8.9 1.3 1.6.8l9-6.2a1 1 0 0 0 0-1.6l-9-6.2A1 1 0 0 0 8 5.8Z');
        if (next) {
          if (Number(range.value) >= 99.9) render(0);
          playbackValue = Number(range.value);
          lastTime = performance.now();
          animationFrame = requestAnimationFrame(step);
        } else {
          cancelAnimationFrame(animationFrame);
        }
      }

      function step(now) {
        if (!playing) return;
        const delta = now - lastTime;
        lastTime = now;
        const next = playbackValue + Math.min(delta, 80) / 420;
        playbackValue = next;
        if (next >= 100) {
          render(100);
          setPlaying(false);
          return;
        }
        render(next);
        animationFrame = requestAnimationFrame(step);
      }

      range.addEventListener('input', event => {
        if (playing) setPlaying(false);
        render(event.target.value);
      });
      playButton.addEventListener('click', () => setPlaying(!playing));
      ticks.forEach(tick => tick.addEventListener('click', () => {
        if (playing) setPlaying(false);
        render(tick.dataset.value);
      }));
      window.addEventListener('keydown', event => {
        if (event.target.closest('select')) return;
        if (event.code === 'Space') {
          event.preventDefault();
          setPlaying(!playing);
        }
        if (event.code === 'ArrowLeft' || event.code === 'ArrowRight') {
          event.preventDefault();
          if (playing) setPlaying(false);
          const direction = event.code === 'ArrowLeft' ? -1 : 1;
          render(Math.max(0, Math.min(100, Number(range.value) + direction * 2)));
        }
      });
      const selector = document.getElementById('projectionSelect');
      const drawing = document.getElementById('drawing');
      const boxes = [[0,44,0,30,0,56],[26,81,18,52,0,11],[69,94,30,69,0,35]];
      const grids = [[0,26,44,69,81,94],[0,18,30,52,69],[0,11,35,56]];
      const inside = p => boxes.some(b => p.every((n,i) => n>b[2*i]+1e-6 && n<b[2*i+1]-1e-6));
      const edgeMap = new Map();
      for(let i=0;i<5;i++)for(let j=0;j<4;j++)for(let k=0;k<3;k++){
        const idx=[i,j,k],lo=idx.map((n,d)=>grids[d][n]),hi=idx.map((n,d)=>grids[d][n+1]);
        const mid=lo.map((n,d)=>(n+hi[d])/2); if(!inside(mid))continue;
        for(let axis=0;axis<3;axis++)for(const sign of [-1,1]){
          const test=mid.slice();test[axis]=(sign<0?lo[axis]:hi[axis])+sign*.001;if(inside(test))continue;
          const other=[0,1,2].filter(d=>d!==axis),corners=[];
          for(const [u,v] of [[0,0],[1,0],[1,1],[0,1]]){
            const p=lo.slice();p[axis]=sign<0?lo[axis]:hi[axis];p[other[0]]=u?hi[other[0]]:lo[other[0]];p[other[1]]=v?hi[other[1]]:lo[other[1]];corners.push(p);
          }
          for(let n=0;n<4;n++){
            let a=corners[n],b=corners[(n+1)%4];if(a.join(',')>b.join(','))[a,b]=[b,a];
            const key=a.join(',')+'|'+b.join(',');if(!edgeMap.has(key))edgeMap.set(key,{a,b,normals:new Set()});edgeMap.get(key).normals.add(axis+':'+sign);
          }
        }
      }
      const edges=[...edgeMap.values()].filter(e=>e.normals.size>1);
      function visible(p,view){
        return !boxes.some(b=>{
          let low=1e-5,high=Infinity;
          for(let d=0;d<3;d++){
            if(Math.abs(view[d])<1e-9){if(p[d]<=b[2*d]+1e-7||p[d]>=b[2*d+1]-1e-7)return false;continue;}
            let a=(b[2*d]+1e-7-p[d])/view[d],c=(b[2*d+1]-1e-7-p[d])/view[d];
            low=Math.max(low,Math.min(a,c));high=Math.min(high,Math.max(a,c));
          }
          return high>low;
        });
      }
      function applyProjection(){
        const q=Math.SQRT1_2, c=Math.sqrt(3)/2;
        const bases={iso:[[c,.5],[c,-.5]],cavalier:[[1,0],[q,-q]],military:[[q,q],[q,-q]],horizontal:[[c,.5],[.5,-c]]};
        const [x,y]=bases[selector.value];
        const raw=p=>[x[0]*p[0]+y[0]*p[1],x[1]*p[0]+y[1]*p[1]-p[2]];
        const corners=[];for(const a of [0,99])for(const b of [0,74])for(const z of [0,56])corners.push(raw([a,b,z]));
        const min=corners[0].map((_,d)=>Math.min(...corners.map(p=>p[d]))),max=min.map((_,d)=>Math.max(...corners.map(p=>p[d])));
        const scale=Math.min(580/(max[0]-min[0]),440/(max[1]-min[1]));
        const project=p=>{const v=raw(p);return [895+(v[0]-(min[0]+max[0])/2)*scale,325+(v[1]-(min[1]+max[1])/2)*scale];};
        drawing.querySelectorAll('[data-xyz]').forEach(e=>e.setAttribute('d',JSON.parse(e.dataset.xyz).map((p,i)=>(i?'L ':'M ')+project(p).join(' ')).join(' ')));
        drawing.querySelectorAll('[data-point]').forEach(e=>{const p=project(JSON.parse(e.dataset.point)),o=JSON.parse(e.dataset.offset||'[0,0]');e.setAttribute(e.tagName==='circle'?'cx':'x',p[0]+o[0]);e.setAttribute(e.tagName==='circle'?'cy':'y',p[1]+o[1]);});
        drawing.querySelectorAll('.object-line').forEach(e=>e.remove());
        const view=[y[0],-x[0],x[1]*y[0]-y[1]*x[0]];
        const segments=[];
        edges.forEach(({a,b})=>{
          const at=t=>a.map((n,d)=>n+(b[d]-n)*t);
          let start=null;
          const N=160;
          for(let i=0;i<N;i++){
            const ok=visible(at((i+.5)/N),view);
            if(ok&&start===null)start=i/N;
            if(start!==null&&(!ok||i===N-1)){
              let end=ok?1:i/N;
              if(start>0){let l=start-.5/N,r=start+.5/N;for(let n=0;n<20;n++){let m=(l+r)/2;if(visible(at(m),view))r=m;else l=m;}start=(l+r)/2;}
              if(end<1){let l=end-.5/N,r=end+.5/N;for(let n=0;n<20;n++){let m=(l+r)/2;if(visible(at(m),view))l=m;else r=m;}end=(l+r)/2;}
              segments.push([at(start),at(end)]);start=null;
            }
          }
        });
        segments.forEach(([a,b],i)=>{const e=document.createElementNS('http://www.w3.org/2000/svg','path');e.setAttribute('class','object-line');e.setAttribute('d','M '+project(a).join(' ')+' L '+project(b).join(' '));e.setAttribute('pathLength','1');e.dataset.draw=[88+4*i/segments.length,88+4*(i+1)/segments.length].join(',');drawing.append(e);});
        objectOutlines=[...drawing.querySelectorAll('.object-line')];
        document.getElementById('projectionTitle').textContent=selector.selectedOptions[0].textContent;
        document.querySelector('.board').setAttribute('aria-label','三个高低体块：'+selector.selectedOptions[0].textContent);
        render(range.value);
      }
      selector.addEventListener('change',applyProjection);

      applyProjection();
      render(0);
    })();
  </script>
</body>
</html>
