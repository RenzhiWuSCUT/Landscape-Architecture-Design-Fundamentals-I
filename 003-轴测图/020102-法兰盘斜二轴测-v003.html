  <script>
    (()=>{const range=document.getElementById('progress'),fill=document.getElementById('trackFill'),playButton=document.getElementById('playButton'),playIcon=document.getElementById('playIcon'),stageIndex=document.getElementById('stageIndex'),stageTitle=document.getElementById('stageTitle'),ticks=[...document.querySelectorAll('.tick')],animated=[...document.querySelectorAll('[data-show],[data-hide]')],finalLines=[...document.querySelectorAll('.final-line')],sourceLines=[...document.querySelectorAll('.source-line')];
