<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>切割法：画组合体的正等轴测图</title>
  <style>
    :root {
      --ink: #101828;
      --muted: #667085;
      --line: #dfe4ea;
      --blue: #1677ff;
      --orange: #f08a24;
      --red: #ef476f;
      --green: #20a464;
      --violet: #8854d0;
      --paper: #fff;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
      font-family: "Microsoft YaHei", "微软雅黑", "PingFang SC", Arial, sans-serif;
    }

    button,
    input { font: inherit; }

    .app {
      min-height: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: clamp(10px, 1.6vh, 18px);
      padding: clamp(18px, 2.8vh, 30px) clamp(18px, 3vw, 42px) clamp(16px, 2.2vh, 24px);
      background: #fff;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      max-width: 1480px;
      width: 100%;
      margin: 0 auto;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 2.2vw, 34px);
      line-height: 1.2;
      letter-spacing: -.035em;
      font-weight: 700;
    }

    .stage-readout {
      display: flex;
      align-items: baseline;
      gap: 12px;
      white-space: nowrap;
    }

    .stage-index {
      color: var(--blue);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .12em;
    }

    .stage-title {
      color: var(--muted);
      font-size: 15px;
      font-weight: 600;
    }

    .board {
      position: relative;
      min-height: 0;
      max-width: 1480px;
      width: 100%;
      margin: 0 auto;
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      background: #fff;
    }

    .board::before {
      content: "";
      position: absolute;
      left: 41%;
      top: 4%;
      bottom: 4%;
      width: 1px;
      background: #edf0f3;
      pointer-events: none;
    }

    svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    svg text {
      font-family: "Microsoft YaHei", "微软雅黑", "PingFang SC", Arial, sans-serif;
      user-select: none;
    }

    .view-tag {
      fill: var(--muted);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .12em;
    }

    .source-line,
    .object-line,
    .axis,
    .guide-line,
    .highlight-line {
      vector-effect: non-scaling-stroke;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .source-line { stroke: #27364a; stroke-width: 2.35; }
    .object-line { stroke: #111827; stroke-width: 2.65; }
    .axis { stroke: var(--blue); stroke-width: 1.6; }
    .guide-line { stroke: #98a2b3; stroke-width: 1.35; }
    .highlight-line { stroke-width: 3.1; }
    .orange { stroke: var(--orange); }
    .red { stroke: var(--red); }
    .green { stroke: var(--green); }

    .axis-label {
      fill: var(--blue);
      font-size: 18px;
      font-weight: 700;
      font-style: italic;
    }

    .point {
      fill: #fff;
      stroke: #e4572e;
      stroke-width: 2.4;
      vector-effect: non-scaling-stroke;
    }

    .target-point {
      fill: var(--red);
      stroke: #fff;
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }

    .origin-point {
      fill: #fff;
      stroke: var(--violet);
      stroke-width: 2.4;
      vector-effect: non-scaling-stroke;
    }

    .point-label {
      fill: #e4572e;
      font-size: 16px;
      font-weight: 700;
      font-style: italic;
    }

    .target-label {
      fill: #344054;
      font-size: 17px;
      font-weight: 700;
      font-style: italic;
    }

    .origin-label {
      fill: var(--violet);
      font-size: 16px;
      font-weight: 700;
      font-style: italic;
    }

    [data-draw],
    [data-show],
    [data-hide] { opacity: 0; }

    .controls {
      max-width: 1480px;
      width: 100%;
      margin: 0 auto;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 18px;
      align-items: center;
    }

    .play {
      width: 46px;
      height: 46px;
      border: 1px solid #cfd6df;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      transition: border-color .18s ease, color .18s ease, background .18s ease;
    }

    .play:hover,
    .play:focus-visible {
      border-color: var(--blue);
      color: var(--blue);
      background: #f7fbff;
      outline: none;
    }

    .play svg { width: 18px; height: 18px; }
    .timeline { min-width: 0; }

    .range-wrap {
      position: relative;
      height: 22px;
      display: flex;
      align-items: center;
    }

    .track,
    .track-fill {
      position: absolute;
      left: 0;
      right: 0;
      top: 10px;
      height: 4px;
      border-radius: 99px;
      pointer-events: none;
    }

    .track { background: #e6eaf0; }
    .track-fill { right: auto; width: 0; background: var(--blue); }

    input[type="range"] {
      position: relative;
      z-index: 2;
      width: 100%;
      margin: 0;
      height: 22px;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      cursor: ew-resize;
    }

    input[type="range"]::-webkit-slider-runnable-track { height: 4px; background: transparent; }
    input[type="range"]::-moz-range-track { height: 4px; background: transparent; }

    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      margin-top: -7px;
      border: 3px solid var(--blue);
      border-radius: 50%;
      background: #fff;
    }

    input[type="range"]::-moz-range-thumb {
      width: 13px;
      height: 13px;
      border: 3px solid var(--blue);
      border-radius: 50%;
      background: #fff;
    }

    input[type="range"]:focus-visible { outline: none; }

    .ticks {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      margin-top: 6px;
    }

    .tick {
      position: relative;
      min-width: 0;
      padding-top: 10px;
      border: 0;
      background: transparent;
      color: #98a2b3;
      font-size: 12px;
      line-height: 1.25;
      text-align: center;
      cursor: pointer;
      transition: color .18s ease;
    }

    .tick::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      transform: translateX(-50%);
      background: #cfd6df;
    }

    .tick:first-child { text-align: left; }
    .tick:first-child::before { left: 0; transform: none; }
    .tick:last-child { text-align: right; }
    .tick:last-child::before { left: auto; right: 0; transform: none; }
    .tick.done,
    .tick.active { color: var(--blue); }
    .tick.done::before,
    .tick.active::before { background: var(--blue); }
    .tick.active { font-weight: 700; }

    @media (max-width: 820px) {
      .app { padding-inline: 12px; }
      header { align-items: flex-start; flex-direction: column; gap: 5px; }
      .stage-readout { width: 100%; justify-content: space-between; }
      .board::before { display: none; }
      .controls { grid-template-columns: 40px minmax(0, 1fr); gap: 10px; }
      .play { width: 40px; height: 40px; }
      .tick span { display: none; }
      .tick { min-height: 18px; }
    }
  .projection-control{display:flex;align-items:center;gap:8px;font-size:13px;color:#667085;white-space:nowrap}.projection-control select{font:inherit;color:#344054;background:#fff;border:1px solid #dfe4ea;border-radius:7px;padding:8px;max-width:100%}header{flex-wrap:wrap;gap:10px 20px}h1{font-size:clamp(21px,2vw,30px)}@media(max-width:700px){.projection-control{width:100%}.projection-control select{min-width:0;flex:1}}
</style>

        <g id="axisAngles" data-show="3,4" data-hide="18,20" aria-label="轴间角"><circle cx="1110" cy="130" r="2.3" fill="#ed8b33"/><path d="M1110 130L1147.24 108.50" fill="none" stroke="#dc862f" stroke-width="1.3"/><text x="1156.77" y="107.00" text-anchor="start" fill="#c17128" font-size="13" font-weight="600">X</text><path d="M1110 130L1110.00 173.00" fill="none" stroke="#dc862f" stroke-width="1.3"/><text x="1110.00" y="188.00" text-anchor="middle" fill="#c17128" font-size="13" font-weight="600">Z</text><path d="M1110 130L1072.76 108.50" fill="none" stroke="#dc862f" stroke-width="1.3"/><text x="1063.23" y="107.00" text-anchor="end" fill="#c17128" font-size="13" font-weight="600">Y</text><path d="M1110.00 152.00L1108.08 151.92L1106.18 151.67L1104.31 151.25L1102.48 150.67L1100.70 149.94L1099.00 149.05L1097.38 148.02L1095.86 146.85L1094.44 145.56L1093.15 144.14L1091.98 142.62L1090.95 141.00L1090.06 139.30L1089.33 137.52L1088.75 135.69L1088.33 133.82L1088.08 131.92L1088.00 130.00L1088.08 128.08L1088.33 126.18L1088.75 124.31L1089.33 122.48L1090.06 120.70L1090.95 119.00" fill="none" stroke="#e3a96e" stroke-width="1.15"/><text x="1078.82" y="151.00" text-anchor="middle" fill="#a66327" font-size="11.2" font-weight="600">120°</text><path d="M1090.95 119.00L1091.98 117.38L1093.15 115.86L1094.44 114.44L1095.86 113.15L1097.38 111.98L1099.00 110.95L1100.70 110.06L1102.48 109.33L1104.31 108.75L1106.18 108.33L1108.08 108.08L1110.00 108.00L1111.92 108.08L1113.82 108.33L1115.69 108.75L1117.52 109.33L1119.30 110.06L1121.00 110.95L1122.62 111.98L1124.14 113.15L1125.56 114.44L1126.85 115.86L1128.02 117.38L1129.05 119.00" fill="none" stroke="#e3a96e" stroke-width="1.15"/><text x="1110.00" y="97.00" text-anchor="middle" fill="#a66327" font-size="11.2" font-weight="600">120°</text><path d="M1129.05 119.00L1129.94 120.70L1130.67 122.48L1131.25 124.31L1131.67 126.18L1131.92 128.08L1132.00 130.00L1131.92 131.92L1131.67 133.82L1131.25 135.69L1130.67 137.52L1129.94 139.30L1129.05 141.00L1128.02   <script>
    (() => {
      const range = document.getElementById('progress');
      const fill = document.getElementById('trackFill');
      const playButton = document.getElementById('playButton');
      const playIcon = document.getElementById('playIcon');
      const stageIndex = document.getElementById('stageIndex');
      const stageTitle = document.getElementById('stageTitle');
      const ticks = [...document.querySelectorAll('.tick')];
      const animated = [...document.querySelectorAll('[data-show], [data-hide]')];
      const sourceOutlines = [...document.querySelectorAll('.source-line')];
      const objectOutlines = [...document.querySelectorAll('.object-line')];

      const stages = [{at:0,title:"读取三视图"},{at:4,title:"画包围盒"},{at:20,title:"画第一处轮廓"},{at:34,title:"擦除多余线"},{at:50,title:"画斜面轮廓"},{at:64,title:"擦除多余线"},{at:78,title:"擦除辅助线"},{at:92,title:"整理成图"}];

      const clamp01 = value => Math.max(0, Math.min(1, value));
      const smooth = value => {
        const t = clamp01(value);
        return t * t * (3 - 2 * t);
      };

      const parsePair = (value, fallbackSpan = 5) => {
        if (!value) return null;
        const parts = value.split(',').map(Number);
        return parts.length > 1 ? parts : [parts[0], parts[0] + fallbackSpan];
      };

      function render(value) {
        const p = Number(value);
        range.value = p;
        fill.style.width = `${p}%`;

        animated.forEach(element => {
          const show = parsePair(element.dataset.show);
          const hide = parsePair(element.dataset.hide);
          let opacity = 1;
          if (show) opacity *= smooth((p - show[0]) / (show[1] - show[0] || 1));
          if (hide) opacity *= 1 - smooth((p - hide[0]) / (hide[1] - hide[0] || 1));
          element.style.opacity = String(clamp01(opacity));
        });

        document.querySelectorAll('[data-draw]').forEach(line => {
          const [a,b] = line.dataset.draw.split(',').map(Number);
          const draw = smooth((p-a)/(b-a));
          let erase = 0;
          if (line.dataset.erase) {
            const [c,d] = line.dataset.erase.split(',').map(Number);
            erase = smooth((p-c)/(d-c));
          }
          const length = Math.max(0,draw-erase);
          line.style.strokeDasharray = length >= 0.99999 ? 'none' : `${length} 2`;
          line.style.strokeDashoffset = String(-erase);
          line.style.opacity = length > 0.00001 ? '1' : '0';
          line.style.stroke = p > a && p < b ? '#f08a24' : '';
        });
        const finalT = smooth((p - 90) / 10);
        sourceOutlines.forEach(line => {
          line.style.strokeWidth = String(2.35 + (2.8 - 2.35) * finalT);
        });
        objectOutlines.forEach(line => {
          line.style.strokeWidth = String(2.65 + (3.15 - 2.65) * finalT);
        });

        let active = 0;
        stages.forEach((stage, index) => { if (p >= stage.at) active = index; });

        stageTitle.textContent = stages[active].title;
        ticks.forEach((tick, index) => {
          tick.classList.toggle('active', index === active);
          tick.classList.toggle('done', index < active);
        });
      }

      let playing = false;
      let animationFrame = 0;
      let lastTime = 0;
      let playbackValue = 0;

      function setPlaying(next) {
        playing = next;
        playButton.setAttribute('aria-pressed', String(next));
        playButton.setAttribute('aria-label', next ? '暂停作图过程' : '播放作图过程');
        playIcon.setAttribute('d', next

        if (next) {
          if (Number(range.value) >= 99.9) render(0);
          playbackValue = Number(range.value);
          lastTime = performance.now();
          animationFrame = requestAnimationFrame(step);
        } else {
          cancelAnimationFrame(animationFrame);
        }
      }

      function step(now) {
        if (!playing) return;
        const delta = now - lastTime;
        lastTime = now;
        const next = playbackValue + Math.min(delta, 80) / 220;
        playbackValue = next;
        if (next >= 100) {
          render(100);
          setPlaying(false);
          return;
        }
        render(next);
        animationFrame = requestAnimationFrame(step);
      }

      range.addEventListener('input', event => {
        if (playing) setPlaying(false);
        render(event.target.value);
      });
      playButton.addEventListener('click', () => setPlaying(!playing));
      ticks.forEach(tick => tick.addEventListener('click', () => {
        if (playing) setPlaying(false);
        render(tick.dataset.value);
      }));
      window.addEventListener('keydown', event => {
if(event.target.matches('select'))return;
        if (event.code === 'Space') {
          event.preventDefault();
          setPlaying(!playing);
        }
        if (event.code === 'ArrowLeft' || event.code === 'ArrowRight') {
          event.preventDefault();
          if (playing) setPlaying(false);
          const direction = event.code === 'ArrowLeft' ? -1 : 1;
          render(Math.max(0, Math.min(100, Number(range.value) + direction * 2)));
        }
      });
      render(0);
    })();
