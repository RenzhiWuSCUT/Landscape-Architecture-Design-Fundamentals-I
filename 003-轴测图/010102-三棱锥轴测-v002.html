<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>坐标法：画三棱锥的轴测图</title>
  <style>
    :root {
      --ink: #101828;
      --muted: #667085;
      --line: #dfe4ea;
      --blue: #1677ff;
      --orange: #f08a24;
      --red: #ef476f;
      --green: #20a464;
      --violet: #8854d0;
      --paper: #fff;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
      font-family: "Microsoft YaHei", "微软雅黑", "PingFang SC", Arial, sans-serif;
    }

    button,
    input { font: inherit; }

    .app {
      min-height: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: clamp(10px, 1.6vh, 18px);
      padding: clamp(18px, 2.8vh, 30px) clamp(18px, 3vw, 42px) clamp(16px, 2.2vh, 24px);
      background: #fff;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      max-width: 1480px;
      width: 100%;
      margin: 0 auto;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 2.2vw, 34px);
      line-height: 1.2;
      letter-spacing: -.035em;
      font-weight: 700;
    }

    .stage-readout {
      display: flex;
      align-items: baseline;
      gap: 12px;
      white-space: nowrap;
    }

    .stage-index {
      color: var(--blue);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .12em;
    }

    .stage-title {
      color: var(--muted);
      font-size: 15px;
      font-weight: 600;
    }

    .board {
      position: relative;
      min-height: 0;
      max-width: 1480px;
      width: 100%;
      margin: 0 auto;
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      background: #fff;
    }

    .board::before {
      content: "";
      position: absolute;
      left: 41%;
      top: 4%;
      bottom: 4%;
      width: 1px;
      background: #edf0f3;
      pointer-events: none;
    }

    svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    svg text {
      font-family: "Microsoft YaHei", "微软雅黑", "PingFang SC", Arial, sans-serif;
      user-select: none;
    }

    .view-tag {
      fill: var(--muted);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .12em;
    }

    .source-line,
    .object-line,
    .axis,
    .guide-line,
    .highlight-line {
      vector-effect: non-scaling-stroke;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .source-line { stroke: #27364a; stroke-width: 2.35; }
    .object-line { stroke: #111827; stroke-width: 2.65; }
    .axis { stroke: var(--blue); stroke-width: 1.6; }
    .guide-line { stroke: #98a2b3; stroke-width: 1.35; }
    .highlight-line { stroke-width: 3.1; }
    .orange { stroke: var(--orange); }
    .red { stroke: var(--red); }
    .green { stroke: var(--green); }

    .axis-label {
      fill: var(--blue);
      font-size: 18px;
      font-weight: 700;
      font-style: italic;
    }

    .point {
      fill: #fff;
      stroke: #e4572e;
      stroke-width: 2.4;
      vector-effect: non-scaling-stroke;
    }

    .target-point {
      fill: var(--red);
      stroke: #fff;
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }

    .origin-point {
      fill: #fff;
      stroke: var(--violet);
      stroke-width: 2.4;
      vector-effect: non-scaling-stroke;
    }

    .point-label {
      fill: #e4572e;
      font-size: 16px;
      font-weight: 700;
      font-style: italic;
    }

    .target-label {
      fill: #344054;
      font-size: 17px;
      font-weight: 700;
      font-style: italic;
    }

    .origin-label {
      fill: var(--violet);
      font-size: 16px;
      font-weight: 700;
      font-style: italic;
    }

    [data-show],
    [data-hide] { opacity: 0; }

    .controls {
      max-width: 1480px;
      width: 100%;
      margin: 0 auto;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 18px;
      align-items: center;
    }

    .play {
      width: 46px;
      height: 46px;
      border: 1px solid #cfd6df;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      transition: border-color .18s ease, color .18s ease, background .18s ease;
    }

    .play:hover,
    .play:focus-visible {
      border-color: var(--blue);
      color: var(--blue);
      background: #f7fbff;
      outline: none;
    }

    .play svg { width: 18px; height: 18px; }
    .timeline { min-width: 0; }

    .range-wrap {
      position: relative;
      height: 22px;
      display: flex;
      align-items: center;
    }

    .track,
    .track-fill {
      position: absolute;
      left: 0;
      right: 0;
      top: 10px;
      height: 4px;
      border-radius: 99px;
      pointer-events: none;
    }

    .track { background: #e6eaf0; }
    .track-fill { right: auto; width: 0; background: var(--blue); }

    input[type="range"] {
      position: relative;
      z-index: 2;
      width: 100%;
      margin: 0;
      height: 22px;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      cursor: ew-resize;
    }

    input[type="range"]::-webkit-slider-runnable-track { height: 4px; background: transparent; }
    input[type="range"]::-moz-range-track { height: 4px; background: transparent; }

    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      margin-top: -7px;
      border: 3px solid var(--blue);
      border-radius: 50%;
      background: #fff;
    }

    input[type="range"]::-moz-range-thumb {
      width: 13px;
      height: 13px;
      border: 3px solid var(--blue);
      border-radius: 50%;
      background: #fff;
    }

    input[type="range"]:focus-visible { outline: none; }

    .ticks {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      margin-top: 6px;
    }

    .tick {
      position: relative;
      min-width: 0;
      padding-top: 10px;
      border: 0;
      background: transparent;
      color: #98a2b3;
      font-size: 12px;
      line-height: 1.25;
      text-align: center;
      cursor: pointer;
      transition: color .18s ease;
    }

    .tick::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      transform: translateX(-50%);
      background: #cfd6df;
    }

    .tick:first-child { text-align: left; }
    .tick:first-child::before { left: 0; transform: none; }
    .tick:last-child { text-align: right; }
    .tick:last-child::before { left: auto; right: 0; transform: none; }
    .tick.done,
    .tick.active { color: var(--blue); }
    .tick.done::before,
    .tick.active::before { background: var(--blue); }
    .tick.active { font-weight: 700; }


    .projection-control {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }
    .projection-control select {
      min-width: 270px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: #344054;
      font: inherit;
      outline: none;
    }
    .projection-control select:focus { border-color: var(--blue); }
    header { flex-wrap: wrap; gap: 10px 18px; }
    .projection-caption {
      fill: #667085;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .04em;
    }
    .hidden-edge {
      stroke: #667085 !important;
      stroke-dasharray: 7 6;
    }
    .angle-axis, .angle-arc {
      vector-effect: non-scaling-stroke;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .angle-axis { stroke: #dc862f; stroke-width: 1.3; }
    .angle-arc { stroke: #e3a96e; stroke-width: 1.15; }
    .angle-axis-label { fill: #c17128; font-size: 13px; font-weight: 600; }
    .angle-label { fill: #a66327; font-size: 11.2px; font-weight: 600; }

    @media (max-width: 820px) {
      .app { padding-inline: 12px; }
      header { align-items: flex-start; flex-direction: column; gap: 5px; }
      .stage-readout { width: 100%; justify-content: space-between; }
      .board::before { display: none; }
      .controls { grid-template-columns: 40px minmax(0, 1fr); gap: 10px; }
      .play { width: 40px; height: 40px; }
      .tick span { display: none; }
      .tick { min-height: 18px; }
      .projection-control { width: 100%; margin-left: 0; }
      .projection-control select { min-width: 0; flex: 1; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>坐标法：画三棱锥的轴测图</h1>
      <label class="projection-control">投影
        <select id="projectionSelect" aria-label="选择轴测投影类型">
          <option value="iso">标准正等测</option>
          <option value="military">水平斜等轴测 / Y轴 −60°</option>
          <option value="militaryXMinus">水平斜等轴测 / X轴 −60°</option>
          <option value="militaryYPlus">水平斜等轴测 / Y轴 60°</option>
          <option value="militaryXPlus">水平斜等轴测 / X轴 60°</option>
          <option value="cabinet">正面斜二等轴测 / 柜式投影（左上角90°）</option>
          <option value="cabinetRight">正面斜二等轴测 / 柜式投影（右上角90°）</option>
        </select>
      </label>
      <div class="stage-readout" aria-live="polite">
        <span class="stage-index" id="stageIndex">01 / 07</span>
        <span class="stage-title" id="stageTitle">读取三视图</span>
      </div>
    </header>

    <section class="board" aria-label="三棱锥轴测图作图过程">
      <svg viewBox="0 0 1280 650" role="img" aria-labelledby="svgTitle svgDesc" preserveAspectRatio="xMidYMid meet">
        <title id="svgTitle">坐标法：画三棱锥的轴测图</title>
        <desc id="svgDesc">左侧为三棱锥的正视图、侧视图和俯视图，右侧依次确定 C、A、B、S 四个点并连接成图。</desc>

        <g id="sourceViews">
          <text class="view-tag" x="58" y="52">正视图</text>
          <path class="source-line" d="M 70 252 L 180 82 L 335 252 Z M 180 82 L 155 252" />

          <text class="view-tag" x="358" y="52">侧视图</text>
          <path class="source-line" d="M 365 252 L 420 82 L 485 252 Z" />

          <text class="view-tag" x="58" y="299">俯视图</text>
          <path class="source-line" d="M 70 318 L 180 550 L 335 318 Z M 70 318 L 175 420 L 180 550 M 175 420 L 335 318" />
        </g>

        <g id="sourceAxes" data-show="6,12" data-hide="90,100">
          <path class="axis" d="M 50 252 L 505 252 M 50 318 L 350 318 M 335 58 L 335 580 M 365 58 L 365 270" />
          <text class="axis-label" x="48" y="243">X′</text>
          <text class="axis-label" x="48" y="310">X</text>
          <text class="axis-label" x="310" y="73">Z′</text>
          <text class="axis-label" x="372" y="73">Z″</text>
          <text class="axis-label" x="340" y="577">Y</text>
          <text class="axis-label" x="484" y="243">Y″</text>
        </g>

        <g id="sourcePoints" data-show="9,15" data-hide="90,100">
          <circle class="point" cx="70" cy="252" r="6.5" />
          <circle class="point" cx="155" cy="252" r="6.5" />
          <circle class="point" cx="335" cy="252" r="6.5" />
          <circle class="point" cx="180" cy="82" r="6.5" />
          <text class="point-label" x="56" y="276">a′</text>
          <text class="point-label" x="143" y="276">b′</text>
          <text class="point-label" x="321" y="276">c′</text>
          <text class="point-label" x="170" y="69">s′</text>

          <circle class="point" cx="365" cy="252" r="6.5" />
          <circle class="point" cx="485" cy="252" r="6.5" />
          <circle class="point" cx="420" cy="82" r="6.5" />
          <text class="point-label" x="353" y="276">c″</text>
          <text class="point-label" x="473" y="276">b″</text>
          <text class="point-label" x="410" y="69">s″</text>

          <circle class="point" cx="70" cy="318" r="6.5" />
          <circle class="point" cx="180" cy="550" r="6.5" />
          <circle class="point" cx="335" cy="318" r="6.5" />
          <circle class="point" cx="175" cy="420" r="6.5" />
          <text class="point-label" x="55" y="342">a</text>
          <text class="point-label" x="170" y="578">b</text>
          <text class="point-label" x="323" y="342">c</text>
          <text class="point-label" x="181" y="417">s</text>
        </g>

        <text class="projection-caption" id="projectionCaption" x="570" y="52">标准正等测</text>

        <g id="targetAxes" data-show="12,18" data-hide="90,100">
          <path class="axis" id="axisX" />
          <path class="axis" id="axisY" />
          <path class="axis" id="axisZ" />
          <text class="axis-label" id="axisLabelX">X₁</text>
          <text class="axis-label" id="axisLabelY">Y₁</text>
          <text class="axis-label" id="axisLabelZ">Z₁</text>
          <text class="origin-label" id="originLabel">O₁</text>
        </g>

        <g id="axisAngles" data-show="12,16" data-hide="22,26" aria-label="轴间角"></g>

        <g id="object" data-show="66,76">
          <path class="object-line" id="edgeAB" />
          <path class="object-line" id="edgeBC" />
          <path class="object-line" id="edgeCA" />
          <path class="object-line" id="edgeSA" />
          <path class="object-line" id="edgeSB" />
          <path class="object-line" id="edgeSC" />
        </g>

        <g id="stageC" data-show="14,19" data-hide="90,100">
          <circle class="target-point" id="stageCPoint" r="7" />
          <text class="target-label" id="stageCLabel">C</text>
        </g>

        <g id="stageA" data-show="23,30" data-hide="90,100">
          <path class="highlight-line orange" id="stageAPath" />
          <circle class="target-point" id="stageAPoint" r="7" />
          <text class="target-label" id="stageALabel">A</text>
          <path class="highlight-line orange" d="M 70 318 L 335 318" />
        </g>

        <g id="stageB" data-show="37,44" data-hide="90,100">
          <circle class="target-point" id="stageBMid" r="5" />
          <path class="highlight-line red" id="stageBGuide" />
          <circle class="target-point" id="stageBPoint" r="7" />
          <text class="target-label" id="stageBLabel">B</text>
          <path class="highlight-line red" d="M 155 252 L 335 252 M 365 252 L 485 252" />
        </g>

        <g id="stageS" data-show="51,59" data-hide="90,100">
          <path class="highlight-line green" id="stageSPath" />
          <circle class="target-point" id="stageSPoint" r="7" />
          <text class="target-label" id="stageSLabel">S</text>
          <path class="highlight-line green" d="M 335 252 L 335 82 M 175 420 L 175 318" />
        </g>

        <g id="targetPointLabels" data-show="62,66" data-hide="90,100">
          <circle class="target-point" id="finalA" r="7" />
          <circle class="target-point" id="finalB" r="7" />
          <circle class="target-point" id="finalC" r="7" />
          <circle class="target-point" id="finalS" r="7" />
          <text class="target-label" id="finalALabel">A</text>
          <text class="target-label" id="finalBLabel">B</text>
          <text class="target-label" id="finalCLabel">C</text>
          <text class="target-label" id="finalSLabel">S</text>
        </g>
      </svg>
    </section>

    <div class="controls">
      <button class="play" id="playButton" type="button" aria-label="播放作图过程" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path id="playIcon" fill="currentColor" d="M8 5.8v12.4c0 .8.9 1.3 1.6.8l9-6.2a1 1 0 0 0 0-1.6l-9-6.2A1 1 0 0 0 8 5.8Z"/>
        </svg>
      </button>

      <div class="timeline">
        <div class="range-wrap">
          <div class="track"></div>
          <div class="track-fill" id="trackFill"></div>
          <input id="progress" type="range" min="0" max="100" step="0.1" value="0" aria-label="拖动作图时间轴" />
        </div>
        <div class="ticks">
          <button class="tick active" data-value="0" type="button"><span>读取三视图</span></button>
          <button class="tick" data-value="20" type="button"><span>确定 C 点</span></button>
          <button class="tick" data-value="34" type="button"><span>确定 A 点</span></button>
          <button class="tick" data-value="48" type="button"><span>确定 B 点</span></button>
          <button class="tick" data-value="62" type="button"><span>确定 S 点</span></button>
          <button class="tick" data-value="82" type="button"><span>连接各顶点</span></button>
          <button class="tick" data-value="100" type="button"><span>整理成图</span></button>
        </div>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const range = document.getElementById('progress');
      const fill = document.getElementById('trackFill');
      const playButton = document.getElementById('playButton');
      const playIcon = document.getElementById('playIcon');
      const stageIndex = document.getElementById('stageIndex');
      const stageTitle = document.getElementById('stageTitle');
      const ticks = [...document.querySelectorAll('.tick')];
      const animated = [...document.querySelectorAll('[data-show], [data-hide]')];
      const sourceOutlines = [...document.querySelectorAll('.source-line')];
      const objectOutlines = [...document.querySelectorAll('.object-line')];

      const stages = [
        { at: 0, title: '读取三视图' },
        { at: 8, title: '确定 C 点' },
        { at: 22, title: '确定 A 点' },
        { at: 36, title: '确定 B 点' },
        { at: 50, title: '确定 S 点' },
        { at: 64, title: '连接各顶点' },
        { at: 90, title: '整理成图' }
      ];

      const clamp01 = value => Math.max(0, Math.min(1, value));
      const smooth = value => {
        const t = clamp01(value);
        return t * t * (3 - 2 * t);
      };

      const parsePair = (value, fallbackSpan = 5) => {
        if (!value) return null;
        const parts = value.split(',').map(Number);
        return parts.length > 1 ? parts : [parts[0], parts[0] + fallbackSpan];
      };

      function render(value) {
        const p = Number(value);
        range.value = p;
        fill.style.width = `${p}%`;

        animated.forEach(element => {
          const show = parsePair(element.dataset.show);
          const hide = parsePair(element.dataset.hide);
          let opacity = 1;
          if (show) opacity *= smooth((p - show[0]) / (show[1] - show[0] || 1));
          if (hide) opacity *= 1 - smooth((p - hide[0]) / (hide[1] - hide[0] || 1));
          element.style.opacity = String(clamp01(opacity));
        });

        const finalT = smooth((p - 90) / 10);
        sourceOutlines.forEach(line => {
          line.style.strokeWidth = String(2.35 + (5.1 - 2.35) * finalT);
        });
        objectOutlines.forEach(line => {
          line.style.strokeWidth = String(2.65 + (5.1 - 2.65) * finalT);
        });

        let active = 0;
        stages.forEach((stage, index) => { if (p >= stage.at) active = index; });
        stageIndex.textContent = `${String(active + 1).padStart(2, '0')} / 07`;
        stageTitle.textContent = stages[active].title;
        ticks.forEach((tick, index) => {
          tick.classList.toggle('active', index === active);
          tick.classList.toggle('done', index < active);
        });
      }

      let playing = false;
      let animationFrame = 0;
      let lastTime = 0;

      function setPlaying(next) {
        playing = next;
        playButton.setAttribute('aria-pressed', String(next));
        playButton.setAttribute('aria-label', next ? '暂停作图过程' : '播放作图过程');
        playIcon.setAttribute('d', next
          ? 'M7 5.5h3.5v13H7zM13.5 5.5H17v13h-3.5z'
          : 'M8 5.8v12.4c0 .8.9 1.3 1.6.8l9-6.2a1 1 0 0 0 0-1.6l-9-6.2A1 1 0 0 0 8 5.8Z');
        if (next) {
          if (Number(range.value) >= 99.9) render(0);
          lastTime = performance.now();
          animationFrame = requestAnimationFrame(step);
        } else {
          cancelAnimationFrame(animationFrame);
        }
      }

      function step(now) {
        if (!playing) return;
        const delta = now - lastTime;
        lastTime = now;
        const next = Number(range.value) + delta / 105;
        if (next >= 100) {
          render(100);
          setPlaying(false);
          return;
        }
        render(next);
        animationFrame = requestAnimationFrame(step);
      }

      range.addEventListener('input', event => {
        if (playing) setPlaying(false);
        render(event.target.value);
      });
      playButton.addEventListener('click', () => setPlaying(!playing));
      ticks.forEach(tick => tick.addEventListener('click', () => {
        if (playing) setPlaying(false);
        render(tick.dataset.value);
      }));
      window.addEventListener('keydown', event => {
        if (event.code === 'Space') {
          event.preventDefault();
          setPlaying(!playing);
        }
        if (event.code === 'ArrowLeft' || event.code === 'ArrowRight') {
          event.preventDefault();
          if (playing) setPlaying(false);
          const direction = event.code === 'ArrowLeft' ? -1 : 1;
          render(Math.max(0, Math.min(100, Number(range.value) + direction * 2)));
        }
      });
      render(0);
    })();
  </script>

  <script>
    (() => {
      const select = document.getElementById('projectionSelect');
      const caption = document.getElementById('projectionCaption');
      const angleGroup = document.getElementById('axisAngles');
      const $ = id => document.getElementById(id);

      const P = {
        C: [0, 0, 0],
        A: [0.803, 0, 0],
        B: [0.443, 0.528, 0],
        S: [0.479, 0.200, 0.900]
      };

      const basis = {
        iso: {
          // 标准正等测：三轴等缩，投影缩比约 0.816:0.816:0.816，轴间角 120°/120°/120°
          x: [-Math.sqrt(1/2),  Math.sqrt(1/6)],
          y: [ Math.sqrt(1/2),  Math.sqrt(1/6)],
          z: [0, -Math.sqrt(2/3)]
        },
        // 水平斜投影中 X 射线始终向左、Y 射线始终向右。
        // 正负角表示轴线的倾角（范围 −90°～90°，逆时针为正），SVG 纵坐标向下。
        military: {
          x: [-Math.sqrt(3)/2, 0.5],
          y: [0.5, Math.sqrt(3)/2],
          z: [0, -1]
        },
        militaryXMinus: {
          x: [-0.5, -Math.sqrt(3)/2],
          y: [Math.sqrt(3)/2, -0.5],
          z: [0, -1]
        },
        militaryYPlus: {
          x: [-Math.sqrt(3)/2, -0.5],
          y: [0.5, -Math.sqrt(3)/2],
          z: [0, -1]
        },
        militaryXPlus: {
          x: [-0.5, Math.sqrt(3)/2],
          y: [Math.sqrt(3)/2, 0.5],
          z: [0, -1]
        },
        cabinet: {
          x: [-1, 0],
          y: [Math.SQRT1_2/2, Math.SQRT1_2/2],
          z: [0, -1]
        },
        cabinetRight: {
          x: [1, 0],
          y: [-Math.SQRT1_2/2, Math.SQRT1_2/2],
          z: [0, -1]
        }
      };

      const objectCenter = [900, 320];
      const objectScale = 320;
      const axisLength = 250;

      function raw(p, b) {
        return [
          p[0]*b.x[0] + p[1]*b.y[0] + p[2]*b.z[0],
          p[0]*b.x[1] + p[1]*b.y[1] + p[2]*b.z[1]
        ];
      }
      function getOrigin(b) {
        const projected = Object.values(P).map(point => raw(point, b));
        const xs = projected.map(v => v[0]);
        const ys = projected.map(v => v[1]);
        const midX = (Math.min(...xs) + Math.max(...xs)) / 2;
        const midY = (Math.min(...ys) + Math.max(...ys)) / 2;
        const origin = [
          objectCenter[0] - midX * objectScale,
          objectCenter[1] - midY * objectScale
        ];
        // 同时给坐标轴端点和点名留出空间，避免旋转后的 Z 轴越过画布上沿。
        const extents = projected.map(v => [v[0]*objectScale, v[1]*objectScale]);
        extents.push([0,0], ...[b.x,b.y,b.z].map(v => v.map(n => n*axisLength)));
        const minX = Math.min(...extents.map(v => v[0]))-30;
        const maxX = Math.max(...extents.map(v => v[0]))+30;
        const minY = Math.min(...extents.map(v => v[1]))-20;
        const maxY = Math.max(...extents.map(v => v[1]))+32;
        return [
          Math.max(570-minX, Math.min(1240-maxX, origin[0])),
          Math.max(82-minY, Math.min(610-maxY, origin[1]))
        ];
      }
      function q(p, b, origin) {
        const r = raw(p, b);
        return [origin[0] + r[0]*objectScale, origin[1] + r[1]*objectScale];
      }
      function path(a, b) {
        return `M ${a[0].toFixed(2)} ${a[1].toFixed(2)} L ${b[0].toFixed(2)} ${b[1].toFixed(2)}`;
      }
      function placePoint(id, p) {
        $(id).setAttribute('cx', p[0].toFixed(2));
        $(id).setAttribute('cy', p[1].toFixed(2));
      }
      function placeText(id, p, dx, dy) {
        $(id).setAttribute('x', (p[0] + dx).toFixed(2));
        $(id).setAttribute('y', (p[1] + dy).toFixed(2));
      }

      function drawAngles(b) {
        const O = [1130, 132], R = 42, r = 22;
        const axes = [['X',b.x],['Y',b.y],['Z',b.z]].map(([name,v]) => {
          const a = Math.atan2(v[1], v[0]);
          return {name, a, u:[Math.cos(a), Math.sin(a)]};
        });
        const rays = axes.map(o => {
          const e=[O[0]+o.u[0]*R, O[1]+o.u[1]*R];
          const t=[O[0]+o.u[0]*(R+14), O[1]+o.u[1]*(R+14)+4];
          return `<path class="angle-axis" d="M ${O[0]} ${O[1]} L ${e[0].toFixed(2)} ${e[1].toFixed(2)}"/>`+
                 `<text class="angle-axis-label" x="${t[0].toFixed(2)}" y="${t[1].toFixed(2)}" text-anchor="middle">${o.name}</text>`;
        }).join('');

        const sorted = axes.slice().sort((a,b) => a.a-b.a);
        let arcs='';
        for(let i=0;i<3;i++){
          let a0=sorted[i].a, a1=sorted[(i+1)%3].a;
          if(i===2) a1 += Math.PI*2;
          const deg=(a1-a0)*180/Math.PI;
          const p0=[O[0]+Math.cos(a0)*r,O[1]+Math.sin(a0)*r];
          const p1=[O[0]+Math.cos(a1)*r,O[1]+Math.sin(a1)*r];
          const mid=(a0+a1)/2;
          const lp=[O[0]+Math.cos(mid)*34,O[1]+Math.sin(mid)*34+4];
          const label=(Math.abs(deg-Math.round(deg))<0.05?Math.round(deg):deg.toFixed(1))+'°';
          arcs += `<path class="angle-arc" d="M ${p0[0].toFixed(2)} ${p0[1].toFixed(2)} A ${r} ${r} 0 ${deg>180?1:0} 1 ${p1[0].toFixed(2)} ${p1[1].toFixed(2)}"/>`+
                  `<text class="angle-label" x="${lp[0].toFixed(2)}" y="${lp[1].toFixed(2)}" text-anchor="middle">${label}</text>`;
        }
        angleGroup.innerHTML = `<circle cx="${O[0]}" cy="${O[1]}" r="2.3" fill="#ed8b33"/>${rays}${arcs}`;
      }

      function visibleEdgeKeys(b) {
        const cross = (a, c) => [a[1]*c[2]-a[2]*c[1], a[2]*c[0]-a[0]*c[2], a[0]*c[1]-a[1]*c[0]];
        const sub = (a, c) => a.map((v, i) => v-c[i]);
        const dot = (a, c) => a.reduce((sum, v, i) => sum+v*c[i], 0);
        // 取从水平投影面上方观察的投射方向，并按相邻面的朝向判定可见棱。
        let view = cross([b.x[0], b.y[0], b.z[0]], [b.x[1], b.y[1], b.z[1]]);
        if (view[2] < 0) view = view.map(v => -v);
        const keys = new Set();
        [['ABC','S'], ['ACS','B'], ['ABS','C'], ['BCS','A']].forEach(([face, opposite]) => {
          const [a, c, d] = [...face].map(n => P[n]);
          let normal = cross(sub(c,a), sub(d,a));
          if (dot(normal, sub(P[opposite],a)) > 0) normal = normal.map(v => -v);
          if (dot(normal, view) > 1e-9) {
            for (let i=0; i<3; i++) keys.add([face[i], face[(i+1)%3]].sort().join(''));
          }
        });
        return keys;
      }

      function updateProjection() {
        const key = select.value;
        const b = basis[key];
        const O = getOrigin(b);
        caption.textContent = select.options[select.selectedIndex].text;
        const Q = Object.fromEntries(Object.entries(P).map(([name,p]) => [name,q(p,b,O)]));

        [['X',b.x],['Y',b.y],['Z',b.z]].forEach(([name,v]) => {
          const mag=Math.hypot(v[0],v[1]) || 1;
          const u=[v[0]/mag,v[1]/mag];
          const len = axisLength * mag;
          const e=[O[0]+u[0]*len, O[1]+u[1]*len];
          $('axis'+name).setAttribute('d', path(O,e));
          placeText('axisLabel'+name,e,u[0]*11,u[1]*11+5);
        });
        placeText('originLabel',O,10,-10);

        const edges=[
          ['A','B','edgeAB'],['B','C','edgeBC'],['C','A','edgeCA'],
          ['S','A','edgeSA'],['S','B','edgeSB'],['S','C','edgeSC']
        ];
        const visible = visibleEdgeKeys(b);
        edges.forEach(([a,c,id]) => {
          $(id).setAttribute('d', visible.has([a,c].sort().join('')) ? path(Q[a],Q[c]) : '');
        });

        placePoint('stageCPoint',Q.C);
        placeText('stageCLabel',Q.C,12,22);

        $('stageAPath').setAttribute('d',path(Q.C,Q.A));
        placePoint('stageAPoint',Q.A);
        placeText('stageALabel',Q.A,-24,28);

        const QBx=q([P.B[0],0,0],b,O);
        placePoint('stageBMid',QBx);
        $('stageBGuide').setAttribute('d',path(QBx,Q.B));
        placePoint('stageBPoint',Q.B);
        placeText('stageBLabel',Q.B,9,28);

        const QSx=q([P.S[0],0,0],b,O);
        const QSxy=q([P.S[0],P.S[1],0],b,O);
        $('stageSPath').setAttribute('d',`M ${QSx[0].toFixed(2)} ${QSx[1].toFixed(2)} L ${QSxy[0].toFixed(2)} ${QSxy[1].toFixed(2)} L ${Q.S[0].toFixed(2)} ${Q.S[1].toFixed(2)}`);
        placePoint('stageSPoint',Q.S);
        placeText('stageSLabel',Q.S,-25,-12);

        [['A',-24,28],['B',9,28],['C',12,22],['S',-25,-12]].forEach(([n,dx,dy]) => {
          placePoint('final'+n,Q[n]);
          placeText('final'+n+'Label',Q[n],dx,dy);
        });

        drawAngles(b);
        const p = document.getElementById('progress').value;
        // 调用原时间轴 render 的同等效果：触发 input 事件即可刷新各阶段可见性。
        document.getElementById('progress').dispatchEvent(new Event('input',{bubbles:true}));
      }

      select.addEventListener('change', updateProjection);
      updateProjection();
    })();
  </script>

</body>
</html>
