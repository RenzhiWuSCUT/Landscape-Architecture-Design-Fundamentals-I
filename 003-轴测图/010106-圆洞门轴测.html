<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>圆洞门：逐点定位后圈</title>
  <style>
    :root {
      --ink: #101828;
      --muted: #667085;
      --line: #dfe4ea;
      --blue: #1677ff;
      --orange: #f08a24;
      --red: #ef476f;
      --green: #20a464;
      --violet: #8854d0;
      --paper: #fff;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
      font-family: "Microsoft YaHei", "微软雅黑", "PingFang SC", Arial, sans-serif;
    }

    button,
    input { font: inherit; }

    .app {
      min-height: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: clamp(10px, 1.6vh, 18px);
      padding: clamp(18px, 2.8vh, 30px) clamp(18px, 3vw, 42px) clamp(16px, 2.2vh, 24px);
      background: #fff;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      max-width: 1480px;
      width: 100%;
      margin: 0 auto;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 2.2vw, 34px);
      line-height: 1.2;
      letter-spacing: -.035em;
      font-weight: 700;
    }

    .stage-readout {
      display: flex;
      align-items: baseline;
      gap: 12px;
      white-space: nowrap;
    }

    .stage-index {
      color: var(--blue);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .12em;
    }

    .stage-title {
      color: var(--muted);
      font-size: 15px;
      font-weight: 600;
    }

    .board {
      position: relative;
      min-height: 0;
      max-width: 1480px;
      width: 100%;
      margin: 0 auto;
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      background: #fff;
    }

    .board::before {
      content: "";
      position: absolute;
      left: 41%;
      top: 4%;
      bottom: 4%;
      width: 1px;
      background: #edf0f3;
      pointer-events: none;
    }

    svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    svg text {
      font-family: "Microsoft YaHei", "微软雅黑", "PingFang SC", Arial, sans-serif;
      user-select: none;
    }

    .view-tag {
      fill: var(--muted);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .12em;
    }

    .source-line,
    .object-line,
    .axis,
    .guide-line,
    .highlight-line {
      vector-effect: non-scaling-stroke;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .source-line { stroke: #27364a; stroke-width: 2.35; }
    .object-line { stroke: #111827; stroke-width: 2.65; }
    .axis { stroke: var(--blue); stroke-width: 1.6; }
    .guide-line { stroke: #98a2b3; stroke-width: 1.35; }
    .highlight-line { stroke-width: 3.1; }
    .orange { stroke: var(--orange); }
    .red { stroke: var(--red); }
    .green { stroke: var(--green); }

    .axis-label {
      fill: var(--blue);
      font-size: 18px;
      font-weight: 700;
      font-style: italic;
    }

    .point {
      fill: #fff;
      stroke: #e4572e;
      stroke-width: 2.4;
      vector-effect: non-scaling-stroke;
    }

    .target-point {
      fill: var(--red);
      stroke: #fff;
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }

    .origin-point {
      fill: #fff;
      stroke: var(--violet);
      stroke-width: 2.4;
      vector-effect: non-scaling-stroke;
    }

    .point-label {
      fill: #e4572e;
      font-size: 16px;
      font-weight: 700;
      font-style: italic;
    }

    .target-label {
      fill: #344054;
      font-size: 17px;
      font-weight: 700;
      font-style: italic;
    }

    .origin-label {
      fill: var(--violet);
      font-size: 16px;
      font-weight: 700;
      font-style: italic;
    }

    [data-draw],
    [data-show],
    [data-hide] { opacity: 0; }

    .controls {
      max-width: 1480px;
      width: 100%;
      margin: 0 auto;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 18px;
      align-items: center;
    }

    .play {
      width: 46px;
      height: 46px;
      border: 1px solid #cfd6df;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      transition: border-color .18s ease, color .18s ease, background .18s ease;
    }

    .play:hover,
    .play:focus-visible {
      border-color: var(--blue);
      color: var(--blue);
      background: #f7fbff;
      outline: none;
    }

    .play svg { width: 18px; height: 18px; }
    .timeline { min-width: 0; }

    .range-wrap {
      position: relative;
      height: 22px;
      display: flex;
      align-items: center;
    }

    .track,
    .track-fill {
      position: absolute;
      left: 0;
      right: 0;
      top: 10px;
      height: 4px;
      border-radius: 99px;
      pointer-events: none;
    }

    .track { background: #e6eaf0; }
    .track-fill { right: auto; width: 0; background: var(--blue); }

    input[type="range"] {
      position: relative;
      z-index: 2;
      width: 100%;
      margin: 0;
      height: 22px;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      cursor: ew-resize;
    }

    input[type="range"]::-webkit-slider-runnable-track { height: 4px; background: transparent; }
    input[type="range"]::-moz-range-track { height: 4px; background: transparent; }

    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      margin-top: -7px;
      border: 3px solid var(--blue);
      border-radius: 50%;
      background: #fff;
    }

    input[type="range"]::-moz-range-thumb {
      width: 13px;
      height: 13px;
      border: 3px solid var(--blue);
      border-radius: 50%;
      background: #fff;
    }

    input[type="range"]:focus-visible { outline: none; }

    .ticks {
      display: grid;
      grid-template-columns: repeat(13, 1fr);
      margin-top: 6px;
    }

    .tick {
      position: relative;
      min-width: 0;
      padding-top: 10px;
      border: 0;
      background: transparent;
      color: #98a2b3;
      font-size: 10.5px;
      line-height: 1.25;
      text-align: center;
      cursor: pointer;
      transition: color .18s ease;
    }

    .tick::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      transform: translateX(-50%);
      background: #cfd6df;
    }

    .tick:first-child { text-align: left; }
    .tick:first-child::before { left: 0; transform: none; }
    .tick:last-child { text-align: right; }
    .tick:last-child::before { left: auto; right: 0; transform: none; }
    .tick.done,
    .tick.active { color: var(--blue); }
    .tick.done::before,
    .tick.active::before { background: var(--blue); }
    .tick.active { font-weight: 700; }

    @media (max-width: 820px) {
      .app { padding-inline: 12px; }
      header { align-items: flex-start; flex-direction: column; gap: 5px; }
      .stage-readout { width: 100%; justify-content: space-between; }
      .board::before { display: none; }
      .controls { grid-template-columns: 40px minmax(0, 1fr); gap: 10px; }
      .play { width: 40px; height: 40px; }
      .tick span { display: none; }
      .tick { min-height: 18px; }
    }
  </style>
</head>

    <div class="controls">
      <button class="play" id="playButton" type="button" aria-label="播放作图过程" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path id="playIcon" fill="currentColor" d="M8 5.8v12.4c0 .8.9 1.3 1.6.8l9-6.2a1 1 0 0 0 0-1.6l-9-6.2A1 1 0 0 0 8 5.8Z"/>
        </svg>
      </button>

      <div class="timeline">
        <div class="range-wrap">
          <div class="track"></div>
          <div class="track-fill" id="trackFill"></div>
          <input id="progress" type="range" min="0" max="100" step="0.1" value="0" aria-label="拖动作图时间轴" />
        </div>
        <div class="ticks"><button class="tick" data-value="0" type="button"><span>读取正投影图</span></button><button class="tick" data-value="12" type="button"><span>画墙体盒子</span></button><button class="tick" data-value="17" type="button"><span>定位前圆心</span></button><button class="tick" data-value="24" type="button"><span>画外接方形</span></button><button class="tick" data-value="40" type="button"><span>画前圈</span></button><button class="tick" data-value="44" type="button"><span>读取墙厚</span></button><button class="tick" data-value="49" type="button"><span>定位后圆心</span></button><button class="tick" data-value="54.8" type="button"><span>转移四个主点</span></button><button class="tick" data-value="62" type="button"><span>转移四个斜向点</span></button><button class="tick" data-value="69" type="button"><span>连接后圈</span></button><button class="tick" data-value="75" type="button"><span>补门脚</span></button><button class="tick" data-value="86" type="button"><span>判遮挡补台阶</span></button><button class="tick" data-value="96" type="button"><span>擦除辅助线</span></button><button class="tick" data-value="100" type="button"><span>整理成图</span></button></div>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const range = document.getElementById('progress');
      const fill = document.getElementById('trackFill');
      const playButton = document.getElementById('playButton');
      const playIcon = document.getElementById('playIcon');
      const stageIndex = document.getElementById('stageIndex');
      const stageTitle = document.getElementById('stageTitle');
      const ticks = [...document.querySelectorAll('.tick')];
      const animated = [...document.querySelectorAll('[data-show], [data-hide]')];
      const sourceOutlines = [...document.querySelectorAll('.source-line')];
      const objectOutlines = [...document.querySelectorAll('.object-line')];

      const stages = [
        {"at": 0, "title": "读取正投影图", "note": "前圈和后圈是同一圆洞在墙体两侧的轮廓。", "hint": "先确定前圈，再把对应点沿进深方向移到后墙面。"},
        {"at": 2, "title": "画墙体盒子", "note": "按正视图取墙宽和墙高，按俯视图取墙厚 d。", "hint": "采用正面斜二测：正面保持原形，进深沿 Y 轴取半长。"},
        {"at": 13, "title": "定位前圆心", "note": "从墙角沿 X 取 x₀，再沿 Z 取 z₀，定位前圆心 O。", "hint": "O = (x₀, 0, z₀)，两段距离都来自正视图。"},
        {"at": 18, "title": "画外接方形", "note": "以 O 为中心，左右、上下各取半径 R，画外接方形。", "hint": "方形宽、高均为 2R；前圈位于墙体前表面。"},
        {"at": 25, "title": "画前圈", "note": "按正视图标出圆上控制点，再连接前圈。", "hint": "此时先保留完整圆，下部门脚最后修整。"},
        {"at": 41, "title": "读取墙厚", "note": "俯视图中两道墙边之间的距离就是墙厚 d。", "hint": "图上沿 Y 轴取 d/2，不能直接画成 d。"},
        {"at": 45, "title": "定位后圆心", "note": "从 O 作平行 Y 轴的线，取 d/2，得到后圆心 O′。", "hint": "O′ = (x₀, d, z₀)：横坐标和高度不变，只增加进深。"},
        {"at": 50, "title": "转移四个主点", "note": "先把前圈的上、右、下、左四个主控制点沿 Y 轴转移到后墙面。", "hint": "每个点都沿同一方向取相同的 d/2，得到后圈的四个主点。"},
        {"at": 55, "title": "转移四个斜向点", "note": "再把前圈的四个斜向控制点沿 Y 轴逐一转移到后墙面。", "hint": "至此后圈的 8 个控制点全部由前圈对应点精确推出，不靠目测。"},
        {"at": 63, "title": "连接后圈", "note": "按转移后的 8 个控制点依次连成后圈。", "hint": "后圈与前圈半径相同，位置完全由墙厚方向的平移决定。"},
        {"at": 71, "title": "补门脚", "note": "按正视图定位两个门脚，再沿 Y 轴转移到后表面。", "hint": "下部门脚也采用相同的进深，不凭目测定位。"},
        {"at": 76, "title": "判遮挡补台阶", "note": "只描实透过前洞口能看见的后圈，再连接洞深和台阶。", "hint": "被前墙遮挡的后圈暂作辅助线保留，下一步擦除。"},
        {"at": 88, "title": "擦除辅助线", "note": "擦掉圆下部多余弧段、被遮挡的后圈和取点辅助线。", "hint": "保留前圈、可见后圈、洞内侧边、门脚和台阶。"},
        {"at": 97, "title": "整理成图", "note": "后圈的位置来自同一个进深位移；两圈没有大小变化。", "hint": "同向线平行，图上不存在近大远小的透视缩放。"}
      ];

      const clamp01 = value => Math.max(0, Math.min(1, value));
      const smooth = value => {
        const t = clamp01(value);
        return t * t * (3 - 2 * t);
      };

      const parsePair = (value, fallbackSpan = 5) => {
        if (!value) return null;
        const parts = value.split(',').map(Number);
        return parts.length > 1 ? parts : [parts[0], parts[0] + fallbackSpan];
      };

      function render(value) {
        const p = Number(value);
        range.value = p;
        fill.style.width = `${p}%`;

        animated.forEach(element => {
          const show = parsePair(element.dataset.show);
          const hide = parsePair(element.dataset.hide);
          let opacity = 1;
          if (show) opacity *= smooth((p - show[0]) / (show[1] - show[0] || 1));
          if (hide) opacity *= 1 - smooth((p - hide[0]) / (hide[1] - hide[0] || 1));
          element.style.opacity = String(clamp01(opacity));
        });

        document.querySelectorAll('[data-draw]').forEach(line => {
          const [a,b] = line.dataset.draw.split(',').map(Number);
          const draw = smooth((p-a)/(b-a));
          let erase = 0;
          if (line.dataset.erase) {
            const [c,d] = line.dataset.erase.split(',').map(Number);
            erase = smooth((p-c)/(d-c));
          }
          const length = Math.max(0,draw-erase);
          line.style.strokeDasharray = length >= 0.99999 ? 'none' : `${length} 2`;
          line.style.strokeDashoffset = String(-erase);
          line.style.opacity = length > 0.00001 ? '1' : '0';
          line.style.stroke = p > a && p < b ? '#f08a24' : '';
        });
        const finalT = smooth((p - 90) / 10);
        sourceOutlines.forEach(line => {
          line.style.strokeWidth = String(2.35 + (2.8 - 2.35) * finalT);
        });
        objectOutlines.forEach(line => {
          line.style.strokeWidth = String(2.65 + (3.15 - 2.65) * finalT);
        });

        let active = 0;
        stages.forEach((stage, index) => { if (p >= stage.at) active = index; });
        stageIndex.textContent = `${String(active + 1).padStart(2, '0')} / 14`;
        stageTitle.textContent = stages[active].title;
        document.getElementById('stepNote').textContent = stages[active].note;
        document.getElementById('stepHint').textContent = stages[active].hint;
        ticks.forEach((tick, index) => {
          tick.classList.toggle('active', index === active);
          tick.classList.toggle('done', index < active);
        });
      }

      let playing = false;
      let animationFrame = 0;
      let lastTime = 0;
      let playbackValue = 0;

      function setPlaying(next) {
        playing = next;
        playButton.setAttribute('aria-pressed', String(next));
        playButton.setAttribute('aria-label', next ? '暂停作图过程' : '播放作图过程');
        playIcon.setAttribute('d', next
          ? 'M7 5.5h3.5v13H7zM13.5 5.5H17v13h-3.5z'
          : 'M8 5.8v12.4c0 .8.9 1.3 1.6.8l9-6.2a1 1 0 0 0 0-1.6l-9-6.2A1 1 0 0 0 8 5.8Z');
        if (next) {
          if (Number(range.value) >= 99.9) render(0);
          playbackValue = Number(range.value);
          lastTime = performance.now();
          animationFrame = requestAnimationFrame(step);
        } else {
          cancelAnimationFrame(animationFrame);
        }
      }

      function step(now) {
        if (!playing) return;
        const delta = now - lastTime;
        lastTime = now;
        const next = playbackValue + Math.min(delta, 80) / 420;
        playbackValue = next;
        if (next >= 100) {
          render(100);
          setPlaying(false);
          return;
        }
        render(next);
        animationFrame = requestAnimationFrame(step);
      }

      range.addEventListener('input', event => {
        if (playing) setPlaying(false);
        render(event.target.value);
      });
      playButton.addEventListener('click', () => setPlaying(!playing));
      ticks.forEach(tick => tick.addEventListener('click', () => {
        if (playing) setPlaying(false);
        render(tick.dataset.value);
      }));
      window.addEventListener('keydown', event => {
        if (event.code === 'Space') {
          event.preventDefault();
          setPlaying(!playing);
        }
        if (event.code === 'ArrowLeft' || event.code === 'ArrowRight') {
          event.preventDefault();
          if (playing) setPlaying(false);
          const direction = event.code === 'ArrowLeft' ? -1 : 1;
          render(Math.max(0, Math.min(100, Number(range.value) + direction * 2)));
        }
      });
      render(0);
    })();
  </script>
</body>
</html>
