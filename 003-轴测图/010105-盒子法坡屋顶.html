<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>盒子法：逐点定位坡屋顶</title>
  <style>
    :root {
      --ink: #101828;
      --muted: #667085;
      --line: #dfe4ea;
      --blue: #1677ff;
      --orange: #f08a24;
      --red: #ef476f;
      --green: #20a464;
      --violet: #8854d0;
      --paper: #fff;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
      font-family: "Microsoft YaHei", "微软雅黑", "PingFang SC", Arial, sans-serif;
    }

    button,
    input { font: inherit; }

    .app {
      min-height: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: clamp(10px, 1.6vh, 18px);
      padding: clamp(18px, 2.8vh, 30px) clamp(18px, 3vw, 42px) clamp(16px, 2.2vh, 24px);
      background: #fff;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      max-width: 1480px;
      width: 100%;
      margin: 0 auto;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 2.2vw, 34px);
      line-height: 1.2;
      letter-spacing: -.035em;
      font-weight: 700;
    }

    .stage-readout {
      display: flex;
      align-items: baseline;
      gap: 12px;
      white-space: nowrap;
    }

    .stage-index {
      color: var(--blue);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .12em;
    }

    .stage-title {
      color: var(--muted);
      font-size: 15px;
      font-weight: 600;
    }

    .board {
      position: relative;
      min-height: 0;
      max-width: 1480px;
      width: 100%;
      margin: 0 auto;
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      background: #fff;
    }

    .board::before {
      content: "";
      position: absolute;
      left: 41%;
      top: 4%;
      bottom: 4%;
      width: 1px;
      background: #edf0f3;
      pointer-events: none;
    }

    svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    svg text {
      font-family: "Microsoft YaHei", "微软雅黑", "PingFang SC", Arial, sans-serif;
      user-select: none;
    }

    .view-tag {
      fill: var(--muted);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .12em;
    }

    .source-line,
    .object-line,
    .axis,
    .guide-line,
    .highlight-line {
      vector-effect: non-scaling-stroke;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .source-line { stroke: #27364a; stroke-width: 2.35; }
    .object-line { stroke: #111827; stroke-width: 2.65; }
    .axis { stroke: var(--blue); stroke-width: 1.6; }
    .guide-line { stroke: #98a2b3; stroke-width: 1.35; }
    .highlight-line { stroke-width: 3.1; }
    .orange { stroke: var(--orange); }
    .red { stroke: var(--red); }
    .green { stroke: var(--green); }

    .axis-label {
      fill: var(--blue);
      font-size: 18px;
      font-weight: 700;
      font-style: italic;
    }

    .point {
      fill: #fff;
      stroke: #e4572e;
      stroke-width: 2.4;
      vector-effect: non-scaling-stroke;
    }

    .target-point {
      fill: var(--red);
      stroke: #fff;
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }

    .origin-point {
      fill: #fff;
      stroke: var(--violet);
      stroke-width: 2.4;
      vector-effect: non-scaling-stroke;
    }

    .point-label {
      fill: #e4572e;
      font-size: 16px;
      font-weight: 700;
      font-style: italic;
    }

    .target-label {
      fill: #344054;
      font-size: 17px;
      font-weight: 700;
      font-style: italic;
    }

    .origin-label {
      fill: var(--violet);
      font-size: 16px;
      font-weight: 700;
      font-style: italic;
    }

    [data-draw],
    [data-show],
    [data-hide] { opacity: 0; }

    .controls {
      max-width: 1480px;
      width: 100%;
      margin: 0 auto;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 18px;
      align-items: center;
    }

    .play {
      width: 46px;
      height: 46px;
      border: 1px solid #cfd6df;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      transition: border-color .18s ease, color .18s ease, background .18s ease;
    }

    .play:hover,
    .play:focus-visible {
      border-color: var(--blue);
      color: var(--blue);
      background: #f7fbff;
      outline: none;
    }

    .play svg { width: 18px; height: 18px; }
    .timeline { min-width: 0; }

    .range-wrap {
      position: relative;
      height: 22px;
      display: flex;
      align-items: center;
    }

    .track,
    .track-fill {
      position: absolute;
      left: 0;
      right: 0;
      top: 10px;
      height: 4px;
      border-radius: 99px;
      pointer-events: none;
    }

    .track { background: #e6eaf0; }
    .track-fill { right: auto; width: 0; background: var(--blue); }

    input[type="range"] {
      position: relative;
      z-index: 2;
      width: 100%;
      margin: 0;
      height: 22px;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      cursor: ew-resize;
    }

    input[type="range"]::-webkit-slider-runnable-track { height: 4px; background: transparent; }
    input[type="range"]::-moz-range-track { height: 4px; background: transparent; }

    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      margin-top: -7px;
      border: 3px solid var(--blue);
      border-radius: 50%;
      background: #fff;
    }

    input[type="range"]::-moz-range-thumb {
      width: 13px;
      height: 13px;
      border: 3px solid var(--blue);
      border-radius: 50%;
      background: #fff;
    }

    input[type="range"]:focus-visible { outline: none; }

    .ticks {
      column-gap: 3px;
      display: grid;
      grid-template-columns: repeat(14, 1fr);
      margin-top: 6px;
    }

    .tick {
      position: relative;
      min-width: 0;
      padding-top: 10px;
      border: 0;
      background: transparent;
      color: #98a2b3;
      font-size: 11px;
      line-height: 1.25;
      text-align: center;
      cursor: pointer;
      transition: color .18s ease;
    }

    .tick::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      transform: translateX(-50%);
      background: #cfd6df;
    }

    .tick:first-child { text-align: left; }
    .tick:first-child::before { left: 0; transform: none; }
    .tick:last-child { text-align: right; }
    .tick:last-child::before { left: auto; right: 0; transform: none; }
    .tick.done,
    .tick.active { color: var(--blue); }
    .tick.done::before,
    .tick.active::before { background: var(--blue); }
    .tick.active { font-weight: 700; }

    @media (max-width: 820px) {
      .app { padding-inline: 12px; }
      header { align-items: flex-start; flex-direction: column; gap: 5px; }
      .stage-readout { width: 100%; justify-content: space-between; }
      .board::before { display: none; }
      .controls { grid-template-columns: 40px minmax(0, 1fr); gap: 10px; }
      .play { width: 40px; height: 40px; }
      .tick span { display: none; }
      .tick { min-height: 18px; }
    }
  .projection-control{display:flex;align-items:center;gap:8px;font-size:13px;color:#667085;white-space:nowrap}.projection-control select{font:inherit;color:#344054;background:#fff;border:1px solid #dfe4ea;border-radius:7px;padding:8px;max-width:100%}header{flex-wrap:wrap;gap:10px 20px}h1{font-size:clamp(21px,2vw,30px)}@media(max-width:700px){.projection-control{width:100%}.projection-control select{min-width:0;flex:1}}
</style>

    <div class="controls">
      <button class="play" id="playButton" type="button" aria-label="播放作图过程" aria-pressed="false">

          <path id="playIcon" fill="currentColor" d="M8 5.8v12.4c0 .8.9 1.3 1.6.8l9-6.2a1 1 0 0 0 0-1.6l-9-6.2A1 1 0 0 0 8 5.8Z"/>

      <div class="timeline">
        <div class="range-wrap">
          <div class="track"></div>
          <div class="track-fill" id="trackFill"></div>
          <input id="progress" type="range" min="0" max="100" step="0.1" value="0" aria-label="拖动作图时间轴" />
        </div>
        <div class="ticks"><button class="tick" data-value="0" type="button"><span>读取三视图</span></button><button class="tick" data-value="9" type="button"><span>画主体盒子</span></button><button class="tick" data-value="14" type="button"><span>标顶面四角</span></button><button class="tick" data-value="22" type="button"><span>沿 X 取出檐</span></button><button class="tick" data-value="30" type="button"><span>沿 Y 取出檐</span></button><button class="tick" data-value="37" type="button"><span>连接下底面</span></button><button class="tick" data-value="45" type="button"><span>竖向取厚度</span></button><button class="tick" data-value="51" type="button"><span>连接上顶面</span></button><button class="tick" data-value="58" type="button"><span>取两端中点</span></button><button class="tick" data-value="66" type="button"><span>量屋脊高度</span></button><button class="tick" data-value="71" type="button"><span>连接屋脊</span></button><button class="tick" data-value="86" type="button"><span>连接坡屋面</span></button><button class="tick" data-value="96" type="button"><span>擦除辅助线</span></button><button class="tick" data-value="100" type="button"><span>整理成图</span></button></div>

  <script>
    (() => {
      const range = document.getElementById('progress');
      const fill = document.getElementById('trackFill');
      const playButton = document.getElementById('playButton');
      const playIcon = document.getElementById('playIcon');
      const stageIndex = document.getElementById('stageIndex');
      const stageTitle = document.getElementById('stageTitle');
      const ticks = [...document.querySelectorAll('.tick')];
      const animated = [...document.querySelectorAll('[data-show], [data-hide]')];
      const sourceOutlines = [...document.querySelectorAll('.source-line')];
      const objectOutlines = [...document.querySelectorAll('.object-line')];

      const stages = [{"at": 0, "title": "读取三视图", "note": "先读出檐口下缘高度 H、出檐 a 和 b、竖向厚度 t、起坡高度 h。", "hint": "X、Y、Z 方向按相同比例取长；同向线始终平行。"}, {"at": 2, "title": "画主体盒子", "note": "先画主体辅助盒子，顶面取檐口下缘高度 H。", "hint": "该顶面是取点基准，坡屋顶和山墙轮廓随后补齐。"}, {"at": 10, "title": "标顶面四角", "note": "标出盒子顶面 P₁、P₂、P₃、P₄，四点高度相同。", "hint": "屋顶下底面也在这个高度上，先不增加高度。"}, {"at": 15, "title": "沿 X 取出檐", "note": "P₁、P₄ 沿 −X，P₂、P₃ 沿 +X，各取出檐距离 a。", "hint": "只改变 X 坐标，Y 坐标和高度不变。"}, {"at": 23, "title": "沿 Y 取出檐", "note": "前侧两点沿 −Y，后侧两点沿 +Y，各取出檐距离 b。", "hint": "得到 A、B、C、D；例如 A = P₁ − aX − bY。"}, {"at": 31, "title": "连接下底面", "note": "依次连接 A—B—C—D，得到平屋顶下底面。", "hint": "AB、CD 平行 X；AD、BC 平行 Y；四点高度仍为 H。"}, {"at": 38, "title": "竖向取厚度", "note": "从 A、B、C、D 分别沿 +Z 取竖向厚度 t。", "hint": "得到 A′、B′、C′、D′；平面坐标不变，高度为 H + t。"}, {"at": 46, "title": "连接上顶面", "note": "依次连接 A′—B′—C′—D′，得到平屋顶上顶面。", "hint": "它是下底面整体竖直上移 t，长、宽和出檐都不变。"}, {"at": 53, "title": "取两端中点", "note": "取 A′D′ 的中点 M、B′C′ 的中点 N。", "hint": "两边各分成相等两段；MN 是屋脊在平屋顶上的位置。"}, {"at": 59, "title": "量屋脊高度", "note": "从 M、N 沿 +Z 量取侧视图中的起坡高度 h，得到 R、S。", "hint": "R、S 高度为 H + t + h，平面位置与 M、N 相同。"}, {"at": 67, "title": "连接屋脊", "note": "连接 R、S，得到屋脊。", "hint": "RS 与 MN 平行，也与屋檐的长度方向平行。"}, {"at": 72, "title": "连接坡屋面", "note": "R 连 A′、D′；S 连 B′、C′，形成两个坡屋面。", "hint": "再从 R 向下取 t 得 R′，连接 R′A、R′D，补出檐口厚度。"}, {"at": 88, "title": "擦除辅助线", "note": "擦除取点线、原平屋顶横线和被屋檐遮挡的墙体线。", "hint": "保留屋脊、坡屋面、檐口和可见墙体轮廓。"}, {"at": 97, "title": "整理成图", "note": "同一轴向的线始终平行，远近位置不改变长度比例。", "hint": "这是正等轴测图，不设透视消失点。"}];

      const clamp01 = value => Math.max(0, Math.min(1, value));
      const smooth = value => {
        const t = clamp01(value);
        return t * t * (3 - 2 * t);
      };

      const parsePair = (value, fallbackSpan = 5) => {
        if (!value) return null;
        const parts = value.split(',').map(Number);
        return parts.length > 1 ? parts : [parts[0], parts[0] + fallbackSpan];
      };

      function render(value) {
        const p = Number(value);
        range.value = p;
        fill.style.width = `${p}%`;

        animated.forEach(element => {
          const show = parsePair(element.dataset.show);
          const hide = parsePair(element.dataset.hide);
          let opacity = 1;
          if (show) opacity *= smooth((p - show[0]) / (show[1] - show[0] || 1));
          if (hide) opacity *= 1 - smooth((p - hide[0]) / (hide[1] - hide[0] || 1));
          element.style.opacity = String(clamp01(opacity));
        });

        document.querySelectorAll('[data-draw]').forEach(line => {
          const [a,b] = line.dataset.draw.split(',').map(Number);
          const draw = smooth((p-a)/(b-a));
          let erase = 0;
          if (line.dataset.erase) {
            const [c,d] = line.dataset.erase.split(',').map(Number);
            erase = smooth((p-c)/(d-c));
          }
          const length = Math.max(0,draw-erase);
          line.style.strokeDasharray = length >= 0.99999 ? 'none' : `${length} 2`;
          line.style.strokeDashoffset = String(-erase);
          line.style.opacity = length > 0.00001 ? '1' : '0';
          line.style.stroke = p > a && p < b ? '#f08a24' : '';
        });
        const finalT = smooth((p - 90) / 10);
        sourceOutlines.forEach(line => {
          line.style.strokeWidth = String(2.35 + (2.8 - 2.35) * finalT);
        });
        objectOutlines.forEach(line => {
          line.style.strokeWidth = String(2.65 + (3.15 - 2.65) * finalT);
        });

        let active = 0;
        stages.forEach((stage, index) => { if (p >= stage.at) active = index; });
        stageIndex.textContent = `${String(active + 1).padStart(2, '0')} / 14`;
        stageTitle.textContent = stages[active].title;
        document.getElementById('stepNote').textContent = stages[active].note;
